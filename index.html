<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0b" />
<link rel="manifest" href="manifest.json" />
<title>THE WORK</title>
<style>
  :root{
    --bg:#0a0a0b; --panel:#141416; --panel-2:#1c1c1f; --line:#2a2a2e;
    --ink:#f4f2ef; --muted:#8b8a90; --faint:#5a5a60;
    --blood:#8e1b1b; --blood-2:#b52323; --blood-soft:#2a1414;
    --gold:#c9a24b;
    --fair:#3f9e6d; --miss:#c0603f;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-family:"Archivo",sans-serif; font-weight:800; margin:0; letter-spacing:-.01em}
  .display{font-family:"Archivo",sans-serif; font-weight:900; letter-spacing:-.02em; text-transform:uppercase}
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit; font-size:16px}
  .wrap{max-width:1120px; margin:0 auto; padding:0 16px}
  a{color:var(--blood-2)}

  /* header */
  header{
    background:linear-gradient(180deg,#111 0%,var(--bg) 100%);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:30;
    padding-top:env(safe-area-inset-top);
  }
  header .wrap{display:flex; align-items:center; gap:12px; padding-top:12px; padding-bottom:12px}
  .mark{display:flex; align-items:center; gap:10px}
  .mark .bar{width:4px; height:26px; background:var(--blood-2); border-radius:2px}
  .brand{font-family:"Archivo"; font-weight:900; font-size:20px; text-transform:uppercase; letter-spacing:.02em}
  .brand em{color:var(--blood-2); font-style:normal}
  .whoami{margin-left:auto; display:flex; align-items:center; gap:12px; font-size:13px; color:var(--muted)}
  .rolechip{border:1px solid var(--line); color:var(--ink); padding:3px 10px; border-radius:999px; font-size:11px; text-transform:uppercase; letter-spacing:.06em}
  .signout{background:none; border:0; color:var(--muted); font-size:13px; text-decoration:underline}

  /* auth */
  .auth{min-height:88vh; display:flex; align-items:center; justify-content:center; padding:24px 16px}
  .authcard{width:100%; max-width:420px}
  .kicker{color:var(--blood-2); font-size:12px; letter-spacing:.28em; text-transform:uppercase; font-weight:700; margin-bottom:14px}
  .authcard h1{font-size:44px; line-height:.95; text-transform:uppercase; font-weight:900; letter-spacing:-.02em; margin-bottom:10px}
  .authcard h1 em{color:var(--blood-2); font-style:normal}
  .authcard .sub{color:var(--muted); font-size:14px; margin-bottom:24px; max-width:34ch}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:11px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.08em}
  .field input,.field select{width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:var(--r); background:var(--panel); color:var(--ink)}
  .field input:focus,.field select:focus{outline:none; border-color:var(--blood-2); box-shadow:0 0 0 3px var(--blood-soft)}
  .btn{border:0; border-radius:var(--r); padding:13px 16px; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.04em}
  .btn-primary{background:var(--blood); color:#fff; width:100%}
  .btn-primary:hover{background:var(--blood-2)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-ghost{background:var(--panel); border:1px solid var(--line); color:var(--ink)}
  .btn-ghost:hover{border-color:var(--faint)}
  .btn-sm{padding:7px 12px; font-size:12px; border-radius:8px}
  .switch{margin-top:16px; font-size:13px; color:var(--muted)}
  .switch a{font-weight:700; text-decoration:none}
  .err{background:var(--blood-soft); border:1px solid var(--blood); color:#f0b5b5; padding:10px 12px; border-radius:var(--r); font-size:13px; margin-bottom:12px}

  /* tabs */
  nav.tabs{display:flex; gap:4px; padding:14px 0 6px; position:sticky; top:56px; background:var(--bg); z-index:20; border-bottom:1px solid var(--line)}
  nav.tabs button{background:none; border:0; padding:9px 14px; font-size:12px; color:var(--muted); border-radius:8px; font-weight:700; text-transform:uppercase; letter-spacing:.05em}
  nav.tabs button.on{background:var(--blood); color:#fff}

  section{padding:16px 0 40px}
  .sec-h{display:flex; align-items:flex-end; justify-content:space-between; margin:6px 0 14px; gap:12px; flex-wrap:wrap}
  .sec-h h2{font-size:22px; text-transform:uppercase; letter-spacing:-.01em}
  .sec-h .meta{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px}
  .card + .card{margin-top:14px}
  .mini{font-size:11px; color:var(--muted); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:.07em}
  .card input,.card select,.card textarea{width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); color:var(--ink)}
  .card input:focus,.card select:focus{outline:none; border-color:var(--blood-2)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  .inline{display:flex; align-items:center; gap:8px}

  /* day toolbar */
  .daybar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
  .daybar .dsel{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:6px 8px}
  .daybar input[type=date]{background:transparent; border:0; color:var(--ink); font-weight:700}
  .who{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  .who b{color:var(--gold)}

  /* THE GRID */
  .gridwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--panel)}
  table.grid{border-collapse:collapse; width:100%; min-width:1120px; font-size:13px}
  table.grid th{position:sticky; top:0; background:var(--panel-2); text-align:center; padding:9px 8px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:700; border-bottom:1px solid var(--line); white-space:nowrap}
  table.grid th.l{text-align:left}
  table.grid td{padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.grid tr:last-child td{border-bottom:0}
  .cell-in{width:52px; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); color:var(--ink); text-align:center; font-size:13px}
  .cell-in:focus{outline:none; border-color:var(--blood-2)}
  .cell-txt{width:100%; min-width:120px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); color:var(--ink); font-size:13px}
  .cell-txt:focus{outline:none; border-color:var(--blood-2)}
  .drillsel{width:100%; min-width:170px; padding:7px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); color:var(--ink); font-size:13px; font-weight:600}
  .drillsel:focus{outline:none; border-color:var(--blood-2)}
  .auto{display:block; padding:6px 4px; text-align:center; color:var(--muted); background:transparent; font-size:12px; white-space:nowrap}
  .pill{font-size:10px; padding:3px 9px; border-radius:999px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap}
  .p-Driving{background:#3a2c0c; color:#e6b84e}
  .p-Approach{background:#0f2c3f; color:#6fb7e6}
  .p-Putting{background:#0f2f24; color:#5fd0a5}
  .p-sg{background:#3a1c10; color:#e08a5f}
  .p-Performance{background:#241d3a; color:#a99cf0}
  .p-Technical,.p-Practice,.p--{background:#242426; color:#9a978f}
  .p-oncourse{background:#242426; color:#9a978f}
  .donebox{width:20px; height:20px; accent-color:var(--blood-2)}
  .doneflag{color:var(--faint); font-size:14px}
  .doneflag.on{color:var(--fair)}
  .rowdel{background:none; border:0; color:var(--faint); font-size:16px; cursor:pointer; padding:2px 6px}
  .rowdel:hover{color:var(--blood-2)}
  tfoot td{background:var(--panel-2); font-weight:800; padding:10px 8px; border-top:2px solid var(--line); text-align:center}
  tfoot td.l{text-align:left; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--gold)}

  .gridtools{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .savebar{display:flex; align-items:center; gap:10px; margin-top:12px}
  .savestate{font-size:12px; color:var(--muted)}

  .row-item{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line)}
  .row-item:last-child{border-bottom:0}
  .row-item .name{flex:1; font-size:14px}
  .row-item .name small{display:block; color:var(--muted); font-size:12px}
  .empty{text-align:center; color:var(--muted); font-size:14px; padding:30px 12px; border:1px dashed var(--line); border-radius:var(--r)}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 12px}
  .stat .n{font-family:"Archivo"; font-weight:900; font-size:26px; letter-spacing:-.02em}
  .stat .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px}
  .barwrap{margin:10px 0}
  .barwrap .lab{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
  .bar{height:10px; background:var(--panel-2); border-radius:2px; overflow:hidden; border:1px solid var(--line)}
  .bar > i{display:block; height:100%; background:var(--blood-2)}
  .flash{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--blood); color:#fff; padding:11px 20px; border-radius:8px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:0; transition:opacity .2s; z-index:60}
  .flash.show{opacity:1}
  .load{text-align:center; padding:44px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-size:12px}
  @media (max-width:520px){ .stat-row{grid-template-columns:repeat(2,1fr)} .authcard h1{font-size:36px} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="app"><div class="load">Loading</div></div>
<div class="flash" id="flash"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   1. CONNECT TO SUPABASE
   Replace the two values with yours from
   Supabase → Project Settings → API.
   ============================================================ */
const SUPABASE_URL = "https://elrbabkftragomipkscw.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVscmJhYmtmdHJhZ29taXBrc2N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NTI2MDIsImV4cCI6MjEwMDEyODYwMn0.5eVqPzffwARIoR-C_tR15fFKjlVNgFjg34AxvX_CRSo";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CATS = ["Driving","Approach","Putting","Short Game","Performance","Technical","Practice"];
const app = document.getElementById("app");
let me = null;              // {id, full_name, role}
let players = [];           // coach: their linked players
let activePlayerId = null;  // whose day the grid is showing
let activeDay = new Date().toISOString().slice(0,10);
let drillMap = {};          // id -> drill
let gridRows = [];          // working copy of the day's rows

function flash(m){ const f=document.getElementById("flash"); f.textContent=m; f.classList.add("show"); setTimeout(()=>f.classList.remove("show"),1700); }
function val(id){ return document.getElementById(id)?.value?.trim() || ""; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function pillClass(c){ if(c==="Short Game")return "p-sg"; if(c==="Practice On Course")return "p-oncourse"; return "p-"+(c||"-"); }

/* ============================================================
   2. AUTH
   ============================================================ */
function authScreen(mode){
  const signup = mode==="signup";
  app.innerHTML = `
   <div class="auth"><div class="authcard">
     <p class="kicker">Practice · logged · earned</p>
     <h1>The <em>Work</em></h1>
     <p class="sub">${signup?"Set up your account. Coaches build the plan, players put in the work — same sheet, one source of truth.":"Sign in and get after it."}</p>
     <div id="autherr"></div>
     ${signup?`<div class="field"><label>Your name</label><input id="a-name" placeholder="Matt Fitzpatrick"></div>`:""}
     ${signup?`<div class="field"><label>I am a…</label><select id="a-role"><option value="player">Player</option><option value="coach">Coach</option></select></div>`:""}
     <div class="field"><label>Email</label><input id="a-email" type="email" placeholder="you@email.com"></div>
     <div class="field"><label>Password</label><input id="a-pass" type="password" placeholder="••••••••"></div>
     <button class="btn btn-primary" id="a-go">${signup?"Create account":"Sign in"}</button>
     <p class="switch">${signup?"Already have an account?":"New here?"}
       <a href="#" id="a-switch">${signup?"Sign in":"Create one"}</a></p>
   </div></div>`;
  document.getElementById("a-switch").onclick=e=>{e.preventDefault(); authScreen(signup?"signin":"signup");};
  document.getElementById("a-go").onclick=async()=>{
    const errbox=document.getElementById("autherr"); errbox.innerHTML="";
    try{
      if(signup){
        const {error}=await sb.auth.signUp({email:val("a-email"),password:val("a-pass"),
          options:{data:{full_name:val("a-name"),role:val("a-role")}}});
        if(error)throw error; flash("Account created");
      }else{
        const {error}=await sb.auth.signInWithPassword({email:val("a-email"),password:val("a-pass")});
        if(error)throw error;
      }
    }catch(e){ errbox.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
  };
}

/* ============================================================
   3. BOOT
   ============================================================ */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ authScreen("signin"); return; }
  const {data:prof}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(!prof){ app.innerHTML=`<div class="load">Setting up your profile — refresh in a moment</div>`; return; }
  me=prof;

  // load drills into a lookup map
  const {data:drills}=await sb.from("drills").select("*");
  drillMap={}; (drills||[]).forEach(d=>drillMap[d.id]=d);

  if(me.role==="coach"){
    const {data:links}=await sb.from("coach_players")
      .select("player_id, profiles!coach_players_player_id_fkey(full_name)").eq("coach_id",me.id);
    players=(links||[]).map(l=>({id:l.player_id,name:l.profiles?.full_name||"Player"}));
    activePlayerId=players[0]?.id||null;
  }else{
    activePlayerId=me.id;
  }
  shell();
}
sb.auth.onAuthStateChange(()=>boot());

/* ============================================================
   4. SHELL + TABS
   ============================================================ */
let currentTab=null;
function shell(){
  const tabs = me.role==="coach"
    ? [["day","The Sheet"],["players","Players"],["library","Drills"],["progress","Progress"]]
    : [["day","The Sheet"],["progress","Progress"]];
  if(!currentTab) currentTab=tabs[0][0];
  app.innerHTML=`
    <header><div class="wrap">
      <div class="mark"><div class="bar"></div><div class="brand">The <em>Work</em></div></div>
      <div class="whoami">
        <span class="rolechip">${me.role}</span>
        <span>${esc(me.full_name||"")}</span>
        <button class="signout" id="signout">Sign out</button>
      </div>
    </div></header>
    <div class="wrap">
      <nav class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${t[0]===currentTab?'on':''}">${t[1]}</button>`).join("")}</nav>
      <div id="tabview"></div>
    </div>`;
  document.getElementById("signout").onclick=()=>sb.auth.signOut();
  app.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab; shell();});
  renderTab();
}
function renderTab(){
  const v=document.getElementById("tabview");
  v.innerHTML=`<div class="load">Loading</div>`;
  if(currentTab==="day") dayScreen(v);
  else if(currentTab==="players") coachPlayers(v);
  else if(currentTab==="library") library(v);
  else if(currentTab==="progress") progress(v);
}

/* ============================================================
   5. THE SHEET — shared day grid with lookup-on-select
   ============================================================ */
async function dayScreen(v){
  if(me.role==="coach" && !players.length){
    v.innerHTML=`<div class="empty">No players linked yet. Open <b>Players</b> to add one by email.</div>`;
    return;
  }
  const drills=Object.values(drillMap).sort((a,b)=>a.name.localeCompare(b.name));
  const playerPicker = me.role==="coach"
    ? `<div class="dsel"><span class="who">Player</span>
        <select id="pcell" style="background:transparent;border:0;color:var(--ink);font-weight:700">
          ${players.map(p=>`<option value="${p.id}" ${p.id===activePlayerId?'selected':''}>${esc(p.name)}</option>`).join("")}
        </select></div>`
    : `<div class="who">Your sheet, <b>${esc(me.full_name||"")}</b></div>`;

  v.innerHTML=`
    <div class="daybar">
      <div class="dsel"><span class="who">Day</span><input type="date" id="daycell" value="${activeDay}"></div>
      ${playerPicker}
      <span class="who" style="margin-left:auto" id="rolehint">${me.role==="coach"?"Build the day — pick drills, the rest fills in":"Tick done · log actuals · add notes"}</span>
    </div>
    <div class="gridwrap">
      <table class="grid">
        <thead><tr>
          <th class="l">Drill</th><th>Club(s)</th><th>Category</th><th>Time</th><th>Balls</th>
          <th>Dist</th><th>Ment</th><th>Phys</th><th>Why</th><th>Goal</th>
          <th>Done</th><th>Completed notes</th><th>Notes</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
        <tfoot><tr>
          <td class="l">Totals</td><td></td><td></td>
          <td id="t-time">0</td><td id="t-balls">0</td><td></td>
          <td id="t-ment">0</td><td id="t-phys">0</td>
          <td colspan="6"></td>
        </tr></tfoot>
      </table>
    </div>
    <div class="gridtools">
      <button class="btn btn-ghost btn-sm" id="addrow">+ Add row</button>
      <div class="savebar" style="margin-left:auto">
        <span class="savestate" id="savestate"></span>
        <button class="btn btn-primary btn-sm" id="savegrid">Save the day</button>
      </div>
    </div>`;

  if(me.role==="coach"){
    document.getElementById("pcell").onchange=e=>{ activePlayerId=e.target.value; dayScreen(v); };
  }
  document.getElementById("daycell").onchange=e=>{ activeDay=e.target.value; dayScreen(v); };
  document.getElementById("addrow").onclick=()=>{ gridRows.push(blankRow()); drawRows(drills); };
  document.getElementById("savegrid").onclick=saveDay;

  await loadDay();
  drawRows(drills);
}

function blankRow(){ return {id:null, drill_id:"", minutes:"", balls:"", distance:"", mental:"", physical:"",
  completed:false, completed_notes:"", notes:"", _dirty:true}; }

async function loadDay(){
  const {data}=await sb.from("sessions").select("*")
    .eq("player_id",activePlayerId).eq("logged_on",activeDay).order("sort");
  gridRows = (data||[]).map(r=>({
    id:r.id, drill_id:r.drill_id||"", minutes:r.minutes??"", balls:r.balls??"",
    distance:r.distance??"", mental:r.mental??"", physical:r.physical??"",
    completed:!!r.completed, completed_notes:r.completed_notes||"", notes:r.notes||"", _dirty:false
  }));
  if(!gridRows.length) gridRows=[blankRow(),blankRow(),blankRow()];
}

function drawRows(drills){
  const tb=document.getElementById("rows"); if(!tb) return;
  const isPlayer = me.role==="player";
  tb.innerHTML="";
  gridRows.forEach((r,i)=>{
    const d = r.drill_id ? drillMap[r.drill_id] : null;
    const cat = d?d.category:"";
    const opts=`<option value=""></option>`+drills.map(x=>`<option value="${x.id}" ${x.id===r.drill_id?'selected':''}>${esc(x.name)}</option>`).join("");
    const catCell = cat?`<span class="pill ${pillClass(cat)}">${esc(cat)}</span>`:`<span class="auto">—</span>`;
    const doneCell = isPlayer
      ? `<input type="checkbox" class="donebox" data-i="${i}" ${r.completed?'checked':''}>`
      : `<span class="doneflag ${r.completed?'on':''}">${r.completed?'✓':'–'}</span>`;
    const cnoteCell = isPlayer
      ? `<input class="cell-txt" data-i="${i}" data-f="completed_notes" value="${esc(r.completed_notes)}" placeholder="how'd it go">`
      : `<span class="auto" style="text-align:left; min-width:120px; display:block">${r.completed_notes?esc(r.completed_notes):'—'}</span>`;
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><select class="drillsel" data-i="${i}">${opts}</select></td>
      <td><span class="auto">${d&&d.default_club?esc(d.default_club):'—'}</span></td>
      <td style="text-align:center">${catCell}</td>
      <td style="text-align:center"><input class="cell-in" data-i="${i}" data-f="minutes" value="${esc(r.minutes)}"></td>
      <td style="text-align:center"><input class="cell-in" data-i="${i}" data-f="balls" value="${esc(r.balls)}"></td>
      <td><span class="auto">${d&&d.distance?esc(d.distance):(r.distance?esc(r.distance):'—')}</span></td>
      <td style="text-align:center"><input class="cell-in" data-i="${i}" data-f="mental" value="${esc(r.mental)}"></td>
      <td style="text-align:center"><input class="cell-in" data-i="${i}" data-f="physical" value="${esc(r.physical)}"></td>
      <td><span class="auto">${d&&d.why?esc(d.why):'—'}</span></td>
      <td><span class="auto" style="text-align:left; display:block; min-width:110px">${d&&d.goal?esc(d.goal):'—'}</span></td>
      <td style="text-align:center">${doneCell}</td>
      <td>${cnoteCell}</td>
      <td><input class="cell-txt" data-i="${i}" data-f="notes" value="${esc(r.notes)}" placeholder="notes"></td>
      <td style="text-align:center"><button class="rowdel" data-i="${i}" title="Remove">×</button></td>`;
    tb.appendChild(tr);
  });

  // drill select => VLOOKUP fill
  tb.querySelectorAll(".drillsel").forEach(s=>s.onchange=()=>{
    const i=+s.dataset.i, id=s.value, d=drillMap[id];
    const r=gridRows[i];
    r.drill_id=id; r._dirty=true;
    if(d){
      if(r.minutes===""||r.minutes==null) r.minutes = d.default_minutes ?? "";
      if(r.balls===""||r.balls==null)     r.balls   = d.default_balls ?? "";
      if(r.mental===""||r.mental==null)   r.mental  = d.default_mental ?? "";
      if(r.physical===""||r.physical==null) r.physical = d.default_physical ?? "";
      if(!r.distance) r.distance = d.distance ?? "";
    }
    drawRows(drills); markDirty();
  });
  // editable cells
  tb.querySelectorAll("input.cell-in, input.cell-txt").forEach(inp=>inp.oninput=()=>{
    const i=+inp.dataset.i; gridRows[i][inp.dataset.f]=inp.value; gridRows[i]._dirty=true; totals(); markDirty();
  });
  tb.querySelectorAll(".donebox").forEach(b=>b.onchange=()=>{ const i=+b.dataset.i; gridRows[i].completed=b.checked; gridRows[i]._dirty=true; markDirty(); });
  tb.querySelectorAll(".rowdel").forEach(btn=>btn.onclick=async()=>{
    const i=+btn.dataset.i, row=gridRows[i];
    if(row.id){ await sb.from("sessions").delete().eq("id",row.id); }
    gridRows.splice(i,1); if(!gridRows.length)gridRows=[blankRow()]; drawRows(drills); totals();
  });
  totals();
}

function totals(){
  let tt=0,tb=0,tm=0,mc=0,tp=0;
  gridRows.forEach(r=>{ tt+=+r.minutes||0; tb+=+r.balls||0; if(r.mental!==""&&r.mental!=null){tm+=+r.mental;mc++;} tp+=+r.physical||0; });
  const set=(id,v)=>{const el=document.getElementById(id); if(el)el.textContent=v;};
  set("t-time",Math.round(tt)); set("t-balls",Math.round(tb));
  set("t-ment",mc?tm.toFixed(1):"0"); set("t-phys",tp.toFixed(1));
}
function markDirty(){ const s=document.getElementById("savestate"); if(s)s.textContent="Unsaved changes"; }

async function saveDay(){
  const s=document.getElementById("savestate"); if(s)s.textContent="Saving…";
  let ok=true;
  for(let i=0;i<gridRows.length;i++){
    const r=gridRows[i];
    if(!r.drill_id && r.minutes==="" && r.balls==="" && !r.notes) continue; // skip empty rows
    const payload={
      player_id:activePlayerId, created_by:me.id, drill_id:r.drill_id||null,
      logged_on:activeDay, sort:i,
      minutes:num(r.minutes), balls:int(r.balls), distance:r.distance||null,
      mental:num(r.mental), physical:num(r.physical),
      completed:!!r.completed, completed_notes:r.completed_notes||null, notes:r.notes||null
    };
    let res;
    if(r.id){ res=await sb.from("sessions").update(payload).eq("id",r.id); }
    else{ res=await sb.from("sessions").insert(payload).select("id").single(); if(res.data)r.id=res.data.id; }
    if(res.error){ ok=false; flash("Error: "+res.error.message); break; }
    r._dirty=false;
  }
  if(s)s.textContent=ok?"Saved":"Save failed";
  if(ok)flash("Day saved");
}
function num(x){ return x===""||x==null?null:(+x); }
function int(x){ return x===""||x==null?0:Math.round(+x); }

/* ============================================================
   6. COACH — PLAYERS
   ============================================================ */
async function coachPlayers(v){
  v.innerHTML=`
    <div class="card">
      <h3 style="font-size:15px; text-transform:uppercase; letter-spacing:.02em; margin-bottom:10px">Add a player</h3>
      <p style="font-size:12px; color:var(--muted); margin:0 0 12px">They sign up first (as a Player), then you link the email they used.</p>
      <div class="inline"><input id="pemail" placeholder="player@email.com" style="flex:1"><button class="btn btn-primary btn-sm" id="addp">Link</button></div>
    </div>
    <div class="sec-h"><h2>Your players</h2></div>
    <div class="card" id="plist"><div class="load">Loading</div></div>`;
  document.getElementById("addp").onclick=async()=>{
    const email=val("pemail").toLowerCase();
    const {data:found}=await sb.rpc("find_profile_by_email",{e:email});
    if(!found){ flash("No player with that email"); return; }
    const {error}=await sb.from("coach_players").insert({coach_id:me.id,player_id:found});
    if(error){ flash(error.message.includes("duplicate")?"Already linked":error.message); return; }
    flash("Player linked"); document.getElementById("pemail").value=""; boot();
  };
  const box=document.getElementById("plist");
  if(!players.length){ box.innerHTML=`<div class="empty">No players linked yet.</div>`; return; }
  box.innerHTML=players.map(p=>`<div class="row-item"><div class="name">${esc(p.name)}</div></div>`).join("");
}

/* ============================================================
   7. DRILL LIBRARY — full lookup fields
   ============================================================ */
async function library(v){
  v.innerHTML=`
    <div class="card">
      <h3 style="font-size:15px; text-transform:uppercase; letter-spacing:.02em; margin-bottom:12px">Add a drill</h3>
      <div class="field"><label class="mini">Name</label><input id="ln" placeholder="Iron Session 125-175"></div>
      <div class="grid2" style="margin-top:8px">
        <div><label class="mini">Category</label><select id="lc">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></div>
        <div><label class="mini">Default club(s)</label><input id="lk" placeholder="52/W/9/8/7"></div>
      </div>
      <div class="grid3" style="margin-top:8px">
        <div><label class="mini">Def. time</label><input id="lt" type="number" placeholder="20"></div>
        <div><label class="mini">Def. balls</label><input id="lb" type="number" placeholder="10"></div>
        <div><label class="mini">Distance</label><input id="ld" placeholder="125-175"></div>
      </div>
      <div class="grid3" style="margin-top:8px">
        <div><label class="mini">Def. mental</label><input id="lm" type="number" step="0.5" placeholder="6"></div>
        <div><label class="mini">Def. phys</label><input id="lp" type="number" step="0.5" placeholder="4.5"></div>
        <div><label class="mini">Why</label><input id="lw" placeholder="Performance"></div>
      </div>
      <div class="field" style="margin-top:8px"><label class="mini">Goal / pass criteria</label><input id="lg" placeholder="70% or more inside 5%"></div>
      <button class="btn btn-primary btn-sm" id="ladd" style="margin-top:12px; width:100%">Add to library</button>
    </div>
    <div class="sec-h"><h2>Library</h2><span class="meta" id="lcount"></span></div>
    <div class="card" id="llist"><div class="load">Loading</div></div>`;
  document.getElementById("ladd").onclick=async()=>{
    if(!val("ln")){ flash("Name the drill"); return; }
    const {error}=await sb.from("drills").insert({
      owner_id:me.id, name:val("ln"), category:val("lc"), default_club:val("lk"),
      default_minutes:num(val("lt")), default_balls:num(val("lb")), distance:val("ld"),
      default_mental:num(val("lm")), default_physical:num(val("lp")), why:val("lw"), goal:val("lg")});
    if(error){ flash(error.message); return; }
    flash("Drill added"); const {data:drills}=await sb.from("drills").select("*"); drillMap={}; (drills||[]).forEach(d=>drillMap[d.id]=d);
    ["ln","lk","lt","lb","ld","lm","lp","lw","lg"].forEach(i=>document.getElementById(i).value=""); loadLib();
  };
  loadLib();
  async function loadLib(){
    const {data}=await sb.from("drills").select("*").order("category").order("name");
    const box=document.getElementById("llist"); document.getElementById("lcount").textContent=(data?.length||0)+" drills";
    if(!data?.length){ box.innerHTML=`<div class="empty">No drills yet — add your first above.</div>`; return; }
    box.innerHTML=data.map(d=>`
      <div class="row-item">
        <span class="pill ${pillClass(d.category)}">${esc(d.category)}</span>
        <div class="name">${esc(d.name)}<small>${[d.default_club,d.distance,d.goal].filter(Boolean).map(esc).join(" · ")||"—"}</small></div>
        <span class="meta">${d.default_minutes||0}m · ${d.default_balls||0}b</span>
      </div>`).join("");
  }
}

/* ============================================================
   8. PROGRESS — category balance, last 7 days
   ============================================================ */
async function progress(v){
  const pid = me.role==="coach" ? (activePlayerId||players[0]?.id) : me.id;
  if(!pid){ v.innerHTML=`<div class="empty">Link a player first.</div>`; return; }
  const weekAgo=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const {data}=await sb.from("sessions").select("*, drills(category)").eq("player_id",pid).gte("logged_on",weekAgo);
  const byCat={}; CATS.forEach(c=>byCat[c]=0);
  let balls=0,mins=0; const days=new Set();
  (data||[]).forEach(s=>{ const c=s.drills?.category||"Technical"; byCat[c]=(byCat[c]||0)+(s.balls||0); balls+=s.balls||0; mins+=+s.minutes||0; days.add(s.logged_on); });
  const max=Math.max(1,...Object.values(byCat));
  const picker = me.role==="coach" && players.length
    ? `<select id="ppick" style="background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:700">${players.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join("")}</select>`
    : "";
  v.innerHTML=`
    <div class="sec-h"><h2>Last 7 days</h2>${picker}</div>
    <div class="stat-row">
      ${stat(data?.length||0,"Sessions")}${stat(Math.round(mins),"Minutes")}${stat(balls,"Balls")}${stat(days.size,"Days on")}
    </div>
    <div class="card">
      <h3 style="font-size:14px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:14px">Balls by category</h3>
      ${CATS.map(c=>`<div class="barwrap"><div class="lab"><span>${c}</span><span>${byCat[c]}</span></div><div class="bar"><i style="width:${Math.round(byCat[c]/max*100)}%"></i></div></div>`).join("")}
    </div>
    ${!data?.length?'<div class="empty" style="margin-top:14px">No sessions logged in the last 7 days.</div>':''}`;
  if(me.role==="coach" && players.length){ document.getElementById("ppick").onchange=e=>{ activePlayerId=e.target.value; progress(v); }; }
}
function stat(n,l){ return `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

boot();
</script>
