<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141920" />
<link rel="manifest" href="manifest.json" />
<title>Practice Schedule</title>
<style>
  :root{
    --bg:#141920; --panel:#1b2027; --panel-2:#232a33; --line:#333c46;
    --ink:#eef2f0; --muted:#8b97a3; --faint:#5b6672;
    --blood:#7fa322; --blood-2:#c3f53c; --blood-soft:#22301a;
    --gold:#c3f53c;
    --fair:#c3f53c; --miss:#e0864f;
    --lime-ink:#1b2027;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-family:"Archivo",sans-serif; font-weight:800; margin:0; letter-spacing:-.01em}
  .display{font-family:"Archivo",sans-serif; font-weight:900; letter-spacing:-.02em; text-transform:uppercase}
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit; font-size:16px}
  .wrap{max-width:1120px; margin:0 auto; padding:0 16px}
  a{color:var(--blood-2)}

  /* header */
  header{
    background:linear-gradient(180deg,#1b2027 0%,var(--bg) 100%);
    border-bottom:1px solid var(--line);
    position:relative; z-index:2;
    padding-top:env(safe-area-inset-top);
  }
  header .wrap{display:flex; align-items:center; gap:12px; padding-top:12px; padding-bottom:12px}
  .mark{display:flex; align-items:center; gap:10px}
  .mark .bar{width:4px; height:26px; background:var(--blood-2); border-radius:2px}
  .brand{font-family:"Archivo"; font-weight:900; font-size:20px; text-transform:uppercase; letter-spacing:.02em}
  .brand em{color:var(--blood-2); font-style:normal}
  .whoami{margin-left:auto; display:flex; align-items:center; gap:12px; font-size:13px; color:var(--muted)}
  .rolechip{border:1px solid var(--line); color:var(--ink); padding:3px 10px; border-radius:999px; font-size:11px; text-transform:uppercase; letter-spacing:.06em}
  .signout{background:none; border:0; color:var(--muted); font-size:13px; text-decoration:underline}

  /* auth */
  .auth{min-height:88vh; display:flex; align-items:center; justify-content:center; padding:24px 16px}
  .authcard{width:100%; max-width:420px}
  .kicker{color:var(--blood-2); font-size:12px; letter-spacing:.28em; text-transform:uppercase; font-weight:700; margin-bottom:14px}
  .authcard h1{font-size:44px; line-height:.95; text-transform:uppercase; font-weight:900; letter-spacing:-.02em; margin-bottom:10px}
  .authcard h1 em{color:var(--blood-2); font-style:normal}
  .authcard .sub{color:var(--muted); font-size:14px; margin-bottom:24px; max-width:34ch}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:11px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.08em}
  .field input,.field select{width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:var(--r); background:var(--panel); color:var(--ink)}
  .field input:focus,.field select:focus{outline:none; border-color:var(--blood-2); box-shadow:0 0 0 3px var(--blood-soft)}
  .btn{border:0; border-radius:var(--r); padding:13px 16px; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.04em}
  .btn-primary{background:var(--blood-2); color:var(--lime-ink); width:100%}
  .btn-primary:hover{background:#d3ff5c}
  .btn-primary:active{transform:translateY(1px)}
  .btn-ghost{background:var(--panel); border:1px solid var(--line); color:var(--ink)}
  .btn-ghost:hover{border-color:var(--faint)}
  .btn-sm{padding:7px 12px; font-size:12px; border-radius:8px}
  .switch{margin-top:16px; font-size:13px; color:var(--muted)}
  .switch a{font-weight:700; text-decoration:none}
  .err{background:#2e1f1a; border:1px solid #7a4a33; color:#f0c2ab; padding:10px 12px; border-radius:var(--r); font-size:13px; margin-bottom:12px}

  /* tabs */
  .stickytop{position:sticky; top:0; z-index:30; background:var(--bg)}
  nav.tabs{display:flex; gap:4px; padding:10px 0 6px; background:var(--bg); z-index:20; border-bottom:1px solid var(--line)}
  nav.tabs button{background:none; border:0; padding:9px 14px; font-size:12px; color:var(--muted); border-radius:8px; font-weight:700; text-transform:uppercase; letter-spacing:.05em}
  nav.tabs button.on{background:var(--blood-2); color:var(--lime-ink)}

  section{padding:16px 0 40px}
  .sec-h{display:flex; align-items:flex-end; justify-content:space-between; margin:6px 0 14px; gap:12px; flex-wrap:wrap}
  .sec-h h2{font-size:22px; text-transform:uppercase; letter-spacing:-.01em}
  .sec-h .meta{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px}
  .card + .card{margin-top:14px}
  .mini{font-size:11px; color:var(--muted); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:.07em}
  .card input,.card select,.card textarea{width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); color:var(--ink)}
  .card input:focus,.card select:focus{outline:none; border-color:var(--blood-2)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  .inline{display:flex; align-items:center; gap:8px}

  /* day toolbar */
  .daybar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
  .daybar .dsel{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:6px 8px}
  .daybar input[type=date]{background:transparent; border:0; color:var(--ink); font-weight:700}
  .who{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  .who b{color:var(--gold)}

  /* THE GRID */
  .gridwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--panel)}
  table.grid{border-collapse:collapse; width:100%; min-width:1120px; font-size:13px}
  table.grid th{position:sticky; top:0; background:var(--panel-2); text-align:center; padding:9px 8px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:700; border-bottom:1px solid var(--line); white-space:nowrap}
  table.grid th.l{text-align:left}
  table.grid td{padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.grid tr:last-child td{border-bottom:0}
  .cell-in{width:52px; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); color:var(--ink); text-align:center; font-size:13px}
  .cell-in:focus{outline:none; border-color:var(--blood-2)}
  .cell-txt{width:100%; min-width:120px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); color:var(--ink); font-size:13px}
  .cell-txt:focus{outline:none; border-color:var(--blood-2)}
  /* note cell + expand button */
  .notewrap{display:flex; align-items:stretch; gap:5px; min-width:140px}
  .notewrap .cell-txt{min-width:0; flex:1}
  .noteexp{flex-shrink:0; width:30px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2);
    color:var(--muted); font-size:13px; line-height:1; cursor:pointer; padding:0}
  .noteexp:hover{color:var(--blood-2); border-color:var(--blood-2)}
  .noteexp.hasnote{color:var(--blood-2); border-color:var(--blood)}
  .noteread{display:block; text-align:left; min-width:110px; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .notearea{width:100%; box-sizing:border-box; min-height:180px; resize:vertical; padding:11px 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--panel-2); color:var(--ink);
    font-size:15px; line-height:1.55; font-family:inherit}
  .notearea:focus{outline:none; border-color:var(--blood-2)}
  .notearea[readonly]{color:var(--muted)}
  .drillsel{width:100%; min-width:170px; padding:7px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); color:var(--ink); font-size:13px; font-weight:600}
  .drillsel:focus{outline:none; border-color:var(--blood-2)}
  /* Frozen first column (Day Plan only): the drill name stays put while the rest
     of the sheet scrolls sideways, like a spreadsheet freeze pane. */
  table.grid.frz th:first-child, table.grid.frz td:first-child{
    position:sticky; left:0; z-index:2; background:var(--panel);
    box-shadow:7px 0 8px -6px rgba(0,0,0,.7);
    width:148px; min-width:148px; max-width:148px}
  table.grid.frz thead th:first-child{background:var(--panel-2); z-index:4}
  /* Safari drops collapsed borders on sticky cells, so the row lines are drawn in */
  table.grid.frz tbody td:first-child{box-shadow:7px 0 8px -6px rgba(0,0,0,.7), inset 0 -1px 0 var(--line)}
  table.grid.frz tbody tr:last-child td:first-child{box-shadow:7px 0 8px -6px rgba(0,0,0,.7)}
  table.grid.frz td:first-child .drillsel{min-width:0; width:100%}
  table.grid.frz td:first-child > span{display:block; white-space:normal; line-height:1.3; word-break:break-word}
  .auto{display:block; padding:6px 4px; text-align:center; color:var(--muted); background:transparent; font-size:12px; white-space:nowrap}
  /* Goal is a long pass-criteria sentence. Left to itself it stretches the whole
     day grid sideways, so it's held to one short line and opens on tap. */
  .gcell{display:block; max-width:84px; padding:6px 4px; text-align:left; color:var(--muted); font-size:12px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .gcell.tap{cursor:pointer; border-bottom:1px dotted var(--line)}
  .gcell.open{max-width:240px; white-space:normal; color:var(--ink); border-bottom:0}
  th.gtog{cursor:pointer; user-select:none}
  .pill{font-size:10px; padding:3px 9px; border-radius:999px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap}
  .p-Driving{background:#3b4a1c; color:#c3f53c}
  .p-Approach{background:#1e3340; color:#7fc4dd}
  .p-Putting{background:#1c3a2e; color:#6fd8ab}
  .p-sg{background:#3d2a1a; color:#e0a26f}
  .p-Performance{background:#2a2740; color:#a9a4e8}
  .p-Technical,.p-Practice,.p--{background:#2a323b; color:#98a4b0}
  .p-oncourse{background:#2a323b; color:#98a4b0}
  .statusbtn{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--faint); font-size:15px; font-weight:800; line-height:1; cursor:pointer}
  .statusbtn.s-done{background:var(--blood-2); color:var(--lime-ink); border-color:var(--blood-2)}
  .statusbtn.s-missed{background:#3d2a1a; color:#e0864f; border-color:#7a4a33}
  .statusflag{font-size:14px; font-weight:800; color:var(--faint)}
  .statusflag.s-done{color:var(--blood-2)}
  .statusflag.s-missed{color:#e0864f}
  .doneflag{color:var(--faint); font-size:14px}
  .doneflag.on{color:var(--fair)}
  .rowdel{background:none; border:0; color:var(--faint); font-size:16px; cursor:pointer; padding:2px 6px}
  .rowdel:hover{color:var(--blood-2)}
  .cbtn{background:none; border:0; color:var(--faint); font-size:13px; cursor:pointer; padding:2px 4px}
  .cbtn:hover{color:var(--blood-2)}
  .cbtn b{color:var(--blood-2); font-size:11px; margin-left:1px}
  .cmodal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:80; padding:16px}
  .cbox{background:var(--panel); border:1px solid var(--line); border-radius:12px; width:100%; max-width:440px; max-height:80vh; display:flex; flex-direction:column}
  .chead{display:flex; align-items:flex-start; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line)}
  .cx{background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer; line-height:1}
  .clist{overflow-y:auto; padding:8px 16px; flex:1}
  .citem{padding:10px 0; border-bottom:1px solid var(--line); font-size:14px}
  .citem:last-child{border-bottom:0}
  .cmeta{font-size:12px; color:var(--muted); margin-bottom:3px}
  .cfoot{display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line)}
  .cfoot input{flex:1; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); color:var(--ink)}
  tfoot td{background:var(--panel-2); font-weight:800; padding:10px 8px; border-top:2px solid var(--line); text-align:center}
  tfoot td.l{text-align:left; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--gold)}

  .gridtools{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .savebar{display:flex; align-items:center; gap:10px; margin-top:12px}
  .savestate{font-size:12px; color:var(--muted)}

  .row-item{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line)}
  .row-item:last-child{border-bottom:0}
  .row-item .name{flex:1; font-size:14px}
  .row-item .name small{display:block; color:var(--muted); font-size:12px}
  .empty{text-align:center; color:var(--muted); font-size:14px; padding:30px 12px; border:1px dashed var(--line); border-radius:var(--r)}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 12px}
  .stat .n{font-family:"Archivo"; font-weight:900; font-size:26px; letter-spacing:-.02em}
  .stat .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px}
  .barwrap{margin:10px 0}
  .barwrap .lab{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
  .bar{height:10px; background:var(--panel-2); border-radius:2px; overflow:hidden; border:1px solid var(--line)}
  .bar > i{display:block; height:100%; background:var(--blood-2)}
  .flash{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--blood-2); color:var(--lime-ink); padding:11px 20px; border-radius:8px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:0; transition:opacity .2s; z-index:60}
  .flash.show{opacity:1}
  .load{text-align:center; padding:44px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-size:12px}
  .sfil.on,.cwin.on,.rv.on,.tcat.on,.lcat.on,.lwk.on,.cmpmode.on{background:var(--blood-2); color:var(--lime-ink); border-color:var(--blood-2)}
  .heatcell{border-radius:4px; padding:7px 4px; text-align:center; color:#0b0b0c; font-weight:800; font-size:11px}
  .rvbar{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; flex-wrap:nowrap}
  .rvbar .btn{flex:0 0 auto; white-space:nowrap}
  .rvbar::-webkit-scrollbar{display:none}

  @media (max-width:520px){
    .stat-row{grid-template-columns:repeat(2,1fr)}
    .authcard h1{font-size:36px}
  }
  @media (max-width:760px){
    /* tabs scroll rather than squash */
    nav.tabs{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none}
    nav.tabs::-webkit-scrollbar{display:none}
    nav.tabs button{flex:0 0 auto; white-space:nowrap}
    /* toolbars wrap more kindly */
    .daybar{gap:8px}
    .daybar .dsel{padding:5px 7px}
    .wrap{padding:0 12px}
    .sec-h h2{font-size:19px}
    .cbox{max-height:88vh}
  }

  /* training load + drill rotation */
  .clist input,.clist select{width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); color:var(--ink)}
  .clist input[type=checkbox]{width:auto}
  .ld-head{display:flex; align-items:flex-start; gap:14px; margin-bottom:14px}
  .ld-word{font-family:"Archivo",sans-serif; font-weight:900; font-size:26px; line-height:1; text-transform:uppercase; letter-spacing:-.01em}
  .ld-ratio{margin-left:auto; text-align:right; flex-shrink:0}
  .ld-ratio .n{font-family:"Archivo"; font-weight:900; font-size:26px; letter-spacing:-.02em; line-height:1}
  .ld-ratio .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:3px}
  .ld-bars{display:flex; align-items:flex-end; gap:2px; height:64px; margin-bottom:5px}
  .ld-bars i{flex:1; min-width:0; border-radius:2px 2px 0 0; background:var(--line); display:block}
  .ld-scale{display:flex; justify-content:space-between; font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em}
  .ld-note{font-size:12.5px; color:var(--muted); margin:12px 0 0; line-height:1.55}
  .rot-gap{font-size:12px; font-weight:800; flex:0 0 auto; text-align:right}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
/* ============================================================
   1. CONNECT TO SUPABASE
   Replace the two values with yours from
   Supabase → Project Settings → API.
   ============================================================ */
const SUPABASE_URL = "https://elrbabkftragomipkscw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVscmJhYmtmdHJhZ29taXBrc2N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NTI2MDIsImV4cCI6MjEwMDEyODYwMn0.5eVqPzffwARIoR-C_tR15fFKjlVNgFjg34AxvX_CRSo";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CATS = ["Driving","Approach","Putting","Short Game","Performance","Technical","Practice"];
const app = document.getElementById("app");
let me = null;              // {id, full_name, role}
let players = [];           // coach: their linked players
let activePlayerId = null;  // whose day the grid is showing
let pendingCount = 0;       // people signed up but not yet linked
/* Local calendar date as YYYY-MM-DD. Never use toISOString() for "today" —
   that returns UTC and lands on the wrong day outside UTC. */
function todayISO(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
let activeDay = todayISO();
let drillMap = {};          // id -> drill
// A row is still a "plan" if its day is in the future (or today) and it isn't
// marked done. Planned rows display the drill's CURRENT default for time/balls,
// so editing the drill updates every planned day at once. Logged/past rows keep
// exactly what was recorded.
function isPlannedRow(row, dayISO){
  const done = row.status==="done" || row.completed===true;
  const past = dayISO < todayISO();
  return !done && !past;
}
// The value to SHOW for a planned row: drill default if the row's own value is
// empty OR the row is a plan; otherwise the row's logged value.
function shownVal(row, dayISO, field, drillField){
  const d = row.drill_id ? drillMap[row.drill_id] : null;
  const planned = isPlannedRow(row, dayISO);
  const own = row[field];
  const blank = own==null || own==="" ;
  if(d && (planned || blank) && d[drillField]!=null) return d[drillField];
  return blank ? "" : own;
}

async function refreshDrills(force){
  if(!force && Object.keys(drillMap).length) return;   // use cache; drills rarely change
  const {data}=await sb.from("drills").select("*");
  drillMap={}; (data||[]).forEach(d=>drillMap[d.id]=d);
}
let gridRows = [];          // working copy of the day's rows
let goalsOpen = false;      // Goal column: one short line, or opened out

/* Keep the page where it was across a re-render.
   Views are async — content lands after the promise resolves and after
   the browser paints — so restore on several frames rather than once. */
let _scrollLock=null;
function keepScroll(fn){
  const y = window.scrollY || document.documentElement.scrollTop || 0;
  _scrollLock = y;
  const restore = ()=>{ if(_scrollLock!=null) window.scrollTo(0,_scrollLock); };
  let r;
  try { r = fn(); } catch(e) { _scrollLock=null; throw e; }
  const finish = ()=>{
    restore();
    requestAnimationFrame(()=>{ restore();
      requestAnimationFrame(()=>{ restore(); setTimeout(()=>{ restore(); _scrollLock=null; },60); });
    });
  };
  if(r && typeof r.then==="function"){ r.then(finish, finish); } else { finish(); }
  return r;
}

/* WHERE YOU WERE.
   iOS Safari freezes or throws the page away when you switch apps, and the auth
   library also fires a token refresh on the way back in. Either one used to land
   you at the top of the Day Plan. The tab, the day and the scroll position are
   parked in storage and put back when you return — but only for 6 hours, so
   coming back tomorrow starts clean. */
const VIEW_KEY="ps.view";
const VIEW_TTL=6*60*60*1000;
let _restoreY=null;
function saveView(){
  try{
    if(!currentTab) return;
    localStorage.setItem(VIEW_KEY, JSON.stringify({
      tab: currentTab,
      day: typeof activeDay!=="undefined" ? activeDay : null,
      sched: typeof schedDay!=="undefined" ? schedDay : null,
      week: typeof weekStart!=="undefined" ? weekStart : null,
      tabX: _tabScrollX||0,
      y: window.scrollY || document.documentElement.scrollTop || 0,
      t: Date.now()
    }));

}
function loadView(){
  try{
    const v=JSON.parse(localStorage.getItem(VIEW_KEY)||"null");
    if(!v || !v.t || Date.now()-v.t > VIEW_TTL) return null;
    return v;
  }catch(e){ return null; }
}
/* Content arrives after the data does, so the page isn't tall enough to scroll
   to straight away. Keep asking until it is, and stand down the moment the
   user touches the screen. */
function restoreScroll(y){
  if(!(y>0)) return;
  let n=0, hits=0, stop=false;
  const cancel=()=>{ stop=true; };
  ["touchstart","wheel","keydown"].forEach(ev=>window.addEventListener(ev,cancel,{passive:true, once:true}));
  const tick=()=>{
    if(stop) return;
    const max=Math.max(0, document.documentElement.scrollHeight-window.innerHeight);
    const target=Math.min(y,max);
    window.scrollTo(0,target);
    hits = Math.abs((window.scrollY||0)-target)<2 ? hits+1 : 0;
    if(hits<3 && ++n<34) setTimeout(tick,60);
  };
  tick();
}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ authScreen("signin"); return; }
  const {data:prof}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(!prof){ app.innerHTML=`<div class="load">Setting up your profile — refresh in a moment</div>`; return; }
  me=prof;

  // load drills into a lookup map
  const {data:drills}=await sb.from("drills").select("*");
  drillMap={}; (drills||[]).forEach(d=>drillMap[d.id]=d);

  if(me.role==="coach"){
    const {data:links}=await sb.from("coach_players")
      .select("player_id, profiles!coach_players_player_id_fkey(full_name)").eq("coach_id",me.id);
    players=(links||[]).map(l=>({id:l.player_id,name:l.profiles?.full_name||"Player"}));
    activePlayerId=players[0]?.id||null;
    pendingCount=0;
  }else if(me.role==="viewer"){
    const {data:pv}=await sb.from("player_viewers").select("player_id").eq("viewer_id",me.id).limit(1).maybeSingle();
    activePlayerId=pv?.player_id||null;
  }else{
    activePlayerId=me.id;
    try{
      const {data:pend}=await sb.rpc("pending_team_members");
      pendingCount=(pend||[]).length;
    }catch(e){ pendingCount=0; }
  }
  shell();
}
/* Supabase refreshes the token when you come back to the app. Rebuilding the
   whole shell for that wiped the screen and lost your place — so only re-boot
   when who is signed in has actually changed. */
sb.auth.onAuthStateChange((event, session)=>{
  const uid = session?.user?.id || null;
  if(event==="TOKEN_REFRESHED" || event==="USER_UPDATED") return;
  if(me && uid && uid===me.id) return;
  boot();
});

function shell(){
  const tabs = me.role==="coach"
    ? [["day","Day Plan"],["week","Week"],["sched","Schedule"],["season","Season"],["results","Results"],["players","Players"],["library","Drills"],["technical","Technical"],["progress","Progress"]]

  if(!currentTab){
    const sv=loadView();

      if(sv.day) activeDay=sv.day;
      if(sv.sched) schedDay=sv.sched;
      if(sv.week) weekStart=sv.week;

  }
  app.innerHTML=`
    <div class="stickytop">
      <header><div class="wrap">
        <div class="mark"><div class="bar"></div><div class="brand">Practice <em>Schedule</em></div></div>

    </div>
    <div class="wrap">
      <div id="tabview"></div>
    </div>`;
  document.getElementById("signout").onclick=()=>sb.auth.signOut();
  const nav=app.querySelector("nav.tabs");
  if(nav && _tabScrollX) nav.scrollLeft=_tabScrollX;
  app.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
    const n=app.querySelector("nav.tabs");

  });
  renderTab();

function blankRow(){ return {id:null, drill_id:"", minutes:"", balls:"", distance:"", mental:"", physical:"",
  status:"pending", completed_notes:"", notes:"", _dirty:true}; }

async function loadDay(){
  const {data}=await sb.from("sessions").select("*")
    .eq("player_id",activePlayerId).eq("logged_on",activeDay).order("sort");
  gridRows = (data||[]).map(r=>({
    id:r.id, drill_id:r.drill_id||"", minutes:r.minutes??"", balls:r.balls??"",
    distance:r.distance??"", mental:r.mental??"", physical:r.physical??"",
    status:r.status||(r.completed?"done":"pending"), completed_notes:r.completed_notes||"", notes:r.notes||"", _dirty:false
  }));
  // comment counts per row
  const ids=gridRows.map(r=>r.id).filter(Boolean);
  if(ids.length){
    const {data:cs}=await sb.from("comments").select("session_id").in("session_id",ids);
    const tally={}; (cs||[]).forEach(c=>tally[c.session_id]=(tally[c.session_id]||0)+1);
    gridRows.forEach(r=>{ r._ccount = r.id?(tally[r.id]||0):0; });
  }

  if(!gridRows.length) gridRows=[blankRow(),blankRow(),blankRow()];

  // If this day is in the past, anything never ticked counts as NOT completed.
  const today=todayISO();
  if(activeDay < today){
    gridRows.forEach(r=>{
      if(r.drill_id && (!r.status || r.status==="pending")){ r.status="missed"; r._dirty=true; }
    });
  }
}

/* ---------- note cells: inline preview + tap-to-expand ----------
   The inline input stays for quick edits. The ⤢ button opens a full-size
   textarea so long coach notes are readable and editable on a phone. */
const NOTE_META = {
  notes:           {title:"Notes",           hint:"Plan notes for this drill"},
  completed_notes: {title:"Completed notes", hint:"How it actually went"}
};
function noteCell(i, field, value, placeholder, readOnly){
  const v = value||"";
  const meta = NOTE_META[field]||{title:"Note"};
  const btn = `<button class="noteexp${v?" hasnote":""}" data-i="${i}" data-note="${field}"
      title="Expand ${meta.title.toLowerCase()}">⤢</button>`;
  const inner = readOnly
    ? `<span class="auto noteread">${v?esc(v):"—"}</span>`
    : `<input class="cell-txt" data-i="${i}" data-f="${field}" value="${esc(v)}" placeholder="${esc(placeholder)}">`;
  return `<div class="notewrap">${inner}${btn}</div>`;
}

/* Full-screen note editor. Read-only for viewers, saves on Done otherwise. */
function openNote(i, field, readOnly){
  const r = gridRows[i]; if(!r) return;
  const meta = NOTE_META[field]||{title:"Note", hint:""};
  const d = r.drill_id?drillMap[r.drill_id]:null;
  const wrap=document.createElement("div");
  wrap.className="cmodal";
  wrap.innerHTML=`
    <div class="cbox">
      <div class="chead">
        <div><b>${esc(meta.title)}</b><div class="who">${esc(d?d.name:"Drill")} · ${activeDay}</div></div>

      </div>
      <div class="clist" style="padding:14px 16px">
        <textarea class="notearea" id="nbody" ${readOnly?"readonly":""}
          placeholder="${esc(meta.hint)}">${esc(r[field]||"")}</textarea>
      </div>
      ${readOnly?"":`<div class="cfoot" style="justify-content:flex-end">
        <button class="btn btn-ghost btn-sm" id="ncancel">Cancel</button>
        <button class="btn btn-primary btn-sm" id="nsave">Done</button>
      </div>`}
    </div>`;
  document.body.appendChild(wrap);
  const ta=document.getElementById("nbody");
  const close=()=>wrap.remove();
  wrap.onclick=e=>{ if(e.target===wrap) close(); };
  document.getElementById("nclose").onclick=close;
  if(!readOnly){
    document.getElementById("ncancel").onclick=close;
    document.getElementById("nsave").onclick=()=>{
      if(ta.value!==(r[field]||"")){ r[field]=ta.value; r._dirty=true; markDirty(); }
      // patch the row in place so the sheet doesn't jump/scroll on close
      const inp=document.querySelector(`#rows input.cell-txt[data-i="${i}"][data-f="${field}"]`);
      if(inp) inp.value=r[field]||"";
      const bt=document.querySelector(`#rows .noteexp[data-i="${i}"][data-note="${field}"]`);
      if(bt) bt.classList.toggle("hasnote", !!r[field]);
      close();
    };
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }
}

      <td>${cnoteCell}</td>
      <td>${noteCellHtml}</td>
      <td style="text-align:center">${isViewer?"":`<button class="rowdel" data-i="${i}" title="Remove">×</button>`}<button class="cbtn" data-i="${i}" title="Comments">💬${r._ccount?`<b>${r._ccount}</b>`:""}</button></td>`;
    tb.appendChild(tr);
  });

  // tap one goal to read it in full, tap again to fold it back
  tb.querySelectorAll(".gcell.tap").forEach(g=>g.onclick=()=>g.classList.toggle("open"));

  // drill select => VLOOKUP fill
  tb.querySelectorAll(".drillsel").forEach(s=>s.onchange=()=>{
    const i=+s.dataset.i, id=s.value, d=drillMap[id];
    const r=gridRows[i];
    const prev = r.drill_id ? drillMap[r.drill_id] : null;   // drill this row held a moment ago
    r.drill_id=id; r._dirty=true;
    if(d){
      // Take the NEW drill's numbers unless this row carries a genuine typed
      // override. A value that merely equals the OLD drill's default is not an
      // override — leaving it behind is what made a re-ordered day keep the
      // previous drill's durations on the Schedule timeline.
      const take=(field, dField)=>{
        const own=r[field];
        const untouched = own===""||own==null || (prev && prev[dField]!=null && +own===+prev[dField]);
        if(untouched) r[field] = d[dField] ?? "";
      };
      take("minutes","default_minutes");
      take("balls","default_balls");
      take("mental","default_mental");
      take("physical","default_physical");
      if(!r.distance || (prev && r.distance===prev.distance)) r.distance = d.distance ?? "";
    }
    drawRows(drills); markDirty();
  });
  // editable cells
  tb.querySelectorAll("input.cell-in, input.cell-txt").forEach(inp=>inp.oninput=()=>{
    const i=+inp.dataset.i; gridRows[i][inp.dataset.f]=inp.value; gridRows[i]._dirty=true; totals(); markDirty();
  });
  tb.querySelectorAll(".statusbtn").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, cur=gridRows[i].status||"pending";
    gridRows[i].status = cur==="pending" ? "done" : cur==="done" ? "missed" : "pending";
    gridRows[i]._dirty=true; drawRows(drills); markDirty();
  });
  tb.querySelectorAll(".rowdel").forEach(btn=>btn.onclick=async()=>{
    const i=+btn.dataset.i, row=gridRows[i];
    if(row.id){ await sb.from("sessions").delete().eq("id",row.id); }
    gridRows.splice(i,1); if(!gridRows.length)gridRows=[blankRow()]; drawRows(drills); totals();
  });
  tb.querySelectorAll(".noteexp").forEach(b=>b.onclick=()=>{
    const f=b.dataset.note;
    const ro = f==="completed_notes" ? !isPlayer : isViewer;
    openNote(+b.dataset.i, f, ro);
  });
  tb.querySelectorAll(".cbtn").forEach(b=>b.onclick=()=>openComments(+b.dataset.i));
  totals();
}

function totals(){
  let tt=0,tb=0,tm=0,mc=0,tp=0;
  gridRows.forEach(r=>{
    const mn=shownVal(r,activeDay,"minutes","default_minutes");
    const bl=shownVal(r,activeDay,"balls","default_balls");
    tt+=+mn||0; tb+=+bl||0;
    if(r.mental!==""&&r.mental!=null){tm+=+r.mental;mc++;} tp+=+r.physical||0;
  });
  const set=(id,v)=>{const el=document.getElementById(id); if(el)el.textContent=v;};
  set("t-time",Math.round(tt)); set("t-balls",Math.round(tb));
  set("t-ment",mc?tm.toFixed(1):"0"); set("t-phys",tp.toFixed(1));

let _saveTimer=null, _saving=false;
function markDirty(){
  const s=document.getElementById("savestate"); if(s)s.textContent="Unsaved changes";
  scheduleAutosave();
}
function scheduleAutosave(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{ saveDay(true); }, 1200);   // save 1.2s after you stop
}

async function saveDay(quiet){
  if(_saving) return;
  // nothing to do if no row is dirty
  if(quiet && !gridRows.some(r=>r._dirty)) return;
  _saving=true;
  const s=document.getElementById("savestate"); if(s)s.textContent="Saving…";
  let ok=true;
  for(let i=0;i<gridRows.length;i++){
    const r=gridRows[i];
    if(!r.drill_id && r.minutes==="" && r.balls==="" && !r.notes) continue; // skip empty rows
    if(quiet && !r._dirty) continue; // autosave: only touch changed rows
    const payload={
      player_id:activePlayerId, created_by:me.id, drill_id:r.drill_id||null,
      logged_on:activeDay, sort:i,
      minutes:num(r.minutes), balls:int(r.balls), distance:r.distance||null,
      mental:num(r.mental), physical:num(r.physical),
      status:r.status||"pending", completed:(r.status==="done"), completed_notes:r.completed_notes||null, notes:r.notes||null
    };
    let res;
    if(r.id){ res=await sb.from("sessions").update(payload).eq("id",r.id); }
    else{ res=await sb.from("sessions").insert(payload).select("id").single(); if(res.data)r.id=res.data.id; }
    if(res.error){ ok=false; if(!quiet) flash("Error: "+res.error.message); break; }
    r._dirty=false;
  }
  _saving=false;
  if(s)s.textContent=ok?"Saved":"Save failed";
  if(ok && !quiet) flash("Day saved");
}
function num(x){ return x===""||x==null?null:(+x); }
function int(x){ return x===""||x==null?0:Math.round(+x); }

/* ============================================================

function mondayOf(dateStr){
  const d=new Date(dateStr+"T00:00:00");
  const day=(d.getDay()+6)%7; // 0=Mon
  d.setDate(d.getDate()-day);
  return d;
}
function fmtDay(d){ return d.toLocaleDateString(undefined,{weekday:'short'}); }
function fmtDate(d){ return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

let weekStart = isoDate(mondayOf(todayISO()));

/* ============================================================
   SCHEDULE ENGINE
   Anchors (media/travel/gym/other) sit at fixed times.
   Practice is flexible: it flows into the gaps between them,
   splitting at drill boundaries so no drill is cut in half.
   ============================================================ */
const DAY_START_MIN = 5*60;    // 05:00
const DAY_END_MIN   = 22*60;   // 22:00
const KIND_STYLE = {
  practice:{bg:"rgba(111,216,171,.10)", ac:"#6fd8ab", label:"Practice"},
  media:   {bg:"rgba(169,164,232,.12)", ac:"#a9a4e8", label:"Media"},
  travel:  {bg:"rgba(127,196,221,.12)", ac:"#7fc4dd", label:"Travel"},
  gym:     {bg:"rgba(195,245,60,.10)",  ac:"#c3f53c", label:"Gym"},
  other:   {bg:"rgba(224,162,111,.12)", ac:"#e0a26f", label:"Other"},
  coach:   {bg:"rgba(231,155,192,.12)", ac:"#e79bc0", label:"Coach"}
};

/* Coaches sit ON TOP of practice rather than pushing it around: booking Phil for
   14:00–15:00 doesn't move a single drill, it just marks the drills that fall in
   that window with his name so the team can see time is booked with him. */
const COACHES = [
  {key:"phil", label:"Phil Putting"},
  {key:"mark", label:"Mark Tee to Green"}
];
function coachKeyFor(label){
  const l=String(label||"").toLowerCase();
  const c=COACHES.find(c=>l.indexOf(c.key)>=0);
  return c ? c.key : COACHES[0].key;
}
function itemKindValue(it){ return it.kind==="coach" ? "coach:"+coachKeyFor(it.label) : it.kind; }
function kindSelectOptions(sel){
  const base=["media","travel","gym","other"].map(k=>`<option value="${k}" ${k===sel?"selected":""}>${KIND_STYLE[k].label}</option>`);
  const co=COACHES.map(c=>`<option value="coach:${c.key}" ${("coach:"+c.key)===sel?"selected":""}>Coach · ${c.label}</option>`);
  return base.concat(co).join("");
}
function parseKindValue(v){
  const s=String(v||"");
  if(s.indexOf("coach:")===0){
    const c=COACHES.find(x=>x.key===s.split(":")[1])||COACHES[0];
    return {kind:"coach", label:c.label};
  }
  return {kind:s, label:null};
}
function t2m(t){ if(!t) return null; const p=String(t).split(":"); return (+p[0])*60+(+p[1]||0); }
function m2t(m){ m=Math.round(m); return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(Math.round(m)%60).padStart(2,"0"); }
function durLabel(m){ if(!m) return ""; const h=Math.floor(m/60), r=m%60; return (h?h+"h":"")+(r?(h?" ":"")+r+"m":""); }

/* Minutes to USE for a session row when laying out a timeline.
   This must mirror shownVal() on Day Plan, or the Schedule shows different
   durations from the plan it is drawing: a planned row (today-or-later and not
   done) takes the drill's CURRENT default; past/done rows keep what was logged.
   Expects the row to have been selected with drills(default_minutes) joined. */
function sessionMins(row, dayISO){
  const d = row.drills || null;
  const done = row.status==="done" || row.completed===true;
  const past = dayISO < todayISO();
  const planned = !done && !past;
  const own = row.minutes;
  const blank = own==null || own==="";
  if(d && (planned || blank) && d.default_minutes!=null) return +d.default_minutes||0;
  return blank ? 0 : (+own||0);
}

/* Lay out a day. Returns {blocks, gaps, overlaps} */
function layoutDay(items, drills, dayStart){
  /* Coach bookings overlay practice — they never displace it, so they are held
     back from the anchor list and returned separately. */
  const coaches = items.filter(i=>i.kind==="coach")
    .map(i=>({...i, s:t2m(i.start_time), e:t2m(i.start_time)+(i.duration_mins||0)}))
    .filter(i=>i.s!=null).sort((a,b)=>a.s-b.s);

  const anchors = items.filter(i=>i.kind!=="practice" && i.kind!=="coach")
    .map(i=>({...i, s:t2m(i.start_time), e:t2m(i.start_time)+(i.duration_mins||0)}))
    .filter(i=>i.s!=null).sort((a,b)=>a.s-b.s);

  // overlap detection among anchors
  const overlaps=[];
  for(let i=1;i<anchors.length;i++){
    if(anchors[i].s < anchors[i-1].e){
      overlaps.push(`${anchors[i-1].label||KIND_STYLE[anchors[i-1].kind].label} overlaps ${anchors[i].label||KIND_STYLE[anchors[i].kind].label}`);
    }
  }

  const practiceItems = items.filter(i=>i.kind==="practice");
  const queue = practiceItems.length ? drills.slice() : [];
  let qi = 0;
  let cursor = dayStart!=null ? dayStart : (anchors.length?Math.max(DAY_START_MIN, anchors[0].s-120):9*60);

  const blocks=[]; const gaps=[];
  const pushPractice=(from,until)=>{
    if(qi>=queue.length) return from;
    const take=[]; let t=from;
    while(qi<queue.length){
      const d=queue[qi], mins=+d.minutes||0;
      if(until!=null && t+mins>until) break;
      take.push({...d, s:t, e:t+mins}); t+=mins; qi++;   // each drill carries its own start/finish
    }
    if(take.length){
      blocks.push({kind:"practice", label:"Practice", s:from, e:t, drills:take,
        note:take.length+" drill"+(take.length>1?"s":"")+" · "+durLabel(t-from)});
      return t;
    }
    return from;
  };

  anchors.forEach(a=>{
    if(cursor < a.s){
      const before=cursor;
      cursor = pushPractice(cursor, a.s);
      if(a.s - cursor >= 20) gaps.push({s:cursor, e:a.s});
      else if(cursor===before && a.s-before>=20) gaps.push({s:before, e:a.s});
    }
    blocks.push({...a, freeFrom:cursor, note:durLabel(a.e-a.s)});
    cursor = Math.max(cursor, a.e);
  });
  if(qi<queue.length) cursor = pushPractice(cursor, null);

  /* A coach booking normally shows as a name on the drills it covers. If it covers
     no drill at all it would be invisible, so it gets drawn as its own block. */
  const drillSpans=[];
  blocks.forEach(b=>{ if(b.drills) b.drills.forEach(d=>drillSpans.push(d)); });
  coaches.forEach(c=>{
    c.covers = drillSpans.filter(d=>c.s < d.e && c.e > d.s).length;
    if(!c.covers) blocks.push({...c, note:durLabel(c.e-c.s)});
  });

  blocks.sort((a,b)=>a.s-b.s);
  return {blocks, gaps, overlaps, coaches, unplaced: queue.length-qi};
}

/* The timeline itself */
function renderTimeline(layout, opts){
  const {blocks, gaps, overlaps} = layout;
  const coaches = layout.coaches || [];
  const coachesOn = d => coaches.filter(c=>c.s < d.e && c.e > d.s);   // booked while this drill runs
  const coachTag = list => list.length ? `<div style="flex:0 1 auto; min-width:0; align-self:center; display:flex; flex-direction:column; gap:3px; align-items:center">
      ${list.map(c=>`<span style="max-width:118px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
        color:${KIND_STYLE.coach.ac}; background:rgba(231,155,192,.14);
        border:1px solid rgba(231,155,192,.38); border-radius:999px; padding:3px 9px">${esc(c.label||"Coach")}</span>`).join("")}
    </div>` : "";
  const START=DAY_START_MIN, END=DAY_END_MIN;
  const PXPM=1.6;                  // pixels per minute — roomy, since the day scrolls anyway
  const LABEL_W=46;

  const FOOT_H = 21;                         // summary strip along the bottom of the bubble
  const footStrip = (b, st, clickable) => `<div style="position:absolute; left:6px; right:2px; bottom:2px; height:${FOOT_H}px; box-sizing:border-box; z-index:2;
      display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 10px;
      background:rgba(0,0,0,.42); border-top:1px solid rgba(255,255,255,.07); border-radius:0 0 6px 6px;
      font-size:10.5px; letter-spacing:.03em">
    <span style="color:var(--muted); white-space:nowrap">${b.drills.length} drill${b.drills.length>1?"s":""} · <b style="color:var(--ink); font-weight:700">${durLabel(b.e-b.s)}</b></span>
    <span style="color:${st.ac}; font-weight:700; white-space:nowrap">${m2t(b.s)}–${m2t(b.e)}${clickable?" ›":""}</span>
  </div>`;
  const MIN_ROW = 54;                        // a row never gets smaller than its own text
  // rough line count for the drill name — the pill takes the right half, so ~24 chars fit
  const rowNeed = (name, coachCount) => 37 + 17*Math.min(3, Math.max(1, Math.ceil((name||"").length/(coachCount?16:24))))
                                          + (coachCount>1 ? 20*(coachCount-1) : 0);
  /* Rows sit on their time span, but never below MIN_ROW. If a short drill needs more
     room than its slice, the rows after it shift down rather than being squashed. */
  const drillRows = (b, st) => {
    let cursor=0, html="";
    b.drills.forEach(d=>{
      const cs=coachesOn(d);
      const rowTop=Math.max((d.s-b.s)*PXPM, cursor);
      const rowH=Math.max((d.e-d.s)*PXPM-4, MIN_ROW, rowNeed(d.name, cs.length));
      cursor=rowTop+rowH+4;
      html+=`<div style="position:absolute; top:${rowTop}px; height:${rowH}px; left:0; right:0; box-sizing:border-box;
        background:rgba(0,0,0,.22); border-left:2px solid ${st.ac}; border-radius:6px;
        padding:9px 10px; overflow:hidden;
        display:flex; align-items:flex-start; justify-content:space-between; gap:10px">
      <div style="min-width:0; flex:1">
        <div style="font-size:13px; font-weight:600; color:var(--ink); line-height:1.3">${esc(d.name)}</div>
        <div style="font-size:11px; font-weight:700; color:${st.ac}; margin-top:4px; white-space:nowrap">${m2t(d.s)}–${m2t(d.e)}</div>
      </div>
      ${coachTag(cs)}
      ${d.category?`<div style="flex-shrink:0; text-align:right">
        <span class="pill ${pillClass(d.category)}">${esc(d.category)}</span>
        <div style="font-size:11px; color:var(--faint); margin-top:4px">${d.minutes||0}m</div>
      </div>`:""}
    </div>`;
    });
    return {html, used:cursor};
  };

  /* ---- measure pass ----
     Work out how tall each block actually needs to be, then stretch the page to suit.
     A block is never shorter than its duration, and never scrolls inside itself:
     if its drills need more room, everything below simply moves down. */
  const meta = blocks.map(b=>{
    const st=KIND_STYLE[b.kind]||KIND_STYLE.other;
    const natural=Math.max((b.e-b.s)*PXPM, 20);
    let rows=null, foot=false, need=natural;
    if(b.kind==="practice" && b.drills && b.drills.length){
      rows=drillRows(b,st);
      foot=(b.e-b.s)*PXPM>=90;
      need=rows.used + (foot?FOOT_H:0) + 6;
    }
    return {b, st, rows, foot, h:Math.max(natural, need)};
  });

  /* Time → pixel map. Linear at PXPM through free time, and each block occupies
     its own measured height, so nothing overlaps and nothing is clipped. */
  const pts=[[START,0]];
  let cy=0, prevM=START;
  meta.forEach(mt=>{
    cy += Math.max(0, mt.b.s-prevM)*PXPM;
    pts.push([mt.b.s, cy]);
    cy += mt.h;
    pts.push([Math.max(mt.b.e, mt.b.s+1), cy]);
    prevM = Math.max(prevM, mt.b.e);
  });
  cy += Math.max(0, END-prevM)*PXPM;
  pts.push([END, cy]);
  const totalH = cy;
  const y = m => {
    if(m<=pts[0][0]) return pts[0][1];
    for(let i=1;i<pts.length;i++){
      const [m0,y0]=pts[i-1], [m1,y1]=pts[i];
      if(m<=m1) return m1===m0 ? y1 : y0 + (m-m0)/(m1-m0)*(y1-y0);
    }
    return totalH;
  };

  // hour lines
  let hours="";
  for(let h=Math.ceil(START/60); h<=Math.floor(END/60); h++){
    const top=y(h*60);
    hours+=`<div style="position:absolute; top:${top}px; left:0; width:${LABEL_W-4}px; font-size:10px; color:var(--faint); transform:translateY(-6px); text-align:right">${String(h).padStart(2,"0")}:00</div>
            <div style="position:absolute; top:${top}px; left:${LABEL_W}px; right:0; border-top:1px solid var(--line); opacity:.3"></div>`;
  }

  // gaps sit exactly on their time span
  const gapEls = gaps.map(g=>{
    const top=y(g.s), h=Math.max(y(g.e)-y(g.s),18);
    return `<div style="position:absolute; top:${top}px; height:${h}px; left:${LABEL_W+6}px; right:2px;
        border:1px dashed var(--line); border-radius:6px; display:flex; align-items:center; justify-content:center">
      <span style="font-size:10px; color:var(--faint); letter-spacing:.05em">FREE · ${durLabel(g.e-g.s)}</span></div>`;
  }).join("");

  const blockEls = meta.map(mt=>{
    const b=mt.b, st=mt.st, top=y(b.s), h=mt.h;
    const clickable = opts.linkPractice && b.kind==="practice";
    const shell = (inner, pad) => `<div ${clickable?`data-jump="1"`:""} style="position:absolute; top:${top}px; height:${h}px; left:${LABEL_W+6}px; right:2px;
        background:${st.bg}; border-left:3px solid ${st.ac}; border-radius:7px; padding:${pad}; overflow:hidden; ${clickable?"cursor:pointer":""}">${inner}</div>`;

    if(mt.rows){
      return shell(`
        <div style="position:absolute; top:2px; left:6px; right:2px; bottom:2px">${mt.rows.html}</div>
        ${mt.foot?footStrip(b,st,clickable):""}`, "0");
    }

    const roomForNote = h>40;
    return shell(`
      <div style="display:flex; justify-content:space-between; gap:8px; align-items:baseline">
        <span style="font-size:13px; font-weight:700; color:var(--ink)">${esc(b.label||st.label)}${b.is_private?' <span style="font-size:9px;color:var(--faint)">PRIVATE</span>':''}</span>
        <span style="font-size:11px; color:${st.ac}; font-weight:700; white-space:nowrap">${m2t(b.s)}–${m2t(b.e)}</span>
      </div>
      ${roomForNote&&b.note?`<div style="font-size:10px; color:var(--muted); margin-top:1px">${esc(b.note)}</div>`:""}`, "6px 10px");
  }).join("");

  const warn = overlaps.length
    ? `<div class="err" style="margin-bottom:10px">⚠ ${overlaps.map(esc).join(" · ")}</div>` : "";
  const unplaced = layout.unplaced>0
    ? `<div style="background:#2e2a1a; border:1px solid #6a5a2a; color:#e0cf8f; padding:9px 12px; border-radius:8px; font-size:12px; margin-bottom:10px">
        ${layout.unplaced} drill${layout.unplaced>1?"s":""} couldn't fit before your last commitment — they run on after it.</div>` : "";

  const legend = `<div style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; font-size:11px; color:var(--muted)">
    ${Object.keys(KIND_STYLE).map(k=>`<span style="display:flex;align-items:center;gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:${KIND_STYLE[k].ac};display:inline-block"></i>${KIND_STYLE[k].label}</span>`).join("")}
    <span style="display:flex;align-items:center;gap:5px"><i style="width:10px;height:10px;border-radius:3px;border:1px dashed var(--line);display:inline-block"></i>Free</span>
  </div>`;

  return warn+unplaced+legend+
    `<div class="gridwrap" style="padding:10px 8px 10px 4px"><div style="position:relative; height:${totalH}px">${hours}${gapEls}${blockEls}</div></div>`;
}

/* ---- export a day (or the season) to calendar ---- */
function icsEscape(t){ return String(t||"").replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n"); }
function icsStamp(dateStr, timeStr){
  const t=(timeStr||"00:00").replace(":","");
  return dateStr.replace(/-/g,"")+"T"+t+"00";
}
function downloadICS(filename, events){
  let out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Practice Schedule//EN","CALSCALE:GREGORIAN"];
  events.forEach((e,i)=>{
    out.push("BEGIN:VEVENT");
    out.push("UID:ps-"+Date.now()+"-"+i+"@practice");
    out.push("DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z");
    if(e.allDay){
      out.push("DTSTART;VALUE=DATE:"+e.start.replace(/-/g,""));
      out.push("DTEND;VALUE=DATE:"+e.end.replace(/-/g,""));
    } else {
      out.push("DTSTART:"+icsStamp(e.date,e.start));
      out.push("DTEND:"+icsStamp(e.date,e.end||e.start));
    }
    out.push("SUMMARY:"+icsEscape(e.title));
    if(e.desc) out.push("DESCRIPTION:"+icsEscape(e.desc));
    out.push("END:VEVENT");
  });
  out.push("END:VCALENDAR");
  const blob=new Blob([out.join("\r\n")],{type:"text/calendar"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  URL.revokeObjectURL(a.href);
}

/* ---- export a day as an image (for sending to the team) ----
   A drawn copy of the Schedule tab: same true-to-time timeline, hour lines,
   free gaps, uniform-width blocks and drill rows inside practice. Straight onto
   a canvas — no libraries, works offline, and the result is a plain PNG the
   phone can share like a photo. */
function exportDayImage(lay, dayISO, playerName){
  const W=820, PAD=24, SCALE=2, GUT=48;
  const X0=PAD+GUT, X1=W-PAD, COLW=X1-X0;      // every block is this same width
  const PXPM=1.05, ROW_H=36, HEAD=132, FOOT=42;

  const blocks=(lay.blocks||[]).slice().sort((a,b)=>a.s-b.s);
  const coaches=(lay.coaches||[]);
  const minS=Math.min.apply(null, blocks.map(b=>b.s));
  const maxE=Math.max.apply(null, blocks.map(b=>b.e));
  const START=Math.max(0, Math.floor((minS-20)/60)*60);
  const END=Math.min(24*60, Math.ceil((maxE+20)/60)*60);

  /* measure: a block is never shorter than its duration, and never shorter than
     the rows it has to hold. Rows sit on their own time span inside the block,
     exactly as they do on the Schedule tab. */
  const rowsOf=b=>{
    let cursor=26; const out=[];
    b.drills.forEach(d=>{
      const top=Math.max((d.s-b.s)*PXPM+26, cursor);
      const h=Math.max((d.e-d.s)*PXPM-6, ROW_H-6);
      out.push({d, top, h});
      cursor=top+h+6;
    });
    return {out, used:cursor+6};
  };
  const meta=blocks.map(b=>{
    const st=KIND_STYLE[b.kind]||KIND_STYLE.other;
    const isP=b.kind==="practice" && b.drills && b.drills.length;
    const rows=isP ? rowsOf(b) : null;
    const need=isP ? rows.used : 50;
    return {b, st, isP, rows, h:Math.max((b.e-b.s)*PXPM, need)};
  });
  const pts=[[START,0]];
  let cy=0, prev=START;
  meta.forEach(m=>{
    cy+=Math.max(0, m.b.s-prev)*PXPM; pts.push([m.b.s,cy]);
    cy+=m.h;                          pts.push([Math.max(m.b.e,m.b.s+1),cy]);
    prev=Math.max(prev, m.b.e);
  });
  cy+=Math.max(0, END-prev)*PXPM; pts.push([END,cy]);
  const bodyH=cy, H=HEAD+bodyH+FOOT;
  const yOf=m=>{
    if(m<=pts[0][0]) return pts[0][1];
    for(let i=1;i<pts.length;i++){
      const a=pts[i-1], b=pts[i];
      if(m<=b[0]) return b[0]===a[0] ? b[1] : a[1]+(m-a[0])/(b[0]-a[0])*(b[1]-a[1]);
    }
    return bodyH;
  };

  const cv=document.createElement("canvas");
  cv.width=W*SCALE; cv.height=H*SCALE;
  const g=cv.getContext("2d");
  g.scale(SCALE,SCALE);
  const F=(w,s)=>w+" "+s+'px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
  const fit=(txt,maxW)=>{
    let t=String(txt||"");
    if(g.measureText(t).width<=maxW) return t;
    while(t.length>1 && g.measureText(t+"…").width>maxW) t=t.slice(0,-1);
    return t+"…";
  };
  const rr=(x,y,w,h,r)=>{
    const k=Math.min(r, w/2, h/2);
    g.beginPath();
    g.moveTo(x+k,y); g.lineTo(x+w-k,y); g.quadraticCurveTo(x+w,y,x+w,y+k);
    g.lineTo(x+w,y+h-k); g.quadraticCurveTo(x+w,y+h,x+w-k,y+h);
    g.lineTo(x+k,y+h); g.quadraticCurveTo(x,y+h,x,y+h-k);
    g.lineTo(x,y+k); g.quadraticCurveTo(x,y,x+k,y); g.closePath();
  };

  // ---- background + header ----
  g.fillStyle="#141920"; g.fillRect(0,0,W,H);
  const nice=new Date(dayISO+"T00:00:00").toLocaleDateString(undefined,
    {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  g.fillStyle="#c3f53c"; g.fillRect(PAD,PAD,48,5);
  g.font=F(700,12); g.fillStyle="#8b97a3"; g.fillText("PRACTICE SCHEDULE", PAD, PAD+30);
  g.font=F(800,26); g.fillStyle="#eef2f0"; g.fillText(fit(nice, COLW), PAD, PAD+64);
  if(playerName){ g.font=F(600,14); g.fillStyle="#8b97a3"; g.fillText(fit(playerName, COLW), PAD, PAD+88); }
  g.strokeStyle="#333c46"; g.lineWidth=1;
  g.beginPath(); g.moveTo(PAD, HEAD-16); g.lineTo(W-PAD, HEAD-16); g.stroke();

  const Y=m=>HEAD+yOf(m);

  // ---- hour lines ----
  for(let h=Math.ceil(START/60); h<=Math.floor(END/60); h++){
    const ty=Y(h*60);
    g.font=F(600,11); g.fillStyle="#5b6672"; g.textAlign="right";
    g.fillText(String(h).padStart(2,"0")+":00", PAD+GUT-10, ty+4);
    g.textAlign="left";
    g.strokeStyle="#242c35"; g.lineWidth=1;
    g.beginPath(); g.moveTo(X0, ty+.5); g.lineTo(X1, ty+.5); g.stroke();
  }

  // ---- free gaps ----
  (lay.gaps||[]).forEach(gp=>{
    const ty=Y(gp.s), hh=Math.max(Y(gp.e)-ty, 18);
    g.strokeStyle="#333c46"; g.lineWidth=1;
    if(g.setLineDash) g.setLineDash([5,4]);
    rr(X0, ty, COLW, hh, 6); g.stroke();
    if(g.setLineDash) g.setLineDash([]);
    g.font=F(600,11); g.fillStyle="#5b6672"; g.textAlign="center";
    g.fillText("FREE · "+durLabel(gp.e-gp.s), X0+COLW/2, ty+hh/2+4);
    g.textAlign="left";
  });

  // ---- blocks ----
  meta.forEach(m=>{
    const b=m.b, st=m.st, ty=Y(b.s), hh=m.h;
    g.fillStyle=st.bg; rr(X0, ty, COLW, hh, 7); g.fill();
    g.fillStyle=st.ac; rr(X0, ty, 4, hh, 2); g.fill();

    if(m.isP){
      g.font=F(700,11); g.fillStyle="#8b97a3";
      g.fillText("PRACTICE · "+b.drills.length+" drill"+(b.drills.length>1?"s":"")+" · "+durLabel(b.e-b.s), X0+16, ty+18);
      g.textAlign="right"; g.fillStyle=st.ac; g.font=F(700,11);
      g.fillText(m2t(b.s)+" – "+m2t(b.e), X1-14, ty+18);
      g.textAlign="left";
      let ry=ty+26;
      m.rows.out.forEach(r=>{
        const d=r.d, rh=r.h;
        ry=ty+r.top;
        g.fillStyle="rgba(0,0,0,.24)"; rr(X0+12, ry, COLW-24, rh, 6); g.fill();
        g.fillStyle=st.ac; g.fillRect(X0+12, ry+4, 2, Math.max(4,rh-8));
        g.font=F(700,11); g.fillStyle=st.ac;
        g.fillText(m2t(d.s)+" – "+m2t(d.e), X0+24, ry+rh/2+4);
        const nx=X0+24+96;
        const cs=coaches.filter(c=>c.s<d.e && c.e>d.s).map(c=>c.label||"Coach").join(" · ");
        // right-hand side: category, then coach name to its left
        let right=X1-24;
        if(d.category){
          g.font=F(700,10); g.fillStyle="#8b97a3";
          const cw=g.measureText(d.category.toUpperCase()).width;
          g.textAlign="right"; g.fillText(d.category.toUpperCase(), right, ry+rh/2+4); g.textAlign="left";
          right-=cw+14;
        }
        if(cs){
          g.font=F(700,10); g.fillStyle="#e79bc0";
          const ww=Math.min(g.measureText(cs.toUpperCase()).width, 190);
          g.textAlign="right"; g.fillText(fit(cs.toUpperCase(), 190), right, ry+rh/2+4); g.textAlign="left";
          right-=ww+14;
        }
        g.font=F(600,13); g.fillStyle="#eef2f0";
        g.fillText(fit(d.name, Math.max(60, right-nx-8)), nx, ry+rh/2+4);
      });
    } else {
      g.font=F(800,15); g.fillStyle="#eef2f0";
      g.fillText(fit((b.label||st.label)+(b.is_private?"  (private)":""), COLW-150), X0+16, ty+24);
      g.font=F(700,12); g.fillStyle=st.ac; g.textAlign="right";
      g.fillText(m2t(b.s)+" – "+m2t(b.e), X1-14, ty+24); g.textAlign="left";
      g.font=F(600,11); g.fillStyle="#8b97a3";
      g.fillText(st.label.toUpperCase()+" · "+durLabel(b.e-b.s), X0+16, ty+40);
    }
  });

  g.font=F(600,11); g.fillStyle="#5b6672";
  g.fillText("Practice Schedule · "+dayISO, PAD, H-PAD+4);

  // ---- show it ----
  const url=cv.toDataURL("image/png");
  let shareFile=null;
  try{ cv.toBlob(b=>{ if(b) shareFile=new File([b], "schedule-"+dayISO+".png", {type:"image/png"}); }, "image/png"); }catch(e){}

  const wrap=document.createElement("div"); wrap.className="cmodal";
  wrap.innerHTML=`<div class="cbox" style="max-width:560px">
    <div class="chead"><div><b>Schedule image</b><div class="who">${esc(nice)}</div></div>
      <button class="cx" id="imx">×</button></div>
    <div class="clist" style="padding:12px">
      <img src="${url}" alt="Schedule" style="width:100%; display:block; border-radius:8px; border:1px solid var(--line)">
      <p class="who" style="margin:10px 0 0">Touch and hold the image to save it or send it on.</p>
    </div>
    <div class="cfoot">
      <button class="btn btn-ghost btn-sm" id="imclose">Close</button>
      <button class="btn btn-primary btn-sm" id="imshare" style="margin-left:auto">Share</button>
    </div></div>`;
  document.body.appendChild(wrap);
  const close=()=>wrap.remove();
  wrap.onclick=e=>{ if(e.target===wrap) close(); };
  document.getElementById("imx").onclick=close;
  document.getElementById("imclose").onclick=close;
  document.getElementById("imshare").onclick=()=>{
    if(shareFile && navigator.canShare && navigator.canShare({files:[shareFile]})){
      navigator.share({files:[shareFile], title:"Schedule "+dayISO}).catch(()=>{});
      return;
    }
    const a=document.createElement("a");
    a.href=url; a.download="schedule-"+dayISO+".png"; a.click();
  };
}

function timeOptions(sel){
  let out="", hit=false;
  for(let h=4; h<24; h++){
    for(let m=0; m<60; m+=5){                      // 5-minute increments
      const t=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
      if(t===sel) hit=true;
      out+=`<option value="${t}" ${t===sel?"selected":""}>${t}</option>`;
    }
  }
  // keep an already-saved off-grid time (e.g. 09:07) selectable rather than silently resetting
  if(sel && !hit) out=`<option value="${sel}" selected>${sel}</option>`+out;
  return out;
}

/* Durations, also in 5s up to an hour, then coarser. */
function minsOptions(sel){
  const list=[];
  for(let m=5; m<=120; m+=5) list.push(m);
  [150,180,210,240,300,360].forEach(m=>list.push(m));
  return list.map(m=>`<option value="${m}" ${m===sel?"selected":""}>${durLabel(m)}</option>`).join("");
}

function addMins(hhmm, mins){
  if(!hhmm) return "";
  const p=hhmm.split(":"); if(p.length<2) return "";
  const d=new Date(2000,0,1,+p[0]||0,+p[1]||0);
  d.setMinutes(d.getMinutes()+(mins||0));
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
