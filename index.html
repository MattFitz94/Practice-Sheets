      <button class="btn btn-ghost btn-sm" id="sexport">Add to calendar</button>
    </div>
    <div id="schedbody"></div>`;

  const shift=n=>{ const d=new Date(schedDay+"T00:00:00"); d.setDate(d.getDate()+n); schedDay=isoDate(d); keepScroll(()=>scheduleScreen(v)); };
  document.getElementById("sprev").onclick=()=>shift(-1);
  document.getElementById("snext").onclick=()=>shift(1);
  document.getElementById("stoday").onclick=()=>{ schedDay=todayISO(); keepScroll(()=>scheduleScreen(v)); };
  document.getElementById("sday").onchange=e=>{ schedDay=e.target.value; scheduleScreen(v); };
  document.getElementById("sweek").onclick=()=>scheduleWeek(v);
  document.getElementById("sexport").onclick=()=>{
    if(!layout.blocks.length){ flash("Nothing to export"); return; }
    const evs=layout.blocks.map(b=>({
      date:schedDay, start:m2t(b.s), end:m2t(b.e),
      title:b.label||KIND_STYLE[b.kind].label,
      desc:b.drills?b.drills.map(d=>m2t(d.s)+"–"+m2t(d.e)+"  "+d.name).join("\n"):""
    }));
    // coaches overlay practice, so they aren't blocks — export them in their own right
    (layout.coaches||[]).filter(c=>c.covers).forEach(c=>evs.push({
      date:schedDay, start:m2t(c.s), end:m2t(c.e), title:c.label||"Coach", desc:"Booked with coach"
    }));
    downloadICS("schedule-"+schedDay+".ics", evs);
    flash("Calendar file downloaded");
  };

  const body=document.getElementById("schedbody");
  if(!items?.length){
    body.innerHTML=`<div class="empty">Nothing scheduled.${me.role==="player"?" Use <b>Build a day</b> to set it up.":""}</div>`;
    return;
  }
  body.innerHTML=renderTimeline(layout,{linkPractice: me.role==="player"});
  if(me.role==="player"){
    body.querySelectorAll("[data-jump]").forEach(el=>el.onclick=()=>{
      activeDay=schedDay; currentTab="day"; shell();
    });
  }
}

/* ---- week of timelines ---- */
async function scheduleWeek(v){
  const pid = me.role==="player" ? me.id : activePlayerId;
  const mon = mondayOf(schedDay);
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(mon); d.setDate(d.getDate()+i); return isoDate(d); });

  v.innerHTML=`
    <div class="daybar">
      <button class="btn btn-ghost btn-sm" id="wprev">‹ Prev</button>
      <div class="who" style="font-weight:700; color:var(--ink)">Week of ${days[0]}</div>
      <button class="btn btn-ghost btn-sm" id="wnext">Next ›</button>
      <button class="btn btn-ghost btn-sm" id="wday">Day view</button>
    </div>
    <div id="wkbody"><div class="load">Loading</div></div>`;
  document.getElementById("wprev").onclick=()=>{ const d=new Date(days[0]+"T00:00:00"); d.setDate(d.getDate()-7); schedDay=isoDate(d); scheduleWeek(v); };
  document.getElementById("wnext").onclick=()=>{ const d=new Date(days[0]+"T00:00:00"); d.setDate(d.getDate()+7); schedDay=isoDate(d); scheduleWeek(v); };
  document.getElementById("wday").onclick=()=>scheduleScreen(v);

  const [{data:allItems},{data:allSess}] = await Promise.all([
    sb.from("schedule_items").select("*").eq("player_id",pid).gte("day",days[0]).lte("day",days[6]),
    sb.from("sessions").select("minutes, sort, logged_on, status, completed, drills(name,default_minutes)").eq("player_id",pid).gte("logged_on",days[0]).lte("logged_on",days[6]).order("sort")
  ]);

  const span=DAY_END_MIN-DAY_START_MIN, PX=380;
  const cols=days.map(dt=>{
    const items=(allItems||[]).filter(i=>i.day===dt);
    const drills=(allSess||[]).filter(x=>x.logged_on===dt&&x.drills).map(x=>({name:x.drills.name,minutes:sessionMins(x,dt)}));
    const ds=t2m(items.find(i=>i.kind==="practice")?.start_time) ?? null;
    const lay=layoutDay(items,drills,ds);
    const isToday=dt===todayISO();
    const d=new Date(dt+"T00:00:00");
    const bl=lay.blocks.map(b=>{
      const st=KIND_STYLE[b.kind]||KIND_STYLE.other;
      const top=(b.s-DAY_START_MIN)/span*PX, h=Math.max((b.e-b.s)/span*PX,10);
      return `<div title="${esc(b.label||st.label)} ${m2t(b.s)}–${m2t(b.e)}" style="position:absolute; top:${top}px; height:${h}px; left:2px; right:2px; background:${st.bg}; border-left:3px solid ${st.ac}; border-radius:5px; overflow:hidden; padding:2px 4px">
        ${h>26?`<div style="font-size:9px; color:var(--ink); font-weight:600; line-height:1.2">${esc((b.label||st.label).slice(0,18))}</div><div style="font-size:8px;color:var(--muted)">${m2t(b.s)}</div>`:""}</div>`;
    }).join("");
    // coach bookings sit on top of whatever is underneath them
    const co=(lay.coaches||[]).map(c=>{
      const top=(c.s-DAY_START_MIN)/span*PX, h=Math.max((c.e-c.s)/span*PX,8);
      return `<div title="${esc(c.label||"Coach")} ${m2t(c.s)}–${m2t(c.e)}" style="position:absolute; top:${top}px; height:${h}px; left:2px; right:2px;
        border:1px solid ${KIND_STYLE.coach.ac}; background:rgba(231,155,192,.16); border-radius:5px; overflow:hidden; padding:1px 4px">
        ${h>16?`<div style="font-size:9px; font-weight:700; color:${KIND_STYLE.coach.ac}; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${esc((c.label||"Coach"))}</div>`:""}</div>`;
    }).join("");
    return `<div style="flex:1; min-width:104px">
      <div style="padding:6px; text-align:center; background:${isToday?'var(--blood-2)':'var(--panel-2)'}; color:${isToday?'var(--lime-ink)':'var(--ink)'}; border-radius:7px 7px 0 0; font-size:11px; font-weight:800; text-transform:uppercase">
        ${d.toLocaleDateString(undefined,{weekday:'short'})}<div style="font-size:10px; opacity:.75; font-weight:600">${d.getDate()}/${d.getMonth()+1}</div></div>
      <div style="position:relative; height:${PX}px; background:var(--panel); border:1px solid var(--line); border-top:0; border-radius:0 0 7px 7px">${bl}${co}</div>
    </div>`;
  }).join("");

  document.getElementById("wkbody").innerHTML=
    `<div style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; font-size:11px; color:var(--muted)">
      ${Object.keys(KIND_STYLE).map(k=>`<span style="display:flex;align-items:center;gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:${KIND_STYLE[k].ac};display:inline-block"></i>${KIND_STYLE[k].label}</span>`).join("")}
    </div>
    <div style="overflow-x:auto"><div style="display:flex; gap:6px; min-width:760px">${cols}</div></div>`;
}

/* ============================================================
   9b. BUILD A DAY — where you set it up (player only)
   ============================================================ */
async function buildScreen(v){
  if(me.role!=="player"){ v.innerHTML=`<div class="empty">Only you can build the schedule.</div>`; return; }

  const [{data:items},{data:sess},{data:presetRows}] = await Promise.all([
    sb.from("schedule_items").select("*").eq("player_id",me.id).eq("day",schedDay).order("start_time"),
    sb.from("sessions").select("id, minutes, sort, status, completed, drills(name,category,default_minutes)").eq("player_id",me.id).eq("logged_on",schedDay).order("sort"),
    sb.from("day_templates").select("*").eq("player_id",me.id).order("sort")
  ]);
  const sessRows=(sess||[]).filter(x=>x.drills);            // the day's drills, in the order they're done
  const drillsOf=rows=>rows.map(x=>({name:x.drills.name, category:x.drills.category, minutes:sessionMins(x,schedDay)}));
  const drills=drillsOf(sessRows);
  const totalPractice=drills.reduce((a,d)=>a+d.minutes,0);
  const practiceRow=(items||[]).find(i=>i.kind==="practice");
  const anchors=(items||[]).filter(i=>i.kind!=="practice").sort((a,b)=>t2m(a.start_time)-t2m(b.start_time));
  // coach bookings are MEANT to sit on top of practice, so they never count as a clash
  const hardAnchors=anchors.filter(i=>i.kind!=="coach");

  /* Quick adds: one-tap fixed items, all of them your own. Build an item in the
     add row (or open one you've already made) and tap ★ Save to keep it. They're
     stored per player as single-item rows in day_templates. */
  const savedQA=(presetRows||[]).filter(t=>Array.isArray(t.items) && t.items.length);
  let qaEdit=false;

  v.innerHTML=`
    <div class="daybar">
      <button class="btn btn-ghost btn-sm" id="bprev">‹</button>
      <div class="dsel"><span class="who">Day</span><input type="date" id="bday" value="${schedDay}"></div>
      <button class="btn btn-ghost btn-sm" id="bnext">›</button>
      <button class="btn btn-ghost btn-sm" id="btoday">Today</button>
      <button class="btn btn-ghost btn-sm" id="bexport">Export image</button>
    </div>

    <!-- 1. PRACTICE START (top) -->
    <div class="card">
      <div class="inline" style="margin-bottom:10px">
        <h3 style="font-size:14px; text-transform:uppercase; letter-spacing:.04em; margin:0">Practice start</h3>
        <span class="who" style="margin-left:auto">${drills.length?`${durLabel(totalPractice)} · ${drills.length} drills`:"no drills yet"}</span>
      </div>
      ${drills.length?`
        <select id="pstart" style="width:100%; box-sizing:border-box; display:block">${timeOptions(practiceRow?.start_time||"09:00")}</select>
        <button class="btn btn-primary btn-sm" id="psave" style="width:100%; box-sizing:border-box; display:block; margin-top:8px">${practiceRow?"Update practice start":"Set practice start"}</button>
        <p class="who" style="margin:8px 0 0">Practice fills the gaps between your fixed items below.</p>
      `:`<div class="empty" style="padding:14px">Add drills on the Day Plan first — practice time comes from there.</div>`}
    </div>

    <!-- 2. FIXED ITEMS: quick adds, the list, inline add -->
    <div class="sec-h"><h2>Fixed items</h2></div>
    <div class="card" id="blist"></div>

    <!-- 3. THE WHOLE DAY, IN ORDER -->
    <div class="sec-h"><h2>Day order</h2></div>
    <div class="card" id="porder"></div>`;

  const shift=n=>{ const d=new Date(schedDay+"T00:00:00"); d.setDate(d.getDate()+n); schedDay=isoDate(d); keepScroll(()=>buildScreen(v)); };
  document.getElementById("bprev").onclick=()=>shift(-1);
  document.getElementById("bnext").onclick=()=>shift(1);
  document.getElementById("btoday").onclick=()=>{ schedDay=todayISO(); keepScroll(()=>buildScreen(v)); };
  document.getElementById("bday").onchange=e=>{ schedDay=e.target.value; keepScroll(()=>buildScreen(v)); };

  const ps=document.getElementById("psave");
  if(ps) ps.onclick=async()=>{
    const t=val("pstart");
    const res = practiceRow
      ? await sb.from("schedule_items").update({start_time:t}).eq("id",practiceRow.id)
      : await sb.from("schedule_items").insert({player_id:me.id, day:schedDay, start_time:t, kind:"practice", label:"Practice", is_anchor:false});
    if(res.error){ flash(res.error.message); return; }
    flash("Practice set"); keepScroll(()=>buildScreen(v));
  };

  document.getElementById("bexport").onclick=()=>{
    const lay=layoutDay(items||[], drillsOf(sessRows), t2m(practiceRow?.start_time) ?? null);
    if(!lay.blocks.length){ flash("Nothing to export yet"); return; }
    exportDayImage(lay, schedDay, me.full_name||"");
  };

  renderBuildList();
  renderDayOrder();

  /* ---- Day order ----
     One list of everything on the day, in the order it happens. The arrows move
     a row one place; what that means depends on what is moving:
       drill ↔ drill  swap their place in the practice queue
       item  ↔ item   the pair runs back-to-back from the earlier one's start
       drill ↔ item   the item's start hops to the other side of that drill
     Coach bookings sit on top of practice, so they aren't moved from here.
     Times come from the same layout the Schedule tab draws, and the day is
     re-read after every move, so what's on screen is always the truth. */
  let _moving=false;

  function dayEntries(){
    const lay=layoutDay(items||[], drillsOf(sessRows), t2m(practiceRow?.start_time) ?? null);
    const out=[]; let k=0;
    lay.blocks.forEach(b=>{
      if(b.kind==="practice" && b.drills && b.drills.length){
        b.drills.forEach(d=>{
          out.push({type:"drill", q:k, name:d.name, cat:d.category, kind:"practice", s:d.s, e:d.e});
          k++;
        });
      } else {
        const it=(items||[]).find(x=>String(x.id)===String(b.id));
        out.push({type:b.kind==="coach"?"coach":"item", it, kind:b.kind,
          name:b.label||(KIND_STYLE[b.kind]||KIND_STYLE.other).label,
          s:b.s, e:b.e, freeFrom:(b.freeFrom!=null?b.freeFrom:b.s)});
      }
    });
    // coach bookings that lie over practice aren't blocks — slot them in by time
    (lay.coaches||[]).filter(c=>c.covers).forEach(c=>{
      out.push({type:"coach", it:(items||[]).find(x=>String(x.id)===String(c.id)),
        kind:"coach", name:c.label||"Coach", s:c.s, e:c.e});
    });
    out.sort((a,b)=> (a.s-b.s) || (a.type==="coach"?1:-1));
    return out;
  }

  function renderDayOrder(){
    const box=document.getElementById("porder");
    const ents=dayEntries();
    if(!ents.length){
      box.innerHTML=`<div class="empty" style="border:0; padding:14px">Nothing on this day yet. Add drills on the <b>Day Plan</b>, or a fixed item above.</div>`;
      return;
    }
    const movable=[];
    ents.forEach((e,i)=>{ if(e.type!=="coach") movable.push(i); });

    const rows=ents.map((e,i)=>{
      const st=(e.type==="drill") ? KIND_STYLE.practice : (KIND_STYLE[e.kind]||KIND_STYLE.other);
      const mi=movable.indexOf(i);
      const up = mi>0, dn = mi>=0 && mi<movable.length-1;
      const arrows = e.type==="coach"
        ? `<span class="who" style="flex:0 0 auto; font-size:10px">over practice</span>`
        : `<span style="flex:0 0 auto; display:flex; gap:4px">
             <button class="btn btn-ghost btn-sm dmv" data-i="${i}" data-d="-1" ${up?"":'disabled style="opacity:.25"'}>↑</button>
             <button class="btn btn-ghost btn-sm dmv" data-i="${i}" data-d="1" ${dn?"":'disabled style="opacity:.25"'}>↓</button>
           </span>`;
      const tag = e.type==="drill"
        ? (e.cat?`<span class="pill ${pillClass(e.cat)}" style="flex:0 0 auto">${esc(e.cat)}</span>`:"")
        : `<span class="pill" style="background:${st.bg}; color:${st.ac}; flex:0 0 auto">${st.label}</span>`;
      return `<div class="row-item" style="gap:8px; border-left:3px solid ${st.ac}; padding-left:10px">
        <div class="name" style="min-width:0">${esc(e.name)}
          <small>${m2t(e.s)} – ${m2t(e.e)} · ${durLabel(e.e-e.s)||"0m"}</small></div>
        ${tag}
        ${arrows}
      </div>`;
    }).join("");

    box.innerHTML = rows +
      `<p class="who" style="margin:10px 0 0">Arrows re-time the day from that point on. Tap a fixed item above to set an exact time instead.</p>`;

    box.querySelectorAll(".dmv").forEach(b=>b.onclick=async()=>{
      if(_moving || b.disabled) return;
      _moving=true;
      try{
        const i=+b.dataset.i, dir=+b.dataset.d;
        const j=movable[movable.indexOf(i)+dir];
        if(j==null) return;
        const a=ents[Math.min(i,j)], z=ents[Math.max(i,j)];   // a is the earlier of the two
        if(await applyMove(a,z)){ flash("Day updated"); keepScroll(()=>buildScreen(v)); }
      } finally { _moving=false; }
    });
  }

  /* Put z (the later of the pair) ahead of a. */
  async function applyMove(a,z){
    if(a.type==="drill" && z.type==="drill"){
      const t=sessRows[a.q]; sessRows[a.q]=sessRows[z.q]; sessRows[z.q]=t;
      return await saveOrder();
    }
    if(a.type==="item" && z.type==="item"){
      const dz=z.e-z.s;
      return await setStarts([[z.it, a.s], [a.it, a.s+dz]]);
    }
    if(a.type==="drill" && z.type==="item"){
      // the item takes the drill's slot; the drill is pushed out behind it
      return await setStarts([[z.it, a.s]]);
    }
    if(a.type==="item" && z.type==="drill"){
      // leave room in front of the item for that drill to drop into
      const base = a.freeFrom!=null ? a.freeFrom : a.s;
      return await setStarts([[a.it, Math.max(a.s, base+(z.e-z.s))]]);
    }
    return false;
  }

  async function setStarts(pairs){
    for(const pair of pairs){
      const it=pair[0], mins=pair[1];
      if(!it) continue;
      const clamped=Math.max(0, Math.min(mins, 23*60+55));
      const {error}=await sb.from("schedule_items").update({start_time:m2t(clamped)}).eq("id",it.id);
      if(error){ flash("Couldn't move that: "+error.message); return false; }
    }
    return true;
  }

  async function saveOrder(){
    for(let i=0;i<sessRows.length;i++){
      const r=sessRows[i];
      if(r.sort===i) continue;
      const {error}=await sb.from("sessions").update({sort:i}).eq("id",r.id);
      if(error){ flash("Couldn't save order: "+error.message); keepScroll(()=>buildScreen(v)); return false; }
      r.sort=i;
    }
    return true;
  }

  /* Keep a fixed item as a one-tap quick add. Called from the add row and from
     the edit box, so anything you've already built can be kept without redoing it. */
  async function saveQuickAdd(item){
    const len=+item.duration_mins||30;
    const label=item.label || (KIND_STYLE[item.kind]||KIND_STYLE.other).label;
    const name=prompt("Name this quick add:", `${label} ${durLabel(len)}`);
    if(!name) return;
    const {error}=await sb.from("day_templates").insert({
      player_id:me.id, name, practice_start:null, sort:savedQA.length,
      items:[{kind:item.kind||"other", label, duration_mins:len, is_private:!!item.is_private}]
    });
    if(error){ flash(error.message); return; }
    flash(`Saved "${name}"`); keepScroll(()=>buildScreen(v));
  }

  function renderBuildList(){
    const box=document.getElementById("blist");
    // whatever you last set stays put; otherwise start at the end of the last fixed item
    let defTime=buildDraft.time;
    if(!defTime){
      defTime="13:00";
      if(anchors.length){
        const last=anchors.map(i=>t2m(i.start_time)+(i.duration_mins||0)).filter(x=>!isNaN(x)).sort((a,b)=>b-a)[0];
        if(last!=null){ const r=Math.ceil(last/5)*5; if(r<DAY_END_MIN) defTime=m2t(r); }
      }
    }

    // your saved one-tap items — they drop in at the time showing in the add row
    const qaChips = `
      <div style="margin-bottom:12px">
        <span class="who" id="qa-when" style="display:block; margin-bottom:6px">${savedQA.length?`Quick add · drops in at ${defTime}`:"Quick add"}</span>
        ${savedQA.length?`<div style="display:flex; gap:6px; flex-wrap:wrap">
          ${savedQA.map(q=>`<button class="btn btn-ghost btn-sm qas" data-id="${q.id}">${esc(q.name)}${qaEdit?` <span class="qadel" data-id="${q.id}" style="color:#e0574f; font-weight:800; padding-left:4px">×</span>`:""}</button>`).join("")}
          <button class="btn btn-ghost btn-sm" id="qaedit" style="opacity:.65">${qaEdit?"Done":"Edit"}</button>
        </div>`:`<p class="who" style="margin:0; text-transform:none; letter-spacing:0">Nothing saved yet. Set an item up below — or tap one you've already added — and use <b>★ Save</b>.</p>`}
      </div>`;

    // the day, in time order, each row editable inline
    const dayRows = anchors.length ? anchors.map(it=>{
      const st=KIND_STYLE[it.kind]||KIND_STYLE.other;
      const end = it.start_time ? m2t(t2m(it.start_time)+(it.duration_mins||0)) : "";
      return `<div class="row-item" data-edit="${it.id}" style="border-left:3px solid ${st.ac}; padding-left:10px; cursor:pointer">
        <span class="pill" style="background:${st.bg}; color:${st.ac}">${st.label}</span>
        <div class="name">${esc(it.label||st.label)}
          <small>${it.start_time||"—"}${end?" – "+end:""} · ${durLabel(it.duration_mins||0)}${it.kind==="coach"?" · over practice":""}${it.is_private?" · private":""}</small></div>
        <span class="who" style="font-size:11px; flex:0 0 auto">Edit</span>
        <button class="rowdel" data-id="${it.id}" title="Remove" style="font-size:20px; padding:0 8px">×</button>
      </div>`;
    }).join("") : `<div class="empty" style="border:0; padding:14px">No fixed items yet. Use a quick add above, or the + row below.</div>`;

    // the inline + add row
    const addRow = `
      <div style="display:flex; gap:6px; align-items:center; padding:10px; background:var(--panel-2);
           border:1px dashed var(--blood-2); border-radius:9px; margin-top:10px; flex-wrap:wrap">
        <span style="font-size:20px; color:var(--blood-2); font-weight:700; line-height:1">+</span>
        <select id="a-kind" style="flex:1; min-width:88px">${kindSelectOptions(buildDraft.kind)}</select>
        <select id="a-time" style="flex:1; min-width:78px">${timeOptions(defTime)}</select>
        <select id="a-mins" style="flex:1; min-width:70px">${minsOptions(buildDraft.mins)}</select>
        <input id="a-label" placeholder="Label" style="flex:2; min-width:110px">
        <label class="inline" style="font-size:12px; color:var(--muted); flex:0 0 auto"><input type="checkbox" id="a-priv" style="width:auto"> Private</label>
        <button class="btn btn-primary btn-sm" id="a-add" style="flex:0 0 auto">Add</button>
        <button class="btn btn-ghost btn-sm" id="a-qa" style="flex:0 0 auto" title="Save these settings as a quick add">★ Save</button>
        <p class="who" id="a-hint" style="margin:0; flex:1 0 100%"></p>
      </div>`;

    box.innerHTML = qaChips + dayRows + addRow;

    // hold on to the add-row settings so switching tabs or days doesn't reset them
    const remember=()=>{ buildDraft.time=val("a-time"); buildDraft.mins=+val("a-mins")||45; buildDraft.kind=val("a-kind"); };
    // a coach booking names itself, so the free-text label steps aside
    const syncKind=()=>{
      const kv=parseKindValue(val("a-kind")), lab=document.getElementById("a-label"), hint=document.getElementById("a-hint");
      if(!lab) return;
      lab.disabled = kv.kind==="coach";
      lab.value = kv.kind==="coach" ? kv.label : "";
      lab.style.opacity = kv.kind==="coach" ? ".55" : "1";
      if(hint) hint.textContent = kv.kind==="coach" ? "Sits on top of practice — nothing moves, the drills in this window just show the name." : "";
    };
    ["a-time","a-mins","a-kind"].forEach(id=>{ const el=document.getElementById(id); if(el) el.onchange=()=>{
      remember(); syncKind();
      const qw=document.getElementById("qa-when");
      if(qw && savedQA.length) qw.textContent="Quick add · drops in at "+val("a-time");
    }; });
    syncKind();

    document.getElementById("a-add").onclick=async()=>{
      remember();
      const kv=parseKindValue(val("a-kind")), kind=kv.kind;
      const st2=t2m(val("a-time")), len=+val("a-mins")||0;
      const clash = kind==="coach" ? null : hardAnchors.filter(i=>i.start_time)
        .find(i=>{ const s2=t2m(i.start_time), e2=s2+(i.duration_mins||0); return st2 < e2 && (st2+len) > s2; });
      if(clash && !confirm(`This overlaps "${clash.label||clash.kind}" at ${clash.start_time}. Add anyway?`)) return;
      const {error}=await sb.from("schedule_items").insert({
        player_id:me.id, day:schedDay, start_time:val("a-time"), duration_mins:len,
        kind, label:kv.label || val("a-label") || null,
        is_private:document.getElementById("a-priv").checked, is_anchor:kind!=="coach" });
      if(error){ flash(error.message); return; }
      flash("Added"); keepScroll(()=>buildScreen(v));
    };

    /* quick adds: drop one or more items in, back-to-back, from the add-row time */
    const addQuick=async(list)=>{
      let t=t2m(val("a-time"));
      if(t==null) t=13*60;
      const rows=list.map(q=>{
        const kind=q.kind||"other", len=+q.duration_mins||30;
        const row={player_id:me.id, day:schedDay, start_time:m2t(t), duration_mins:len,
          kind, label:q.label||null, is_private:!!q.is_private, is_anchor:kind!=="coach"};
        t+=len;
        return row;
      });
      const {error}=await sb.from("schedule_items").insert(rows);
      if(error){ flash(error.message); return; }
      flash("Added"); keepScroll(()=>buildScreen(v));
    };
    box.querySelectorAll(".qas").forEach(b=>b.onclick=async(e)=>{
      if(e.target.closest(".qadel")) return;
      const q=savedQA.find(x=>String(x.id)===b.dataset.id);
      if(q) addQuick(q.items);
    });
    box.querySelectorAll(".qadel").forEach(x=>x.onclick=async(e)=>{
      e.stopPropagation();
      if(!confirm("Delete this quick add?")) return;
      const {error}=await sb.from("day_templates").delete().eq("id",x.dataset.id);
      if(error){ flash(error.message); return; }
      flash("Deleted"); keepScroll(()=>buildScreen(v));
    });
    const qe=document.getElementById("qaedit");
    if(qe) qe.onclick=()=>{ qaEdit=!qaEdit; renderBuildList(); };

    document.getElementById("a-qa").onclick=()=>{
      remember();
      const kv=parseKindValue(val("a-kind"));
      saveQuickAdd({
        kind:kv.kind,
        label:kv.label || val("a-label") || KIND_STYLE[kv.kind].label,
        duration_mins:+val("a-mins")||30,
        is_private:document.getElementById("a-priv").checked
      });
    };

    box.querySelectorAll(".rowdel").forEach(b=>b.onclick=async(e)=>{
      e.stopPropagation();
      if(!confirm("Remove this from the day?")) return;
      const {error}=await sb.from("schedule_items").delete().eq("id",b.dataset.id);
      if(error){ flash(error.message); return; }
      flash("Removed"); keepScroll(()=>buildScreen(v));
    });

    // tap a row to change it in place, rather than delete and re-add
    box.querySelectorAll("[data-edit]").forEach(el=>el.onclick=(e)=>{
      if(e.target.closest(".rowdel")) return;
      const it=anchors.find(x=>String(x.id)===el.dataset.edit);
      if(it) editItem(it);
    });
  }

  /* Edit one fixed item in place. Same fields as the add row, pre-filled. */
  function editItem(it){
    const st=KIND_STYLE[it.kind]||KIND_STYLE.other;
    const wrap=document.createElement("div"); wrap.className="cmodal";
    wrap.innerHTML=`<div class="cbox">
      <div class="chead"><div><b>Edit item</b><div class="who">${esc(it.label||st.label)}</div></div>
        <button class="cx" id="eix">×</button></div>
      <div class="clist" style="padding:14px 16px">
        <div class="field"><label class="mini">Type</label>
          <select id="ei-kind">${kindSelectOptions(itemKindValue(it))}</select></div>
        <div class="grid2">
          <div><label class="mini">Start</label><select id="ei-time">${timeOptions(it.start_time||"09:00")}</select></div>
          <div><label class="mini">Length</label><select id="ei-mins">${minsOptions(it.duration_mins||45)}</select></div>
        </div>
        <div class="field" style="margin-top:12px"><label class="mini">Label</label>
          <input id="ei-label" placeholder="Label" value="${esc(it.label||"")}"></div>
        <label class="inline" style="font-size:12px; color:var(--muted); margin-top:4px">
          <input type="checkbox" id="ei-priv" ${it.is_private?"checked":""}> Private</label>
      </div>
      <div class="cfoot">
        <button class="btn btn-ghost btn-sm" id="ei-cancel">Cancel</button>
        <button class="btn btn-ghost btn-sm" id="ei-qa">★ Save as quick add</button>
        <button class="btn btn-primary btn-sm" id="ei-save" style="margin-left:auto">Save changes</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const close=()=>wrap.remove();
    wrap.onclick=e=>{ if(e.target===wrap) close(); };
    document.getElementById("eix").onclick=close;
    document.getElementById("ei-cancel").onclick=close;
    const eiSync=()=>{
      const kv=parseKindValue(val("ei-kind")), lab=document.getElementById("ei-label");
      lab.disabled = kv.kind==="coach";
      lab.style.opacity = kv.kind==="coach" ? ".55" : "1";
      if(kv.kind==="coach") lab.value=kv.label;
    };
    document.getElementById("ei-kind").onchange=eiSync;
    eiSync();
    document.getElementById("ei-qa").onclick=()=>{
      const kv=parseKindValue(val("ei-kind"));
      const preset={
        kind:kv.kind,
        label:kv.label || val("ei-label") || (KIND_STYLE[kv.kind]||KIND_STYLE.other).label,
        duration_mins:+val("ei-mins")||45,
        is_private:!!document.getElementById("ei-priv")?.checked
      };
      close();
      saveQuickAdd(preset);
    };
    document.getElementById("ei-save").onclick=async()=>{
      const kv=parseKindValue(val("ei-kind"));
      const st2=t2m(val("ei-time")), len=+val("ei-mins")||0;
      const clash = kv.kind==="coach" ? null : hardAnchors.filter(i=>String(i.id)!==String(it.id) && i.start_time)
        .find(i=>{ const s2=t2m(i.start_time), e2=s2+(i.duration_mins||0); return st2 < e2 && (st2+len) > s2; });
      if(clash && !confirm(`This overlaps "${clash.label||clash.kind}" at ${clash.start_time}. Save anyway?`)) return;
      const {error}=await sb.from("schedule_items").update({
        kind:kv.kind, start_time:val("ei-time"), duration_mins:len,
        label:kv.label || val("ei-label") || null,
        is_private:document.getElementById("ei-priv").checked, is_anchor:kv.kind!=="coach"
      }).eq("id", it.id);
      if(error){ flash(error.message); return; }
      flash("Updated"); close(); keepScroll(()=>buildScreen(v));
    };
  }
}

/* ============================================================
   10. SEASON — tournament schedule, mirrors the spreadsheet
   ============================================================ */

/* ---- season tiers: majors, signature events, regular, off ---- */
const MAJOR_RE = /^\s*(MASTERS|THE MASTERS|USPGA|US PGA|PGA CHAMPIONSHIP|US OPEN|THE OPEN|OPEN CHAMPIONSHIP)\s*$/i;
const SIGNATURE_RE = /Players Championship|Tour Championship|Ryder Cup|DP World Tour Championship|FedEx|BMW Championship|Memorial|Genesis|Arnold Palmer|Bay Hill|Travellers|Travelers/i;
const TIER_STYLE = {
  Major:     {ac:"#c3f53c", bg:"rgba(195,245,60,.13)", row:"rgba(195,245,60,.07)", badge:"MAJOR"},
  Signature: {ac:"#a9a4e8", bg:"rgba(169,164,232,.12)", row:"rgba(169,164,232,.06)", badge:"BIG"},
  Event:     {ac:"#7fc4dd", bg:"rgba(127,196,221,.10)", row:"rgba(127,196,221,.05)", badge:""},
  Off:       {ac:"#5b6672", bg:"transparent",           row:"transparent",           badge:""},
  Unknown:   {ac:"#7a6a2e", bg:"rgba(122,106,46,.08)",  row:"rgba(122,106,46,.05)",  badge:""}
};
function weekTier(w){
  if(w.status!=="Tournament") return w.status==="Off" ? "Off" : "Unknown";
  const t=(w.tournament||"").trim();
  if(MAJOR_RE.test(t)) return "Major";
  if(SIGNATURE_RE.test(t)) return "Signature";
  return "Event";
}

let seasonYear = new Date().getFullYear();
let seasonFilter = "all";

async function seasonScreen(v){
  const pid = me.role==="player" ? me.id : activePlayerId;
  if(!pid){ v.innerHTML=`<div class="empty">No player linked.</div>`; return; }
  const canEdit = me.role==="player";

  const {data:years}=await sb.from("season_weeks").select("year").eq("player_id",pid);
  const yrList=[...new Set((years||[]).map(y=>y.year))].sort();
  if(yrList.length && !yrList.includes(seasonYear)) seasonYear=yrList[yrList.length-1];

  const {data:weeks}=await sb.from("season_weeks").select("*")
    .eq("player_id",pid).eq("year",seasonYear).order("week");

  const tally={Major:0,Signature:0,Event:0,Off:0,Unknown:0};
  (weeks||[]).forEach(w=>{ tally[weekTier(w)]++; });
  const ev=tally.Major+tally.Signature+tally.Event;
  const off=tally.Off, unk=tally.Unknown;
  const stPill={Tournament:"p-Performance",Off:"p-Technical",Unknown:"p-Driving"};
  const fmt=d=>{ if(!d)return "—"; const x=new Date(d+"T00:00:00"); return x.toLocaleDateString(undefined,{day:'numeric',month:'short'}); };

  v.innerHTML=`
    <div class="daybar">
      <div class="dsel"><span class="who">Year</span>
        <select id="yrsel" style="background:transparent;border:0;color:var(--ink);font-weight:700">
          ${yrList.map(y=>`<option ${y===seasonYear?'selected':''}>${y}</option>`).join("")}
        </select></div>
      ${canEdit?`<button class="btn btn-ghost btn-sm" id="addyear">+ Add year</button>`:""}
      <button class="btn btn-ghost btn-sm" id="seasonexport">Add year to calendar</button>
      <span class="who" style="margin-left:auto; display:flex; gap:11px; align-items:center; flex-wrap:wrap">
        ${["Major","Signature","Event","Off","Unknown"].map(k=>`<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${TIER_STYLE[k].ac};margin-right:5px"></i>${tally[k]} ${k==="Signature"?"big":k.toLowerCase()}</span>`).join("")}
        <span style="color:var(--ink)"><b>${ev}</b> events total</span>
      </span>
    </div>
    <div id="seasonfilter" style="display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm sfil on" data-f="all">All</button>
      <button class="btn btn-ghost btn-sm sfil" data-f="Tournament">Events</button>
      <button class="btn btn-ghost btn-sm sfil" data-f="Major">Majors</button>
      <button class="btn btn-ghost btn-sm sfil" data-f="Signature">Big weeks</button>
      <button class="btn btn-ghost btn-sm sfil" data-f="Off">Off</button>
    </div>
    <div id="scards"></div>
    ${canEdit?`<div class="gridtools">
      <button class="btn btn-ghost btn-sm" id="addweek">+ Add week</button>
      <div class="savebar" style="margin-left:auto">
        <span class="savestate" id="sstate"></span>
        <button class="btn btn-primary btn-sm" id="ssave">Save season</button>
      </div></div>`:""}`;

  document.getElementById("yrsel").onchange=e=>{ seasonYear=+e.target.value; seasonScreen(v); };
  document.getElementById("seasonexport").onclick=()=>{
    const evs=(weeks||[]).filter(w=>w.status==="Tournament"&&w.start_date).map(w=>({
      allDay:true, start:w.start_date, end:w.end_date||w.start_date,
      title:w.tournament||"Tournament",
      desc:[w.course,w.city,w.country].filter(Boolean).join(", ")
    }));
    if(!evs.length){ flash("No tournaments to export"); return; }
    downloadICS("season-"+seasonYear+".ics", evs);
    flash("Calendar file downloaded");
  };

  let rows=(weeks||[]).map(w=>({...w,_dirty:false}));
  function passFilter(w){
    if(seasonFilter==="all") return true;
    if(seasonFilter==="Tournament") return w.status==="Tournament";
    if(seasonFilter==="Major"||seasonFilter==="Signature") return weekTier(w)===seasonFilter;
    return w.status===seasonFilter;
  }
  function drawSeason(){
    drawCards();
  }

  /* ---- compact season list, grouped by month ---- */

  function drawCards(){
    const box=document.getElementById("scards"); if(!box) return;
    const list=rows.map((w,i)=>({w,i})).filter(({w})=>passFilter(w));
    if(!list.length){ box.innerHTML=`<div class="empty">Nothing to show.</div>`; return; }

    const MONTHS=["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];
    // group by the month the week starts in
    const groups={};
    list.forEach(({w,i})=>{
      const key = w.start_date ? w.start_date.slice(0,7) : "unknown";
      (groups[key]=groups[key]||[]).push({w,i});
    });
    const keys=Object.keys(groups).sort();

    box.innerHTML=keys.map(key=>{
      const items=groups[key];
      const label = key==="unknown" ? "Undated"
        : MONTHS[+key.slice(5,7)-1] + " " + key.slice(0,4);
      const evCount=items.filter(({w})=>w.status==="Tournament").length;

      return `<div style="margin-bottom:16px">
        <div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px;
                    padding:6px 2px; border-bottom:1px solid var(--line); margin-bottom:6px">
          <span style="font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.06em">${label}</span>
          <span style="font-size:11px; color:var(--muted)">${evCount} event${evCount===1?"":"s"}</span>
        </div>
        ${items.map(({w,i})=>{
          const tier=weekTier(w), ts=TIER_STYLE[tier];
          const place=[w.city,w.country].filter(Boolean).join(", ");
          const isOff = tier==="Off" || tier==="Unknown";
          return `<div class="seasonrow" data-i="${i}" style="
              display:flex; align-items:center; gap:10px;
              padding:8px 10px; margin-bottom:4px;
              background:${isOff?"transparent":ts.row};
              border-left:3px solid ${ts.ac}; border-radius:0 7px 7px 0;
              ${canEdit?"cursor:pointer":""}">
            <span style="font-size:10px; color:var(--faint); min-width:26px; font-weight:700">W${w.week}</span>
            <span style="font-size:10px; color:var(--muted); min-width:60px; white-space:nowrap">${fmt(w.start_date)}</span>
            <div style="flex:1; min-width:0">
              <div style="font-size:13px; font-weight:${isOff?"400":"700"};
                          color:${isOff?"var(--faint)":ts.ac};
                          overflow:hidden; text-overflow:ellipsis; white-space:nowrap">
                ${w.tournament?esc(w.tournament):esc(w.status)}${ts.badge?` <span style="font-size:9px">· ${ts.badge}</span>`:""}
              </div>
              ${(w.course||place)?`<div style="font-size:10px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc([w.course,place].filter(Boolean).join(" · "))}</div>`:""}
            </div>
          </div>`;
        }).join("")}
      </div>`;
    }).join("");

    if(canEdit){
      box.querySelectorAll(".seasonrow").forEach(el=>el.onclick=()=>editWeek(+el.dataset.i));
    }
  }

  /* ---- mobile: edit one week in a sheet ---- */
  function editWeek(i){
    const w=rows[i];
    const wrap=document.createElement("div"); wrap.className="cmodal";
    wrap.innerHTML=`<div class="cbox">
      <div class="chead"><div><b>Week ${w.week}</b><div class="who">${fmt(w.start_date)} – ${fmt(w.end_date)}</div></div>
        <button class="cx" id="ewx">×</button></div>
      <div class="clist" style="padding:14px 16px">
        <div class="field"><label class="mini">Status</label>
          <select id="ew-status">${["Tournament","Off","Unknown"].map(o=>`<option ${o===w.status?"selected":""}>${o}</option>`).join("")}</select></div>
        <div class="field"><label class="mini">Tournament</label><input id="ew-tournament" value="${esc(w.tournament||"")}"></div>
        <div class="field"><label class="mini">Course</label><input id="ew-course" value="${esc(w.course||"")}"></div>
        <div class="grid2">
          <div><label class="mini">City</label><input id="ew-city" value="${esc(w.city||"")}"></div>
          <div><label class="mini">Country</label><input id="ew-country" value="${esc(w.country||"")}"></div>
        </div>
      </div>
      <div class="cfoot"><button class="btn btn-ghost btn-sm" id="ewdel">Delete week</button>
        <button class="btn btn-primary btn-sm" id="ewok" style="margin-left:auto">Done</button></div>
    </div>`;
    document.body.appendChild(wrap);
    const close=()=>wrap.remove();
    wrap.onclick=e=>{ if(e.target===wrap) close(); };
    document.getElementById("ewx").onclick=close;
    document.getElementById("ewok").onclick=()=>{
      ["status","tournament","course","city","country"].forEach(f=>{
        rows[i][f]=document.getElementById("ew-"+f).value;
      });
      rows[i]._dirty=true;
      const st=document.getElementById("sstate"); if(st) st.textContent="Unsaved changes";
      close(); drawSeason();
    };
    document.getElementById("ewdel").onclick=async()=>{
      if(!confirm("Remove week "+w.week+"?")) return;
      if(w.id) await sb.from("season_weeks").delete().eq("id",w.id);
      rows.splice(i,1); close(); drawSeason();
    };
  }

  document.querySelectorAll(".sfil").forEach(b=>b.onclick=()=>{
    seasonFilter=b.dataset.f;
    document.querySelectorAll(".sfil").forEach(x=>x.classList.toggle("on",x===b));
    keepScroll(()=>drawSeason());
  });

  drawSeason();

  if(canEdit){
    document.getElementById("addweek").onclick=()=>{
      const nw=rows.length?Math.max(...rows.map(r=>r.week))+1:1;
      rows.push({id:null,player_id:me.id,year:seasonYear,week:nw,start_date:null,end_date:null,
        country:"",city:"",tournament:"",course:"",status:"Unknown",_dirty:true});
      drawSeason();
    };
    document.getElementById("addyear").onclick=async()=>{
      const y=prompt("Add which year?", String(seasonYear+1));
      if(!y||isNaN(+y)) return;
      const {error}=await sb.from("season_weeks").insert({player_id:me.id,year:+y,week:1,status:"Unknown"});
      if(error){ flash(error.message); return; }
      seasonYear=+y; flash("Year added"); seasonScreen(v);
    };
    document.getElementById("ssave").onclick=async()=>{
      const st=document.getElementById("sstate"); st.textContent="Saving…";
      let ok=true;
      for(const r of rows){
        if(!r._dirty) continue;
        const payload={player_id:me.id,year:seasonYear,week:r.week,start_date:r.start_date,end_date:r.end_date,
          country:r.country||null,city:r.city||null,tournament:r.tournament||null,course:r.course||null,status:r.status||"Unknown"};
        const res=r.id ? await sb.from("season_weeks").update(payload).eq("id",r.id)
                       : await sb.from("season_weeks").insert(payload).select("id").single();
        if(res.error){ ok=false; flash(res.error.message); break; }
        if(res.data?.id) r.id=res.data.id;
        r._dirty=false;
      }
      st.textContent=ok?"Saved":"Save failed"; if(ok)flash("Season saved");
    };
  }
}

/* ============================================================
   11. TEAM — you grant viewer access
   ============================================================ */
async function teamScreen(v){
  v.innerHTML=`<div class="load">Loading</div>`;

  const [{data:linked}, pend] = await Promise.all([
    sb.from("player_viewers")
      .select("id, viewer_id, profiles!player_viewers_viewer_id_fkey(full_name, role)")
      .eq("player_id",me.id),
    sb.rpc("pending_team_members")
  ]);
  const pending = pend?.data || [];

  v.innerHTML=`
    ${pending.length?`
    <div class="card" style="border-color:var(--blood-2)">
      <div class="inline" style="margin-bottom:10px">
        <span class="pill" style="background:var(--blood-2); color:var(--lime-ink)">${pending.length}</span>
        <h3 style="font-size:15px; text-transform:uppercase; letter-spacing:.02em; margin:0">
          Waiting to be added</h3>
      </div>
      <p style="font-size:12px; color:var(--muted); margin:0 0 12px">
        These people have signed up but don't have access to your data yet.</p>
      ${pending.map(p=>`
        <div class="row-item">
          <span class="pill p-Technical">${esc(p.role)}</span>
          <div class="name">${esc(p.full_name||"—")}
            <small>${esc(p.email||"")}</small></div>
          <button class="btn btn-primary btn-sm padd" data-id="${p.id}">Give access</button>
        </div>`).join("")}
    </div>`:""}

    <div class="card" style="${pending.length?"margin-top:14px":""}">
      <h3 style="font-size:15px; text-transform:uppercase; letter-spacing:.02em; margin-bottom:10px">Add by email</h3>
      <p style="font-size:12px; color:var(--muted); margin:0 0 12px">
        If someone isn't listed above, add them directly. Viewers can see your sheet,
        week, schedule and season, and comment on drills — but can't change anything.</p>
      <div class="inline"><input id="vemail" placeholder="coach@email.com" style="flex:1">
        <button class="btn btn-primary btn-sm" id="vadd">Give access</button></div>
    </div>

    <div class="sec-h"><h2>Your team</h2><span class="meta">${(linked||[]).length} linked</span></div>
    <div class="card" id="vlist"></div>`;

  // one-tap add from the pending list
  v.querySelectorAll(".padd").forEach(b2=>b2.onclick=async()=>{
    const {error}=await sb.from("player_viewers").insert({player_id:me.id, viewer_id:b2.dataset.id});
    if(error){ flash(error.message.includes("duplicate")?"Already has access":error.message); return; }
    flash("Access granted"); keepScroll(()=>teamScreen(v));
  });

  document.getElementById("vadd").onclick=async()=>{
    const email=val("vemail").toLowerCase();
    if(!email){ flash("Enter an email"); return; }
    const {data:found}=await sb.rpc("find_profile_by_email",{e:email});
    if(!found){ flash("No account with that email yet"); return; }
    const {error}=await sb.from("player_viewers").insert({player_id:me.id,viewer_id:found});
    if(error){ flash(error.message.includes("duplicate")?"Already has access":error.message); return; }
    flash("Access granted"); document.getElementById("vemail").value=""; keepScroll(()=>teamScreen(v));
  };

  const box=document.getElementById("vlist");
  if(!(linked||[]).length){ box.innerHTML=`<div class="empty" style="border:0">Nobody has access yet.</div>`; }
  else{
    box.innerHTML=linked.map(x=>`
      <div class="row-item">
        <span class="pill p-Technical">${esc(x.profiles?.role||"viewer")}</span>
        <div class="name">${esc(x.profiles?.full_name||"—")}</div>
        <button class="rowdel" data-id="${x.id}" title="Remove access">×</button>
      </div>`).join("");
    box.querySelectorAll(".rowdel").forEach(b2=>b2.onclick=async()=>{
      if(!confirm("Remove their access?")) return;
      await sb.from("player_viewers").delete().eq("id",b2.dataset.id);
      flash("Access removed"); keepScroll(()=>teamScreen(v));
    });
  }
}

async function dgCall(payload){
  const { data:{ session } } = await sb.auth.getSession();
  const r = await fetch(`${SUPABASE_URL}/functions/v1/datagolf`, {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":`Bearer ${session?.access_token || SUPABASE_ANON_KEY}`,
      "apikey": SUPABASE_ANON_KEY
    },
    body: JSON.stringify(payload)
  });
  const txt = await r.text();
  let js; try{ js = JSON.parse(txt); }catch{ throw new Error("Unexpected reply: "+txt.slice(0,120)); }
  if(!r.ok || js?.error) throw new Error(js?.error || `Request failed (${r.status})`);
  return js;
}

function sgFmt(v){ return v==null?"—":((v>0?"+":"")+Number(v).toFixed(2)); }

function sgOpacity(v){ return Math.min(Math.abs(+v||0)/1.2,1)*0.75+0.15; }
function evLabel(r){ return (r.event_name||"").replace(/Championship|Invitational|Tournament/gi,"").trim().slice(0,14); }

async function resultsScreen(v){
  const pid = me.role==="player" ? me.id : activePlayerId;
  if(!pid){ v.innerHTML=`<div class="empty">No player linked.</div>`; return; }
  const isOwner = me.role==="player";

  let settings=null;
  if(isOwner){
    const {data}=await sb.from("app_settings").select("*").eq("player_id",me.id).maybeSingle();
    settings=data;
  }
  const {data:results}=await sb.from("dg_results").select("*")
    .eq("player_id",pid).order("start_date",{ascending:false});

  v.innerHTML=`
    <div class="daybar rvbar">
      ${[["list","Tournaments"],["heat","Heatmap"],["trend","Trend"],["form","Form"],
         ["lag","Practice lag"],["tier","Compare"],["corr","Practice vs performance"]]
        .map(t=>`<button class="btn btn-ghost btn-sm rv ${resultsView===t[0]?"on":""}" data-v="${t[0]}">${t[1]}</button>`).join("")}
      ${isOwner?`<button class="btn btn-ghost btn-sm" id="dgsetup" style="margin-left:auto">Data Golf ⚙</button>`:""}
      ${isOwner&&settings?.dg_id?`<button class="btn btn-primary btn-sm" id="dgrefresh">Refresh</button>`:""}
    </div>
    <div id="resbody"></div>`;

  const rvb=v.querySelector(".rvbar");
  if(rvb && _rvScrollX) rvb.scrollLeft=_rvScrollX;
  v.querySelectorAll(".rv").forEach(b=>b.onclick=()=>{
    const bar=v.querySelector(".rvbar");
    _rvScrollX = bar?bar.scrollLeft:0;
    resultsView=b.dataset.v;
    keepScroll(()=>resultsScreen(v));
  });
  if(isOwner){
    document.getElementById("dgsetup").onclick=()=>dgSetup(settings,v);
    const rf=document.getElementById("dgrefresh");
    if(rf) rf.onclick=()=>dgImport(settings,v);
  }

  const body=document.getElementById("resbody");
  if(!results?.length){
    body.innerHTML=`<div class="empty">${isOwner?"No results yet. Open Data Golf ⚙, test the connection, then hit Refresh.":"No results imported yet."}</div>`;
    return;
  }
  if(resultsView==="list") renderResultsList(body,results,pid);
  else if(resultsView==="heat") renderHeatmap(body,results);
  else if(resultsView==="trend") renderTrend(body,results);
  else if(resultsView==="form") renderForm(body,results);
  else if(resultsView==="lag") renderLag(body,results,pid);
  else if(resultsView==="tier") renderTier(body,results);
  else renderCorrelation(body,results,pid);
}

async function dgImport(settings,v){
  if(!settings?.dg_id){ flash("Set your Data Golf ID first"); return; }
  const body=document.getElementById("resbody");
  const thisYear=new Date().getFullYear();
  const years=[]; for(let y=thisYear; y>=2019; y--) years.push(y);
  const tours=["pga","euro"];
  const MYID=+settings.dg_id;
  let imported=0, problems=[];
  const prog=(m)=>{ body.innerHTML=`<div class="load">${m}</div>`; };
  const num=x=>(x==null||x===""||isNaN(+x))?null:+x;

  function harvest(json){
    const out=[];
    const walk=(node, ctx)=>{
      if(!node || typeof node!=="object") return;
      if(Array.isArray(node)){ node.forEach(n=>walk(n,ctx)); return; }
      const c={...ctx};
      if(node.event_name) c.event_name=node.event_name;
      if(node.event_id!=null) c.event_id=node.event_id;
      if(node.event_completed) c.event_completed=node.event_completed;
      if(node.course_name) c.course=node.course_name;
      if(node.calendar_year!=null) c.year=node.calendar_year;
      if(node.season!=null && c.year==null) c.year=node.season;
      if(node.dg_id!=null && +node.dg_id===MYID){
        const fin = node.fin_text ?? node.finish ?? null;
        const rounds=[];
        for(const k of Object.keys(node)){
          if(/^round_?\d$/i.test(k) && node[k] && typeof node[k]==="object"){
            rounds.push({n:+k.replace(/\D/g,""), ...node[k]});
          }
        }
        if(!rounds.length && (node.sg_total!=null || node.score!=null)){
          rounds.push({n:node.round_num??node.round??1, ...node});
        }
        if(rounds.length) out.push({...c, fin, rounds});
      }
      Object.values(node).forEach(vv=>{ if(vv && typeof vv==="object") walk(vv,c); });
    };
    walk(json,{});
    return out;
  }

  for(const yr of years){
    for(const tour of tours){
      prog(`Fetching ${tour.toUpperCase()} ${yr}…  (${imported} imported so far)`);
      try{
        const json=await dgCall({action:"rounds", tour, year:yr});
        const mine=harvest(json);
        for(const ev of mine){
          if(ev.event_id==null) continue;
          const rs=ev.rounds;
          const avg=f=>{ const xs=rs.map(x=>num(x[f])).filter(x=>x!=null); return xs.length? xs.reduce((a,b)=>a+b,0)/xs.length : null; };
          const payload={
            player_id:me.id, event_id:+ev.event_id, event_name:ev.event_name||"Event",
            course:ev.course||null, tour, year:+(ev.year||yr),
            start_date: ev.event_completed || null,
            finish: ev.fin!=null?String(ev.fin):null, rounds:rs.length,
            sg_ott:avg("sg_ott"), sg_app:avg("sg_app"), sg_arg:avg("sg_arg"),
            sg_putt:avg("sg_putt"), sg_t2g:avg("sg_t2g"), sg_total:avg("sg_total"),
            driving_dist:avg("driving_dist"), driving_acc:avg("driving_acc"),
            gir:avg("gir"), scrambling:avg("scrambling")
          };
          const {error}=await sb.from("dg_results").upsert(payload,{onConflict:"player_id,event_id,year"});
          if(error){ problems.push(error.message); continue; }
          imported++;
          for(const rd of rs){
            await sb.from("dg_rounds").upsert({
              player_id:me.id, event_id:+ev.event_id, year:+(ev.year||yr), round_num:rd.n||1,
              score:num(rd.score), sg_ott:num(rd.sg_ott), sg_app:num(rd.sg_app),
              sg_arg:num(rd.sg_arg), sg_putt:num(rd.sg_putt), sg_total:num(rd.sg_total)
            },{onConflict:"player_id,event_id,year,round_num"});
          }
        }
      }catch(e){ problems.push(`${tour} ${yr}: ${e.message}`); }
      await new Promise(x=>setTimeout(x,1400));
    }
  }
  await sb.from("app_settings").update({last_import:new Date().toISOString()}).eq("player_id",me.id);
  if(!imported){
    body.innerHTML=`<div class="empty">Nothing imported.${problems.length?`<div style="margin-top:8px; font-size:12px; color:var(--muted)">${esc(problems.slice(0,3).join(" · "))}</div>`:""}</div>`;
    return;
  }
  flash(`Imported ${imported} events`);
  resultsScreen(v);
}

function renderTrend(box,results){
  const CATS=[...SGCATS,["sg_total","Total"]];
  const rows=results.slice(0,20).filter(r=>r[trendCat]!=null).reverse();
  if(!rows.length){ box.innerHTML=`<div class="empty">Not enough data yet.</div>`; return; }
  const vals=rows.map(r=>+r[trendCat]);
  const hi=Math.max(0.2,...vals), lo=Math.min(-0.2,...vals);
  const span=hi-lo;
  const H=200;
  const zeroPct=(hi/span)*100;
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const half=Math.ceil(vals.length/2);
  const firstHalf=vals.slice(0,half).reduce((a,b)=>a+b,0)/half;
  const rest=vals.slice(half);
  const secondHalf=rest.length? rest.reduce((a,b)=>a+b,0)/rest.length : firstHalf;
  const dir=secondHalf-firstHalf;

  box.innerHTML=`
    <div class="daybar rvbar" style="margin-bottom:10px">
      ${CATS.map(c=>`<button class="btn btn-ghost btn-sm tcat ${c[0]===trendCat?"on":""}" data-c="${c[0]}">${c[1]}</button>`).join("")}
    </div>
    <div class="stat-row">
      ${stat(sgFmt(avg),"Average")}
      ${stat(sgFmt(Math.max(...vals)),"Best")}
      ${stat(sgFmt(Math.min(...vals)),"Worst")}
      ${stat((dir>0.05?"↑ up":dir<-0.05?"↓ down":"→ flat"),"Direction")}
    </div>
    <div class="card">
      <div style="position:relative; height:${H}px; margin-left:38px">
        <div style="position:absolute; left:0; right:0; top:${zeroPct.toFixed(1)}%; border-top:1px solid var(--faint)"></div>
        <span style="position:absolute; left:-36px; top:${zeroPct.toFixed(1)}%; transform:translateY(-50%); font-size:10px; color:var(--faint)">0.00</span>
        <span style="position:absolute; left:-36px; top:0; font-size:10px; color:var(--faint)">${sgFmt(hi)}</span>
        <span style="position:absolute; left:-36px; bottom:0; font-size:10px; color:var(--faint)">${sgFmt(lo)}</span>
        <div style="position:absolute; inset:0; display:flex; gap:4px; align-items:stretch">
          ${rows.map(r=>{
            const v=+r[trendCat];
            const pct=(Math.abs(v)/span)*100;
            const up=v>=0;
            return `<div title="${esc(r.event_name||"")} · ${sgFmt(v)}" style="flex:1; position:relative">
              <div style="position:absolute; left:0; right:0;
                   ${up?`bottom:${(100-zeroPct).toFixed(1)}%;`:`top:${zeroPct.toFixed(1)}%;`}
                   height:${Math.max(pct,1.5).toFixed(1)}%;
                   background:${sgColor(v)}; opacity:.9;
                   border-radius:${up?"3px 3px 0 0":"0 0 3px 3px"}"></div>
              <div style="position:absolute; left:0; right:0;
                   ${up?`bottom:calc(${(100-zeroPct).toFixed(1)}% + ${Math.max(pct,1.5).toFixed(1)}%);`
                       :`top:calc(${zeroPct.toFixed(1)}% + ${Math.max(pct,1.5).toFixed(1)}%);`}
                   font-size:9px; font-weight:700; color:${sgColor(v)}; text-align:center; white-space:nowrap">
                ${sgFmt(v)}</div>
            </div>`;
          }).join("")}
        </div>
      </div>
      <div style="display:flex; gap:4px; margin:8px 0 0 38px">
        ${rows.map(r=>`<div style="flex:1; font-size:8px; color:var(--faint); text-align:center; overflow:hidden; white-space:nowrap">${esc(evLabel(r).slice(0,7))}</div>`).join("")}
      </div>
    </div>`;
  box.querySelectorAll(".tcat").forEach(b=>b.onclick=()=>{ trendCat=b.dataset.c; keepScroll(()=>renderTrend(box,results)); });
}

async function renderLag(box,results,pid){
  box.innerHTML=`<div class="load">Working out the lag</div>`;
  const evs=results.filter(r=>r.start_date && r[lagCat]!=null).slice(0,24);
  if(evs.length<3){ box.innerHTML=`<div class="empty">Need a few more events for this.</div>`; return; }

  const earliest=evs[evs.length-1].start_date;
  const {data:sess}=await sb.from("sessions").select("balls, logged_on, drills(category)")
    .eq("player_id",pid).gte("logged_on", new Date(new Date(earliest).getTime()-lagWeeks*7*864e5).toISOString().slice(0,10));

  const wantCat=PRACTICE_FOR[lagCat];
  const catLabel=SGCATS.find(c=>c[0]===lagCat)[1];
  const pts=evs.map(r=>{
    const end=new Date(r.start_date).getTime();
    const start=end - lagWeeks*7*864e5;
    const balls=(sess||[]).filter(x=>{
      if(x.drills?.category!==wantCat) return false;
      const t=new Date(x.logged_on).getTime();
      return t>=start && t<end;
    }).reduce((a,x)=>a+(x.balls||0),0);
    return {name:evLabel(r), balls, sg:+r[lagCat]};
  });

  const maxB=Math.max(1,...pts.map(p=>p.balls));
  const sgs=pts.map(p=>p.sg);
  const loSG=Math.min(...sgs), hiSG=Math.max(...sgs), rng=(hiSG-loSG)||1;

  const n=pts.length;
  const mx=pts.reduce((a,p)=>a+p.balls,0)/n, my=sgs.reduce((a,b)=>a+b,0)/n;
  let num2=0, dxx=0, dyy=0;
  pts.forEach(p=>{ num2+=(p.balls-mx)*(p.sg-my); dxx+=(p.balls-mx)**2; dyy+=(p.sg-my)**2; });
  const m = dxx? num2/dxx : 0;
  const c = my - m*mx;
  const rcoef = (dxx&&dyy)? num2/Math.sqrt(dxx*dyy) : 0;
  const strength = Math.abs(rcoef)<0.2?"no clear relationship":Math.abs(rcoef)<0.45?"a weak relationship":"a moderate relationship";
  const direction = rcoef>0.05?"more practice went with better performance":rcoef<-0.05?"more practice went with worse performance":"volume and performance moved independently";

  const X=(v)=>(v/maxB)*92+2;
  const Y=(v)=>((v-loSG)/rng)*86+5;
  const y0=c, y1=m*maxB+c;
  const fitVisible = dxx>0;

  box.innerHTML=`
    <div class="daybar rvbar" style="margin-bottom:8px">
      ${SGCATS.map(x=>`<button class="btn btn-ghost btn-sm lcat ${x[0]===lagCat?"on":""}" data-c="${x[0]}">${x[1]}</button>`).join("")}
    </div>
    <div class="daybar" style="margin-bottom:10px">
      <span class="who">Window before event</span>
      ${[2,4,8].map(w=>`<button class="btn btn-ghost btn-sm lwk ${w===lagWeeks?"on":""}" data-w="${w}">${w} weeks</button>`).join("")}
    </div>
    <p style="font-size:12px; color:var(--muted); margin:0 0 10px">
      ${wantCat} balls hit in the ${lagWeeks} weeks before each event, against ${catLabel} in that event.</p>
    <div class="card">
      <div style="position:relative; height:250px; border-left:1px solid var(--line); border-bottom:1px solid var(--line); margin-left:38px">
        ${fitVisible?`
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute; inset:0; width:100%; height:100%">
            <line x1="${X(0).toFixed(1)}" y1="${(100-Y(y0)).toFixed(1)}"
                  x2="${X(maxB).toFixed(1)}" y2="${(100-Y(y1)).toFixed(1)}"
                  stroke="var(--blood-2)" stroke-width="0.6" stroke-dasharray="2 1.5" vector-effect="non-scaling-stroke"/>
          </svg>`:""}
        ${pts.map(p=>`
          <div title="${esc(p.name)} · ${p.balls} balls · ${sgFmt(p.sg)}"
            style="position:absolute; left:${X(p.balls).toFixed(1)}%; bottom:${Y(p.sg).toFixed(1)}%;
                   width:13px; height:13px; border-radius:50%; background:${sgColor(p.sg)};
                   transform:translate(-50%,50%); opacity:.92"></div>`).join("")}
        <span style="position:absolute; left:-36px; top:-6px; font-size:10px; color:var(--faint)">${sgFmt(hiSG)}</span>
        <span style="position:absolute; left:-36px; bottom:-6px; font-size:10px; color:var(--faint)">${sgFmt(loSG)}</span>
      </div>
      <div style="display:flex; justify-content:space-between; margin:6px 0 0 38px; font-size:10px; color:var(--faint)">
        <span>0 balls</span><span>practice volume →</span><span>${maxB}</span>
      </div>
      ${fitVisible?`<div style="margin:8px 0 0 38px; font-size:11px; color:var(--blood-2)">
        — — line of best fit · slope ${(m*100).toFixed(2)} SG per 100 balls</div>`:""}
    </div>
    <div class="card" style="margin-top:12px">
      <div class="mini">What it shows</div>
      <div style="font-size:13px; color:var(--muted); line-height:1.6">
        Across ${n} events there is <b style="color:var(--ink)">${strength}</b> (r = ${rcoef.toFixed(2)}) — ${direction}.
        <br><span style="color:var(--faint); font-size:12px">With this few events, treat it as a talking point rather than proof — golf is noisy, and one bad week moves this a long way.</span>
      </div>
    </div>`;
  box.querySelectorAll(".lcat").forEach(b2=>b2.onclick=()=>{ lagCat=b2.dataset.c; keepScroll(()=>renderLag(box,results,pid)); });
  box.querySelectorAll(".lwk").forEach(b2=>b2.onclick=()=>{ lagWeeks=+b2.dataset.w; keepScroll(()=>renderLag(box,results,pid)); });
}

let cmpA=new Set(), cmpB=new Set(), cmpInit=false, cmpTarget="A", cmpSearch="";

function renderTier(box,results){
  if(!results.length){ box.innerHTML=`<div class="empty">No results yet.</div>`; return; }
  if(!cmpInit){
    results.forEach(r=>{ if(MAJOR_RE.test((r.event_name||"").trim())) cmpA.add(r.id); else cmpB.add(r.id); });
    cmpInit=true;
  }
  const inA=results.filter(r=>cmpA.has(r.id));
  const inB=results.filter(r=>cmpB.has(r.id));
  const avg=(arr,f)=>{ const xs=arr.map(r=>r[f]).filter(x=>x!=null).map(Number); return xs.length? xs.reduce((x,y)=>x+y,0)/xs.length : null; };
  const q=cmpSearch.trim().toLowerCase();
  const shown=results.filter(r=>!q || (r.event_name||"").toLowerCase().includes(q) || String(r.year||"").includes(q));

  box.innerHTML=`
    ${(inA.length&&inB.length)?`
    <div class="gridwrap" style="padding:2px; margin-bottom:8px">
      <table class="grid" style="min-width:420px">
        <thead><tr><th class="l">Category</th>
          <th style="color:var(--blood-2)">A (${inA.length})</th>
          <th style="color:#7fc4dd">B (${inB.length})</th><th>Gap</th></tr></thead>
        <tbody>
        ${[...SGCATS,["sg_total","Total"]].map(c=>{
          const m=avg(inA,c[0]), o=avg(inB,c[0]);
          const gap=(m!=null&&o!=null)?m-o:null;
          return `<tr>
            <td style="font-size:13px">${c[1]}</td>
            <td style="text-align:center; font-weight:800; color:${sgColor(m)}">${sgFmt(m)}</td>
            <td style="text-align:center; font-weight:800; color:${sgColor(o)}">${sgFmt(o)}</td>
            <td style="text-align:center; font-weight:700; color:${gap==null?"var(--muted)":gap>=0?"var(--blood-2)":"#e0864f"}">${gap==null?"—":(gap>0?"+":"")+gap.toFixed(2)}</td>
          </tr>`;
        }).join("")}
        </tbody>
      </table>
    </div>
    ${(inA.length<4||inB.length<4)?`<p style="font-size:12px; color:var(--faint); margin:0 0 12px">
      Small groups swing heavily on one week — read this loosely.</p>`:`<div style="height:8px"></div>`}
    `:`<div class="empty" style="margin-bottom:12px">Tick events into A and B below to compare.</div>`}

    <div class="card">
      <div class="inline" style="margin-bottom:10px; flex-wrap:wrap; gap:7px">
        <input id="cmp-q" value="${esc(cmpSearch)}" placeholder="Search events…" style="flex:1; min-width:140px">
        <button class="btn btn-ghost btn-sm cmpmode ${cmpTarget==="A"?"on":""}" data-t="A">Tick into A</button>
        <button class="btn btn-ghost btn-sm cmpmode ${cmpTarget==="B"?"on":""}" data-t="B">Tick into B</button>
      </div>
      <div class="inline" style="margin-bottom:8px; flex-wrap:wrap; gap:7px">
        <button class="btn btn-ghost btn-sm" id="cmp-majors">Majors vs rest</button>
        <button class="btn btn-ghost btn-sm" id="cmp-all">${q?"All shown":"Select all"} → ${cmpTarget}</button>
        <button class="btn btn-ghost btn-sm" id="cmp-clear">Clear</button>
      </div>
      <div style="max-height:360px; overflow-y:auto; border-top:1px solid var(--line)">
        ${shown.length? shown.map(r=>{
          const isA=cmpA.has(r.id), isB=cmpB.has(r.id);
          const tag = isA?`<span class="pill" style="background:var(--blood-2); color:var(--lime-ink)">A</span>`
                   : isB?`<span class="pill" style="background:#7fc4dd; color:var(--lime-ink)">B</span>`
                   : `<span class="pill p-Technical">—</span>`;
          return `<label class="row-item" style="cursor:pointer">
            <input type="checkbox" class="cmpchk" data-id="${r.id}" ${(isA||isB)?"checked":""} style="width:18px; height:18px; accent-color:var(--blood-2)">
            <div class="name">${esc(r.event_name||"")}
              <small>${r.year||""} · ${esc(r.finish||"—")} · ${sgFmt(r.sg_total)}</small></div>
            ${tag}
          </label>`;
        }).join("") : `<div class="empty" style="border:0">No events match "${esc(cmpSearch)}".</div>`}
      </div>
    </div>`;

  const qbox=document.getElementById("cmp-q");
  qbox.oninput=()=>{ cmpSearch=qbox.value; keepScroll(()=>{ renderTier(box,results);
    const nb=document.getElementById("cmp-q"); if(nb){ nb.focus(); nb.setSelectionRange(nb.value.length,nb.value.length); } }); };

  box.querySelectorAll(".cmpmode").forEach(b2=>b2.onclick=()=>{
    cmpTarget=b2.dataset.t; keepScroll(()=>renderTier(box,results)); });

  box.querySelectorAll(".cmpchk").forEach(chk=>chk.onchange=(e)=>{
    e.stopPropagation();
    const id=chk.dataset.id;
    if(chk.checked){
      if(cmpTarget==="A"){ cmpA.add(id); cmpB.delete(id); } else { cmpB.add(id); cmpA.delete(id); }
    } else { cmpA.delete(id); cmpB.delete(id); }
    keepScroll(()=>renderTier(box,results));
  });

  document.getElementById("cmp-majors").onclick=()=>{
    cmpA=new Set(); cmpB=new Set();
    results.forEach(r=>{ if(MAJOR_RE.test((r.event_name||"").trim())) cmpA.add(r.id); else cmpB.add(r.id); });
    keepScroll(()=>renderTier(box,results));
  };
  document.getElementById("cmp-all").onclick=()=>{
    shown.forEach(r=>{ if(cmpTarget==="A"){ cmpA.add(r.id); cmpB.delete(r.id); } else { cmpB.add(r.id); cmpA.delete(r.id); } });
    keepScroll(()=>renderTier(box,results));
  };
  document.getElementById("cmp-clear").onclick=()=>{
    cmpA=new Set(); cmpB=new Set(); keepScroll(()=>renderTier(box,results));
  };
}

async function renderCorrelation(box,results,pid){
  box.innerHTML=`<div class="load">Working out the correlation</div>`;
  const recent=results.slice(0,corrWindow).filter(r=>r.start_date);
  if(!recent.length){ box.innerHTML=`<div class="empty">Not enough results yet.</div>`; return; }
  const from=recent[recent.length-1].start_date;
  const {data:sess}=await sb.from("sessions").select("balls, minutes, drills(category)")
    .eq("player_id",pid).gte("logged_on",from);

  const MAP={Driving:"sg_ott",Approach:"sg_app","Short Game":"sg_arg",Putting:"sg_putt"};
  const rows=Object.keys(MAP).map(cat=>{
    const balls=(sess||[]).filter(s=>s.drills?.category===cat).reduce((a,s)=>a+(s.balls||0),0);
    const mins=(sess||[]).filter(s=>s.drills?.category===cat).reduce((a,s)=>a+(+s.minutes||0),0);
    const f=MAP[cat];
    const vals=recent.map(r=>r[f]).filter(x=>x!=null).map(Number);
    const sg=vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    const half=Math.ceil(vals.length/2);
    const recentAvg=vals.slice(0,half).reduce((a,b)=>a+b,0)/(half||1);
    const older=vals.slice(half);
    const earlierAvg=older.length? older.reduce((a,b)=>a+b,0)/older.length : recentAvg;
    const trend = recentAvg-earlierAvg > 0.1 ? "up" : recentAvg-earlierAvg < -0.1 ? "down" : "flat";
    return {cat,balls,mins,sg,trend};
  });
  const maxB=Math.max(1,...rows.map(r=>r.balls));
  const best=rows.filter(r=>r.sg!=null).sort((a,b)=>b.sg-a.sg)[0];
  const worst=rows.filter(r=>r.sg!=null).sort((a,b)=>a.sg-b.sg)[0];
  const mostPractised=rows.slice().sort((a,b)=>b.balls-a.balls)[0];

  box.innerHTML=`
    <div class="daybar" style="margin-bottom:10px">
      <span class="who">Window</span>
      ${[4,8,12,20].map(w=>`<button class="btn btn-ghost btn-sm cwin ${w===corrWindow?"on":""}" data-w="${w}">${w} events</button>`).join("")}
    </div>
    <p style="font-size:12px; color:var(--muted); margin:0 0 12px">
      Practice logged since ${from} against average strokes gained over your last ${recent.length} events.</p>
    <div class="card">
      ${rows.map(r=>{
        const arrow=r.trend==="up"?"↑":r.trend==="down"?"↓":"→";
        return `<div style="margin-bottom:16px">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:5px">
            <span style="font-size:14px; font-weight:700">${r.cat}</span>
            <span style="font-size:12px; color:var(--muted)">${r.balls} balls · ${Math.round(r.mins)}m ·
              <b style="color:${sgColor(r.sg)}">${sgFmt(r.sg)} SG ${arrow}</b></span>
          </div>
          <div style="height:8px; background:var(--panel-2); border-radius:2px; overflow:hidden">
            <div style="height:100%; width:${Math.round(r.balls/maxB*100)}%; background:${sgColor(r.sg)}; opacity:.85"></div>
          </div></div>`;
      }).join("")}
    </div>
    ${best&&worst?`<div class="card" style="margin-top:12px">
      <div class="mini">What it shows</div>
      <div style="font-size:13px; color:var(--muted); line-height:1.6">
        Strongest: <b style="color:${sgColor(best.sg)}">${best.cat} ${sgFmt(best.sg)}</b>.
        Weakest: <b style="color:${sgColor(worst.sg)}">${worst.cat} ${sgFmt(worst.sg)}</b>.
        Most practice volume went to <b style="color:var(--ink)">${mostPractised.cat}</b> (${mostPractised.balls} balls).
      </div></div>`:""}`;

  box.querySelectorAll(".cwin").forEach(b=>b.onclick=()=>{
    corrWindow=+b.dataset.w; keepScroll(()=>renderCorrelation(box,results,pid));
  });
}

  async function loadLib(){

    const box=document.getElementById("llist"); document.getElementById("lcount").textContent=(data?.length||0)+" drills";
    if(!data?.length){ box.innerHTML=`<div class="empty">No drills yet — add your first above.</div>`; return; }

    wrap.innerHTML=`<div class="cbox">
      <div class="chead"><div><b>Edit drill</b><div class="who">${esc(d.name)}</div></div>
        <button class="cx" id="edx">×</button></div>
      <div class="clist" style="padding:14px 16px">
        <div class="field"><label class="mini">Name</label><input id="e-n" value="${esc(d.name||"")}"></div>

          <div><label class="mini">Def. time</label><input id="e-t" type="number" value="${d.default_minutes??""}"></div>
          <div><label class="mini">Def. balls</label><input id="e-b" type="number" value="${d.default_balls??""}"></div>
          <div><label class="mini">Distance</label><input id="e-d" value="${esc(d.distance||"")}"></div>
        </div>
        <div class="grid3" style="margin-top:8px">
          <div><label class="mini">Def. mental</label><input id="e-m" type="number" step="0.5" value="${d.default_mental??""}"></div>
          <div><label class="mini">Def. phys</label><input id="e-p" type="number" step="0.5" value="${d.default_physical??""}"></div>
          <div><label class="mini">Why</label><input id="e-w" value="${esc(d.why||"")}"></div>
        </div>
        <div class="field" style="margin-top:8px"><label class="mini">Goal / pass criteria</label><input id="e-g" value="${esc(d.goal||"")}"></div>
      </div>
      <div class="cfoot">
        <button class="btn btn-ghost btn-sm" id="e-del">Delete</button>
        <button class="btn btn-primary btn-sm" id="e-save" style="margin-left:auto">Save changes</button></div>
    </div>`;
    document.body.appendChild(wrap);
    const close=()=>wrap.remove();
    wrap.onclick=e=>{ if(e.target===wrap) close(); };
    document.getElementById("edx").onclick=close;
    document.getElementById("e-save").onclick=async()=>{
      const newName=val("e-n");
      const { error }=await sb.from("drills").update({
        name:newName, category:val("e-c"), default_club:val("e-k"),
        default_minutes:num(val("e-t")), default_balls:num(val("e-b")), distance:val("e-d"),
        default_mental:num(val("e-m")), default_physical:num(val("e-p")), why:val("e-w"), goal:val("e-g")
      }).eq("id",d.id);
      if(error){ flash(error.message); return; }
      // verify by re-reading the row (a returned .select() can be empty even on success)
      const { data:check }=await sb.from("drills").select("name").eq("id",d.id).maybeSingle();
      if(check && check.name!==newName){
        flash("Save didn't take — this drill may belong to another account.");
        return;
      }
      // Push new defaults onto PLANNED days (today or later, and not marked done).
      // Past days and anything marked done are history — never overwritten.
      const newMins=num(val("e-t")), newBalls=num(val("e-b"));
      const newMental=num(val("e-m")), newPhys=num(val("e-p"));
      const today=todayISO();
      const {data:using}=await sb.from("sessions")
        .select("id,minutes,balls,mental,physical,logged_on,status,completed")
        .eq("player_id",me.id).eq("drill_id",d.id);
      for(const row of (using||[])){
        const isDone = row.status==="done" || row.completed===true;
        const isPast = row.logged_on < today;
        if(isDone || isPast) continue;          // history — leave it
        const patch={};
        if(newMins!=null)   patch.minutes=newMins;
        if(newBalls!=null)  patch.balls=newBalls;
        if(newMental!=null) patch.mental=newMental;
        if(newPhys!=null)   patch.physical=newPhys;
        if(Object.keys(patch).length) await sb.from("sessions").update(patch).eq("id",row.id);
      }
      await refreshDrills(true);
      flash("Drill updated"); close(); loadLib();
    };
    document.getElementById("e-del").onclick=async()=>{
      if(!confirm(`Delete "${d.name}"? This can't be undone. Sessions already logged with it are kept.`)) return;
      const { error }=await sb.from("drills").delete().eq("id",d.id);
      if(error){ flash(error.message.includes("foreign")?"That drill is used in logged sessions — can't delete it.":error.message); return; }
      const { data:check }=await sb.from("drills").select("id").eq("id",d.id).maybeSingle();
      if(check){ flash("Delete didn't take — this drill may belong to another account."); return; }
      await refreshDrills(true);
      flash("Drill deleted"); close(); loadLib();
    };
  }
}
