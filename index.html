<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141920" />
<link rel="manifest" href="manifest.json" />
<title>Practice Schedule</title>
<style>
  :root{
    --bg:#141920; --panel:#1b2027; --panel-2:#232a33; --line:#333c46;
    --ink:#eef2f0; --muted:#8b97a3; --faint:#5b6672;
    --blood:#7fa322; --blood-2:#c3f53c; --blood-soft:#22301a;
    --gold:#c3f53c;
    --fair:#c3f53c; --miss:#e0864f;
    --lime-ink:#1b2027;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-family:"Archivo",sans-serif; font-weight:800; margin:0; letter-spacing:-.01em}
  .display{font-family:"Archivo",sans-serif; font-weight:900; letter-spacing:-.02em; text-transform:uppercase}
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit; font-size:16px}
  .wrap{max-width:1120px; margin:0 auto; padding:0 16px}
  a{color:var(--blood-2)}

  /* header */
  header{
    background:linear-gradient(180deg,#1b2027 0%,var(--bg) 100%);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:30;
    padding-top:env(safe-area-inset-top);
  }
  header .wrap{display:flex; align-items:center; gap:12px; padding-top:12px; padding-bottom:12px}
  .mark{display:flex; align-items:center; gap:10px}
  .mark .bar{width:4px; height:26px; background:var(--blood-2); border-radius:2px}
  .brand{font-family:"Archivo"; font-weight:900; font-size:20px; text-transform:uppercase; letter-spacing:.02em}
  .brand em{color:var(--blood-2); font-style:normal}
  .whoami{margin-left:auto; display:flex; align-items:center; gap:12px; font-size:13px; color:var(--muted)}
  .rolechip{border:1px solid var(--line); color:var(--ink); padding:3px 10px; border-radius:999px; font-size:11px; text-transform:uppercase; letter-spacing:.06em}
  .signout{background:none; border:0; color:var(--muted); font-size:13px; text-decoration:underline}

  /* auth */
  .auth{min-height:88vh; display:flex; align-items:center; justify-content:center; padding:24px 16px}
  .authcard{width:100%; max-width:420px}
  .kicker{color:var(--blood-2); font-size:12px; letter-spacing:.28em; text-transform:uppercase; font-weight:700; margin-bottom:14px}
  .authcard h1{font-size:44px; line-height:.95; text-transform:uppercase; font-weight:900; letter-spacing:-.02em; margin-bottom:10px}
  .authcard h1 em{color:var(--blood-2); font-style:normal}
  .authcard .sub{color:var(--muted); font-size:14px; margin-bottom:24px; max-width:34ch}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:11px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.08em}
  .field input,.field select{width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:var(--r); background:var(--panel); color:var(--ink)}
  .field input:focus,.field select:focus{outline:none; border-color:var(--blood-2); box-shadow:0 0 0 3px var(--blood-soft)}
  .btn{border:0; border-radius:var(--r); padding:13px 16px; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.04em}
  .btn-primary{background:var(--blood-2); color:var(--lime-ink); width:100%}
  .btn-primary:hover{background:#d3ff5c}
  .btn-primary:active{transform:translateY(1px)}
  .btn-ghost{background:var(--panel); border:1px solid var(--line); color:var(--ink)}
  .btn-ghost:hover{border-color:var(--faint)}
  .btn-sm{padding:7px 12px; font-size:12px; border-radius:8px}
  .switch{margin-top:16px; font-size:13px; color:var(--muted)}
  .switch a{font-weight:700; text-decoration:none}
  .err{background:#2e1f1a; border:1px solid #7a4a33; color:#f0c2ab; padding:10px 12px; border-radius:var(--r); font-size:13px; margin-bottom:12px}

  /* tabs */
  nav.tabs{display:flex; gap:4px; padding:14px 0 6px; position:sticky; top:56px; background:var(--bg); z-index:20; border-bottom:1px solid var(--line)}
  nav.tabs button{background:none; border:0; padding:9px 14px; font-size:12px; color:var(--muted); border-radius:8px; font-weight:700; text-transform:uppercase; letter-spacing:.05em}
  nav.tabs button.on{background:var(--blood-2); color:var(--lime-ink)}

  section{padding:16px 0 40px}
  .sec-h{display:flex; align-items:flex-end; justify-content:space-between; margin:6px 0 14px; gap:12px; flex-wrap:wrap}
  .sec-h h2{font-size:22px; text-transform:uppercase; letter-spacing:-.01em}
  .sec-h .meta{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px}
  .card + .card{margin-top:14px}
  .mini{font-size:11px; color:var(--muted); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:.07em}
  .card input,.card select,.card textarea{width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); color:var(--ink)}
  .card input:focus,.card select:focus{outline:none; border-color:var(--blood-2)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  .inline{display:flex; align-items:center; gap:8px}

  /* day toolbar */
  .daybar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
  .daybar .dsel{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:6px 8px}
  .daybar input[type=date]{background:transparent; border:0; color:var(--ink); font-weight:700}
  .who{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  .who b{color:var(--gold)}

  /* THE GRID */
  .gridwrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--panel)}
  table.grid{border-collapse:collapse; width:100%; min-width:1120px; font-size:13px}
  table.grid th{position:sticky; top:0; background:var(--panel-2); text-align:center; padding:9px 8px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:700; border-bottom:1px solid var(--line); white-space:nowrap}
  table.grid th.l{text-align:left}
  table.grid td{padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
  table.grid tr:last-child td{border-bottom:0}
  .cell-in{width:52px; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); color:var(--ink); text-align:center; font-size:13px}
  .cell-in:focus{outline:none; border-color:var(--blood-2)}
  .cell-txt{width:100%; min-width:120px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); color:var(--ink); font-size:13px}
  .cell-txt:focus{outline:none; border-color:var(--blood-2)}
  .drillsel{width:100%; min-width:170px; padding:7px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2); color:var(--ink); font-size:13px; font-weight:600}
  .drillsel:focus{outline:none; border-color:var(--blood-2)}
  .auto{display:block; padding:6px 4px; text-align:center; color:var(--muted); background:transparent; font-size:12px; white-space:nowrap}
  .pill{font-size:10px; padding:3px 9px; border-radius:999px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap}
  .p-Driving{background:#3b4a1c; color:#c3f53c}
  .p-Approach{background:#1e3340; color:#7fc4dd}
  .p-Putting{background:#1c3a2e; color:#6fd8ab}
  .p-sg{background:#3d2a1a; color:#e0a26f}
  .p-Performance{background:#2a2740; color:#a9a4e8}
  .p-Technical,.p-Practice,.p--{background:#2a323b; color:#98a4b0}
  .p-oncourse{background:#2a323b; color:#98a4b0}
  .statusbtn{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--faint); font-size:15px; font-weight:800; line-height:1; cursor:pointer}
  .statusbtn.s-done{background:var(--blood-2); color:var(--lime-ink); border-color:var(--blood-2)}
  .statusbtn.s-missed{background:#3d2a1a; color:#e0864f; border-color:#7a4a33}
  .statusflag{font-size:14px; font-weight:800; color:var(--faint)}
  .statusflag.s-done{color:var(--blood-2)}
  .statusflag.s-missed{color:#e0864f}
  .doneflag{color:var(--faint); font-size:14px}
  .doneflag.on{color:var(--fair)}
  .rowdel{background:none; border:0; color:var(--faint); font-size:16px; cursor:pointer; padding:2px 6px}
  .rowdel:hover{color:var(--blood-2)}
  .cbtn{background:none; border:0; color:var(--faint); font-size:13px; cursor:pointer; padding:2px 4px}
  .cbtn:hover{color:var(--blood-2)}
  .cbtn b{color:var(--blood-2); font-size:11px; margin-left:1px}
  .cmodal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:80; padding:16px}
  .cbox{background:var(--panel); border:1px solid var(--line); border-radius:12px; width:100%; max-width:440px; max-height:80vh; display:flex; flex-direction:column}
  .chead{display:flex; align-items:flex-start; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line)}
  .cx{background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer; line-height:1}
  .clist{overflow-y:auto; padding:8px 16px; flex:1}
  .citem{padding:10px 0; border-bottom:1px solid var(--line); font-size:14px}
  .citem:last-child{border-bottom:0}
  .cmeta{font-size:12px; color:var(--muted); margin-bottom:3px}
  .cfoot{display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line)}
  .cfoot input{flex:1; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); color:var(--ink)}
  tfoot td{background:var(--panel-2); font-weight:800; padding:10px 8px; border-top:2px solid var(--line); text-align:center}
  tfoot td.l{text-align:left; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--gold)}

  .gridtools{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .savebar{display:flex; align-items:center; gap:10px; margin-top:12px}
  .savestate{font-size:12px; color:var(--muted)}

  .row-item{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line)}
  .row-item:last-child{border-bottom:0}
  .row-item .name{flex:1; font-size:14px}
  .row-item .name small{display:block; color:var(--muted); font-size:12px}
  .empty{text-align:center; color:var(--muted); font-size:14px; padding:30px 12px; border:1px dashed var(--line); border-radius:var(--r)}
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 12px}
  .stat .n{font-family:"Archivo"; font-weight:900; font-size:26px; letter-spacing:-.02em}
  .stat .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px}
  .barwrap{margin:10px 0}
  .barwrap .lab{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
  .bar{height:10px; background:var(--panel-2); border-radius:2px; overflow:hidden; border:1px solid var(--line)}
  .bar > i{display:block; height:100%; background:var(--blood-2)}
  .flash{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--blood-2); color:var(--lime-ink); padding:11px 20px; border-radius:8px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:0; transition:opacity .2s; z-index:60}
  .flash.show{opacity:1}
  .load{text-align:center; padding:44px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-size:12px}
  @media (max-width:520px){ .stat-row{grid-template-columns:repeat(2,1fr)} .authcard h1{font-size:36px} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="app"><div class="load">Loading</div></div>
<div class="flash" id="flash"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   1. CONNECT TO SUPABASE
   Replace the two values with yours from
   Supabase → Project Settings → API.
   ============================================================ */
const SUPABASE_URL = "https://elrbabkftragomipkscw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVscmJhYmtmdHJhZ29taXBrc2N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NTI2MDIsImV4cCI6MjEwMDEyODYwMn0.5eVqPzffwARIoR-C_tR15fFKjlVNgFjg34AxvX_CRSo";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CATS = ["Driving","Approach","Putting","Short Game","Performance","Technical","Practice"];
const app = document.getElementById("app");
let me = null;              // {id, full_name, role}
let players = [];           // coach: their linked players
let activePlayerId = null;  // whose day the grid is showing
let activeDay = new Date().toISOString().slice(0,10);
let drillMap = {};          // id -> drill
let gridRows = [];          // working copy of the day's rows

function flash(m){ const f=document.getElementById("flash"); f.textContent=m; f.classList.add("show"); setTimeout(()=>f.classList.remove("show"),1700); }
function val(id){ return document.getElementById(id)?.value?.trim() || ""; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function pillClass(c){ if(c==="Short Game")return "p-sg"; if(c==="Practice On Course")return "p-oncourse"; return "p-"+(c||"-"); }

/* ============================================================
   2. AUTH
   ============================================================ */
function authScreen(mode){
  const signup = mode==="signup";
  app.innerHTML = `
   <div class="auth"><div class="authcard">
     <p class="kicker">Team Fitz</p>
     <h1>Practice <em>Schedule</em></h1>
     <p class="sub">${signup?"Set up your account.":"Sign in."}</p>
     <div id="autherr"></div>
     ${signup?`<div class="field"><label>Your name</label><input id="a-name" placeholder="Matt Fitzpatrick"></div>`:""}
     ${signup?`<div class="field"><label>I am a…</label><select id="a-role"><option value="player">Player</option><option value="coach">Coach</option><option value="viewer">Viewer (view only)</option></select></div>`:""}
     <div class="field"><label>Email</label><input id="a-email" type="email" placeholder="you@email.com"></div>
     <div class="field"><label>Password</label><input id="a-pass" type="password" placeholder="••••••••"></div>
     <button class="btn btn-primary" id="a-go">${signup?"Create account":"Sign in"}</button>
     <p class="switch">${signup?"Already have an account?":"New here?"}
       <a href="#" id="a-switch">${signup?"Sign in":"Create one"}</a></p>
   </div></div>`;
  document.getElementById("a-switch").onclick=e=>{e.preventDefault(); authScreen(signup?"signin":"signup");};
  document.getElementById("a-go").onclick=async()=>{
    const errbox=document.getElementById("autherr"); errbox.innerHTML="";
    try{
      if(signup){
        const {error}=await sb.auth.signUp({email:val("a-email"),password:val("a-pass"),
          options:{data:{full_name:val("a-name"),role:val("a-role")}}});
        if(error)throw error; flash("Account created");
      }else{
        const {error}=await sb.auth.signInWithPassword({email:val("a-email"),password:val("a-pass")});
        if(error)throw error;
      }
    }catch(e){ errbox.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
  };
}

/* ============================================================
   3. BOOT
   ============================================================ */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ authScreen("signin"); return; }
  const {data:prof}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(!prof){ app.innerHTML=`<div class="load">Setting up your profile — refresh in a moment</div>`; return; }
  me=prof;

  // load drills into a lookup map
  const {data:drills}=await sb.from("drills").select("*");
  drillMap={}; (drills||[]).forEach(d=>drillMap[d.id]=d);

  if(me.role==="coach"){
    const {data:links}=await sb.from("coach_players")
      .select("player_id, profiles!coach_players_player_id_fkey(full_name)").eq("coach_id",me.id);
    players=(links||[]).map(l=>({id:l.player_id,name:l.profiles?.full_name||"Player"}));
    activePlayerId=players[0]?.id||null;
  }else if(me.role==="viewer"){
    const {data:pv}=await sb.from("player_viewers").select("player_id").eq("viewer_id",me.id).limit(1).maybeSingle();
    activePlayerId=pv?.player_id||null;
  }else{
    activePlayerId=me.id;
  }
  shell();
}
sb.auth.onAuthStateChange(()=>boot());

/* ============================================================
   4. SHELL + TABS
   ============================================================ */
let currentTab=null;
function shell(){
  const tabs = me.role==="coach"
    ? [["day","The Sheet"],["week","Week"],["sched","Schedule"],["season","Season"],["players","Players"],["library","Drills"],["progress","Progress"]]
    : me.role==="viewer"
    ? [["day","The Sheet"],["week","Week"],["sched","Schedule"],["season","Season"],["progress","Progress"]]
    : [["day","The Sheet"],["week","Week"],["sched","Schedule"],["season","Season"],["team","Team"],["progress","Progress"]];
  if(!currentTab) currentTab=tabs[0][0];
  app.innerHTML=`
    <header><div class="wrap">
      <div class="mark"><div class="bar"></div><div class="brand">Practice <em>Schedule</em></div></div>
      <div class="whoami">
        <span class="rolechip">${me.role}</span>
        <span>${esc(me.full_name||"")}</span>
        <button class="signout" id="signout">Sign out</button>
      </div>
    </div></header>
    <div class="wrap">
      <nav class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${t[0]===currentTab?'on':''}">${t[1]}</button>`).join("")}</nav>
      <div id="tabview"></div>
    </div>`;
  document.getElementById("signout").onclick=()=>sb.auth.signOut();
  app.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab; shell();});
  renderTab();
}
function renderTab(){
  const v=document.getElementById("tabview");
  v.innerHTML=`<div class="load">Loading</div>`;
  if(currentTab==="day") dayScreen(v);
  else if(currentTab==="week") weekScreen(v);
  else if(currentTab==="sched") scheduleScreen(v);
  else if(currentTab==="season") seasonScreen(v);
  else if(currentTab==="team") teamScreen(v);
  else if(currentTab==="players") coachPlayers(v);
  else if(currentTab==="library") library(v);
  else if(currentTab==="progress") progress(v);
}

/* ============================================================
   5. THE SHEET — shared day grid with lookup-on-select
   ============================================================ */
async function dayScreen(v){
  if(me.role==="coach" && !players.length){
    v.innerHTML=`<div class="empty">No players linked yet. Open <b>Players</b> to add one by email.</div>`;
    return;
  }
  const drills=Object.values(drillMap).sort((a,b)=>a.name.localeCompare(b.name));
  const playerPicker = me.role==="coach"
    ? `<div class="dsel"><span class="who">Player</span>
        <select id="pcell" style="background:transparent;border:0;color:var(--ink);font-weight:700">
          ${players.map(p=>`<option value="${p.id}" ${p.id===activePlayerId?'selected':''}>${esc(p.name)}</option>`).join("")}
        </select></div>`
    : `<div class="who">Your sheet, <b>${esc(me.full_name||"")}</b></div>`;

  v.innerHTML=`
    <div class="daybar">
      <button class="btn btn-ghost btn-sm" id="dprev">‹</button>
      <div class="dsel"><span class="who">Day</span><input type="date" id="daycell" value="${activeDay}"></div>
      <button class="btn btn-ghost btn-sm" id="dnext">›</button>
      <button class="btn btn-ghost btn-sm" id="dtoday">Today</button>
      ${playerPicker}
      <span class="who" style="margin-left:auto" id="rolehint">${me.role==="coach"?"Build the day — pick drills, the rest fills in":"Tap the status box: · pending → ✓ done → ✗ missed"}</span>
    </div>
    <div class="gridwrap">
      <table class="grid">
        <thead><tr>
          <th class="l">Drill</th><th>Club(s)</th><th>Category</th><th>Time</th><th>Balls</th>
          <th>Dist</th><th>Ment</th><th>Phys</th><th>Why</th><th>Goal</th>
          <th>Done</th><th>Completed notes</th><th>Notes</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
        <tfoot><tr>
          <td class="l">Totals</td><td></td><td></td>
          <td id="t-time">0</td><td id="t-balls">0</td><td></td>
          <td id="t-ment">0</td><td id="t-phys">0</td>
          <td colspan="6"></td>
        </tr></tfoot>
      </table>
    </div>
    <div class="gridtools">
      ${me.role==="viewer"?"":`<button class="btn btn-ghost btn-sm" id="addrow">+ Add row</button>`}
      <div class="savebar" style="margin-left:auto">
        <span class="savestate" id="savestate"></span>
        ${me.role==="viewer"?`<span class="who">Read only</span>`:`<button class="btn btn-primary btn-sm" id="savegrid">Save the day</button>`}
      </div>
    </div>`;

  if(me.role==="coach"){
    document.getElementById("pcell").onchange=e=>{ activePlayerId=e.target.value; dayScreen(v); };
  }
  document.getElementById("daycell").onchange=e=>{ activeDay=e.target.value; dayScreen(v); };
  const shiftDay=(n)=>{ const d=new Date(activeDay+"T00:00:00"); d.setDate(d.getDate()+n); activeDay=d.toISOString().slice(0,10); dayScreen(v); };
  document.getElementById("dprev").onclick=()=>shiftDay(-1);
  document.getElementById("dnext").onclick=()=>shiftDay(1);
  document.getElementById("dtoday").onclick=()=>{ activeDay=new Date().toISOString().slice(0,10); dayScreen(v); };
  const arow=document.getElementById("addrow"); if(arow) arow.onclick=()=>{ gridRows.push(blankRow()); drawRows(drills); };
  const sgrid=document.getElementById("savegrid"); if(sgrid) sgrid.onclick=saveDay;

  await loadDay();
  drawRows(drills);
}

function blankRow(){ return {id:null, drill_id:"", minutes:"", balls:"", distance:"", mental:"", physical:"",
  status:"pending", completed_notes:"", notes:"", _dirty:true}; }

async function loadDay(){
  const {data}=await sb.from("sessions").select("*")
    .eq("player_id",activePlayerId).eq("logged_on",activeDay).order("sort");
  gridRows = (data||[]).map(r=>({
    id:r.id, drill_id:r.drill_id||"", minutes:r.minutes??"", balls:r.balls??"",
    distance:r.distance??"", mental:r.mental??"", physical:r.physical??"",
    status:r.status||(r.completed?"done":"pending"), completed_notes:r.completed_notes||"", notes:r.notes||"", _dirty:false
  }));
  // comment counts per row
  const ids=gridRows.map(r=>r.id).filter(Boolean);
  if(ids.length){
    const {data:cs}=await sb.from("comments").select("session_id").in("session_id",ids);
    const tally={}; (cs||[]).forEach(c=>tally[c.session_id]=(tally[c.session_id]||0)+1);
    gridRows.forEach(r=>{ r._ccount = r.id?(tally[r.id]||0):0; });
  }

  if(!gridRows.length) gridRows=[blankRow(),blankRow(),blankRow()];

  // If this day is in the past, anything never ticked counts as NOT completed.
  const today=new Date().toISOString().slice(0,10);
  if(activeDay < today){
    gridRows.forEach(r=>{
      if(r.drill_id && (!r.status || r.status==="pending")){ r.status="missed"; r._dirty=true; }
    });
  }
}

function drawRows(drills){
  const tb=document.getElementById("rows"); if(!tb) return;
  const isPlayer = me.role==="player";

    const opts=`<option value=""></option>`+drills.map(x=>`<option value="${x.id}" ${x.id===r.drill_id?'selected':''}>${esc(x.name)}</option>`).join("");
    const catCell = cat?`<span class="pill ${pillClass(cat)}">${esc(cat)}</span>`:`<span class="auto">—</span>`;
    const st = r.status||"pending";
    const doneCell = isPlayer
      ? `<button class="statusbtn s-${st}" data-i="${i}" title="Click to change: pending → done → missed">${st==='done'?'✓':st==='missed'?'✗':'·'}</button>`
      : `<span class="statusflag s-${st}">${st==='done'?'✓':st==='missed'?'✗':'·'}</span>`;
    const cnoteCell = isPlayer
      ? `<input class="cell-txt" data-i="${i}" data-f="completed_notes" value="${esc(r.completed_notes)}" placeholder="how'd it go">`
      : `<span class="auto" style="text-align:left; min-width:120px; display:block">${r.completed_notes?esc(r.completed_notes):'—'}</span>`;
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${isViewer?`<span style="font-size:14px">${d?esc(d.name):"—"}</span>`:`<select class="drillsel" data-i="${i}">${opts}</select>`}</td>
      <td><span class="auto">${d&&d.default_club?esc(d.default_club):'—'}</span></td>
      <td style="text-align:center">${catCell}</td>
      <td style="text-align:center">${isViewer?`<span class="auto">${r.minutes===""?"—":esc(r.minutes)}</span>`:`<input class="cell-in" data-i="${i}" data-f="minutes" value="${esc(r.minutes)}">`}</td>
      <td style="text-align:center">${isViewer?`<span class="auto">${r.balls===""?"—":esc(r.balls)}</span>`:`<input class="cell-in" data-i="${i}" data-f="balls" value="${esc(r.balls)}">`}</td>
      <td><span class="auto">${d&&d.distance?esc(d.distance):(r.distance?esc(r.distance):'—')}</span></td>
      <td style="text-align:center">${isViewer?`<span class="auto">${r.mental===""?"—":esc(r.mental)}</span>`:`<input class="cell-in" data-i="${i}" data-f="mental" value="${esc(r.mental)}">`}</td>
      <td style="text-align:center">${isViewer?`<span class="auto">${r.physical===""?"—":esc(r.physical)}</span>`:`<input class="cell-in" data-i="${i}" data-f="physical" value="${esc(r.physical)}">`}</td>
      <td><span class="auto">${d&&d.why?esc(d.why):'—'}</span></td>
      <td><span class="auto" style="text-align:left; display:block; min-width:110px">${d&&d.goal?esc(d.goal):'—'}</span></td>
      <td style="text-align:center">${doneCell}</td>
      <td>${cnoteCell}</td>
      <td>${isViewer?`<span class="auto" style="text-align:left;display:block">${r.notes?esc(r.notes):"—"}</span>`:`<input class="cell-txt" data-i="${i}" data-f="notes" value="${esc(r.notes)}" placeholder="notes">`}</td>
      <td style="text-align:center">${isViewer?"":`<button class="rowdel" data-i="${i}" title="Remove">×</button>`}<button class="cbtn" data-i="${i}" title="Comments">💬${r._ccount?`<b>${r._ccount}</b>`:""}</button></td>`;
    tb.appendChild(tr);
  });

  // drill select => VLOOKUP fill
  tb.querySelectorAll(".drillsel").forEach(s=>s.onchange=()=>{
    const i=+s.dataset.i, id=s.value, d=drillMap[id];
    const r=gridRows[i];
    r.drill_id=id; r._dirty=true;
    if(d){
      if(r.minutes===""||r.minutes==null) r.minutes = d.default_minutes ?? "";
      if(r.balls===""||r.balls==null)     r.balls   = d.default_balls ?? "";
      if(r.mental===""||r.mental==null)   r.mental  = d.default_mental ?? "";
      if(r.physical===""||r.physical==null) r.physical = d.default_physical ?? "";
      if(!r.distance) r.distance = d.distance ?? "";
    }
    drawRows(drills); markDirty();
  });
  // editable cells
  tb.querySelectorAll("input.cell-in, input.cell-txt").forEach(inp=>inp.oninput=()=>{
    const i=+inp.dataset.i; gridRows[i][inp.dataset.f]=inp.value; gridRows[i]._dirty=true; totals(); markDirty();
  });
  tb.querySelectorAll(".statusbtn").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, cur=gridRows[i].status||"pending";
    gridRows[i].status = cur==="pending" ? "done" : cur==="done" ? "missed" : "pending";
    gridRows[i]._dirty=true; drawRows(drills); markDirty();
  });
  tb.querySelectorAll(".rowdel").forEach(btn=>btn.onclick=async()=>{
    const i=+btn.dataset.i, row=gridRows[i];
    if(row.id){ await sb.from("sessions").delete().eq("id",row.id); }
    gridRows.splice(i,1); if(!gridRows.length)gridRows=[blankRow()]; drawRows(drills); totals();
  });
  tb.querySelectorAll(".cbtn").forEach(b=>b.onclick=()=>openComments(+b.dataset.i));
  totals();
}

function totals(){
  let tt=0,tb=0,tm=0,mc=0,tp=0;
  gridRows.forEach(r=>{ tt+=+r.minutes||0; tb+=+r.balls||0; if(r.mental!==""&&r.mental!=null){tm+=+r.mental;mc++;} tp+=+r.physical||0; });
  const set=(id,v)=>{const el=document.getElementById(id); if(el)el.textContent=v;};
  set("t-time",Math.round(tt)); set("t-balls",Math.round(tb));
  set("t-ment",mc?tm.toFixed(1):"0"); set("t-phys",tp.toFixed(1));
}
function markDirty(){ const s=document.getElementById("savestate"); if(s)s.textContent="Unsaved changes"; }

async function saveDay(){
  const s=document.getElementById("savestate"); if(s)s.textContent="Saving…";
  let ok=true;
  for(let i=0;i<gridRows.length;i++){
    const r=gridRows[i];
    if(!r.drill_id && r.minutes==="" && r.balls==="" && !r.notes) continue; // skip empty rows
    const payload={
      player_id:activePlayerId, created_by:me.id, drill_id:r.drill_id||null,
      logged_on:activeDay, sort:i,
      minutes:num(r.minutes), balls:int(r.balls), distance:r.distance||null,
      mental:num(r.mental), physical:num(r.physical),
      status:r.status||"pending", completed:(r.status==="done"), completed_notes:r.completed_notes||null, notes:r.notes||null
    };
    let res;
    if(r.id){ res=await sb.from("sessions").update(payload).eq("id",r.id); }
    else{ res=await sb.from("sessions").insert(payload).select("id").single(); if(res.data)r.id=res.data.id; }
    if(res.error){ ok=false; flash("Error: "+res.error.message); break; }
    r._dirty=false;
  }
  if(s)s.textContent=ok?"Saved":"Save failed";
  if(ok)flash("Day saved");
}
function num(x){ return x===""||x==null?null:(+x); }
function int(x){ return x===""||x==null?0:Math.round(+x); }

function mondayOf(dateStr){
  const d=new Date(dateStr+"T00:00:00");
  const day=(d.getDay()+6)%7; // 0=Mon
  d.setDate(d.getDate()-day);
  return d;
}
function fmtDay(d){ return d.toLocaleDateString(undefined,{weekday:'short'}); }
function fmtDate(d){ return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function isoDate(d){ return d.toISOString().slice(0,10); }

let weekStart = isoDate(mondayOf(new Date().toISOString().slice(0,10)));

    </div>

  document.getElementById("wprev").onclick=()=>{ const d=mondayOf(weekStart); d.setDate(d.getDate()-7); weekStart=isoDate(d); weekScreen(v); };
  document.getElementById("wnext").onclick=()=>{ const d=mondayOf(weekStart); d.setDate(d.getDate()+7); weekStart=isoDate(d); weekScreen(v); };
  document.getElementById("wthis").onclick=()=>{ weekStart=isoDate(mondayOf(new Date().toISOString().slice(0,10))); weekScreen(v); };
  if(me.role==="coach"){ document.getElementById("wpick").onchange=e=>{ activePlayerId=e.target.value; weekScreen(v); }; }

  // pull the whole week in one query

  const rowsByDay={}; days.forEach(d=>rowsByDay[isoDate(d)]=[]);
  (sess||[]).forEach(s=>{ (rowsByDay[s.logged_on]=rowsByDay[s.logged_on]||[]).push(s); });

  // ----- horizontal week board: one column per day -----
  const catP=c=>`<span class="pill ${pillClass(c)}" style="font-size:9px; padding:2px 6px">${esc(c||'')}</span>`;
  let cols="";
  days.forEach(d=>{
    const key=isoDate(d), list=rowsByDay[key]||[];
    const mins=list.reduce((a,s)=>a+(+s.minutes||0),0);
    const balls=list.reduce((a,s)=>a+(s.balls||0),0);
    const done=list.filter(s=>(s.status||(s.completed?"done":"pending"))==="done").length;
    const missed=list.filter(s=>(s.status||"pending")==="missed").length;
    const isToday = key===new Date().toISOString().slice(0,10);
    cols+=`
      <div style="min-width:150px; flex:1; border:1px solid var(--line); border-radius:var(--r); background:var(--panel); overflow:hidden">
        <div style="padding:8px 10px; background:${isToday?'var(--blood-2)':'var(--panel-2)'}; color:${isToday?'var(--lime-ink)':'var(--ink)'}">
          <div style="font-weight:800; text-transform:uppercase; font-size:12px; letter-spacing:.04em">${fmtDay(d)}</div>
          <div style="font-size:11px; opacity:.8">${fmtDate(d)}</div>
        </div>
        <div style="padding:8px; display:flex; flex-direction:column; gap:6px; min-height:60px">
          ${list.length? list.map(s=>`
            <div style="border:1px solid var(--line); border-radius:7px; padding:6px 7px; background:var(--panel-2)">
              <div style="display:flex; align-items:center; gap:5px; justify-content:space-between">
                ${catP(s.drills?.category)}
                <span class="statusflag s-${s.status||(s.completed?'done':'pending')}" style="font-size:12px">${(s.status||(s.completed?'done':'pending'))==='done'?'✓':(s.status==='missed'?'✗':'·')}</span>
              </div>
              <div style="font-size:12px; margin-top:3px; line-height:1.25">${esc(s.drills?.name||'—')}</div>
              <div style="font-size:10px; color:var(--muted); margin-top:2px">${s.minutes||0}m · ${s.balls||0}b</div>
            </div>`).join("")
            : `<div style="color:var(--faint); font-size:11px; text-align:center; padding:14px 4px">—</div>` }
        </div>
        <div style="padding:7px 10px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); display:flex; justify-content:space-between">
          <span>${mins}m · ${balls}b</span><span>${done}✓ ${missed?missed+"✗":""}</span>
        </div>
      </div>`;
  });

  // ----- weekly category summary -----
  const byCat={}; CATS.forEach(c=>byCat[c]={mins:0,balls:0,count:0,done:0});
  let totMins=0,totBalls=0,totCount=0,totDone=0;
  (sess||[]).forEach(s=>{
    const c=s.drills?.category||"Technical"; if(!byCat[c])byCat[c]={mins:0,balls:0,count:0,done:0};
    byCat[c].mins+=+s.minutes||0; byCat[c].balls+=s.balls||0; byCat[c].count++; if((s.status||(s.completed?"done":"pending"))==="done")byCat[c].done++;
    totMins+=+s.minutes||0; totBalls+=s.balls||0; totCount++; if((s.status||(s.completed?"done":"pending"))==="done")totDone++;
  });
  const maxMins=Math.max(1,...CATS.map(c=>byCat[c].mins));
  const summaryRows=CATS.filter(c=>byCat[c].count>0).map(c=>`
    <div class="barwrap">
      <div class="lab"><span>${c}</span><span>${byCat[c].count} drills · ${byCat[c].mins}m · ${byCat[c].balls}b</span></div>
      <div class="bar"><i style="width:${Math.round(byCat[c].mins/maxMins*100)}%; background:var(--blood-2)"></i></div>
    </div>`).join("") || `<div class="empty">Nothing planned this week yet.</div>`;

  document.getElementById("weekbody").innerHTML=`
    <div style="overflow-x:auto; padding-bottom:4px">
      <div style="display:flex; gap:10px; min-width:900px">${cols}</div>
    </div>
    <div class="stat-row" style="margin-top:18px">
      ${stat(totCount,"Drills")}${stat(totMins,"Minutes")}${stat(totBalls,"Balls")}${stat(totCount?Math.round(totDone/totCount*100)+'%':'0%',"Completed")}
    </div>
    <div class="card">
      <h3 style="font-size:14px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:14px">Category summary · this week</h3>
      ${summaryRows}
    </div>`;
}

let schedDay = new Date().toISOString().slice(0,10);

/* ---- export a day (or the season) to calendar ---- */
function icsEscape(t){ return String(t||"").replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n"); }
function icsStamp(dateStr, timeStr){
  const t=(timeStr||"00:00").replace(":","");
  return dateStr.replace(/-/g,"")+"T"+t+"00";
}
function downloadICS(filename, events){
  let out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Practice Schedule//EN","CALSCALE:GREGORIAN"];
  events.forEach((e,i)=>{
    out.push("BEGIN:VEVENT");
    out.push("UID:ps-"+Date.now()+"-"+i+"@practice");
    out.push("DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z");
    if(e.allDay){
      out.push("DTSTART;VALUE=DATE:"+e.start.replace(/-/g,""));
      out.push("DTEND;VALUE=DATE:"+e.end.replace(/-/g,""));
    } else {
      out.push("DTSTART:"+icsStamp(e.date,e.start));
      out.push("DTEND:"+icsStamp(e.date,e.end||e.start));
    }
    out.push("SUMMARY:"+icsEscape(e.title));
    if(e.desc) out.push("DESCRIPTION:"+icsEscape(e.desc));
    out.push("END:VEVENT");
  });
  out.push("END:VCALENDAR");
  const blob=new Blob([out.join("\r\n")],{type:"text/calendar"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  URL.revokeObjectURL(a.href);
}

function timeOptions(sel){
  let out="";
  for(let h=4; h<24; h++){
    for(const m of [0,15,30,45]){
      const t=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
      out+=`<option value="${t}" ${t===sel?"selected":""}>${t}</option>`;
    }
  }
  return out;
}

function addMins(hhmm, mins){
  if(!hhmm) return "";
  const p=hhmm.split(":"); if(p.length<2) return "";
  const d=new Date(2000,0,1,+p[0]||0,+p[1]||0);
  d.setMinutes(d.getMinutes()+(mins||0));
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

        <div><label class="mini">Start</label><select id="itime">${timeOptions("09:00")}</select></div>
        <div><label class="mini">Type</label><select id="ikind"><option value="practice">Practice</option><option value="media">Media</option><option value="other">Other</option></select></div>
        <div><label class="mini">Length</label><select id="imins">
          <option value="">—</option>
          ${[15,30,45,60,75,90,120,150,180,240].map(m=>`<option value="${m}">${m>=60?(m/60)+"h"+(m%60?" "+(m%60)+"m":""):m+"m"}</option>`).join("")}
        </select></div>
      </div>
      <div class="field" style="margin-top:8px"><label class="mini">Label</label><input id="ilabel" placeholder="e.g. Sky Sports interview / Lunch"></div>
      <div class="inline" style="margin-top:10px">
        <label class="inline" style="font-size:13px; color:var(--muted)"><input type="checkbox" id="ipriv" style="width:auto"> Private (hidden from your team)</label>
        <button class="btn btn-primary btn-sm" id="iadd" style="margin-left:auto">Add</button>
      </div>
      <p style="margin:10px 0 0; font-size:12px; color:var(--muted)">For Practice, leave Minutes blank — the end time is worked out from that day's drills.</p>
    </div>`:""}`;

  const shift=n=>{ const d=new Date(schedDay+"T00:00:00"); d.setDate(d.getDate()+n); schedDay=d.toISOString().slice(0,10); scheduleScreen(v); };
  document.getElementById("sprev").onclick=()=>shift(-1);
  document.getElementById("snext").onclick=()=>shift(1);
  document.getElementById("stoday").onclick=()=>{ schedDay=new Date().toISOString().slice(0,10); scheduleScreen(v); };
  document.getElementById("sday").onchange=e=>{ schedDay=e.target.value; scheduleScreen(v); };
  document.getElementById("sexport").onclick=()=>{
    if(!items?.length){ flash("Nothing to export"); return; }
    const evs=items.map(it=>{
      const mins = it.kind==="practice" ? practiceMins : (it.duration_mins||0);
      return { date:schedDay, start:it.start_time||"09:00", end:addMins(it.start_time,mins),
               title:(it.label||it.kind), desc: it.kind==="practice"&&practiceList.length?practiceList.join(", "):"" };
    });
    downloadICS("schedule-"+schedDay+".ics", evs);
    flash("Calendar file downloaded");
  };

  const kindPill={media:"p-Performance",practice:"p-Putting",other:"p-Technical"};
  const list=document.getElementById("slist");
  if(!items?.length){
    list.innerHTML=`<div class="empty" style="border:0">Nothing scheduled for this day.</div>`;
  } else {
    list.innerHTML=items.map((it,i)=>{
      const isPractice=it.kind==="practice";
      const mins=isPractice?practiceMins:(it.duration_mins||0);
      const endT=addMins(it.start_time,mins);
      return `<div style="display:flex; gap:12px; padding:12px 14px; ${i<items.length-1?'border-bottom:1px solid var(--line);':''}">
        <div style="min-width:92px">
          <div style="font-size:14px; font-weight:800">${esc(it.start_time||"")}${endT?` – ${endT}`:""}</div>
          <div style="font-size:11px; color:var(--muted)">${mins?mins+"m":""}</div>
        </div>
        <div style="flex:1">
          <div class="inline" style="flex-wrap:wrap; gap:8px">
            <span class="pill ${kindPill[it.kind]||'p-Technical'}">${esc(it.kind)}</span>
            <span style="font-size:14px">${esc(it.label||"")}</span>
            ${it.is_private?`<span class="pill p-Technical">private</span>`:""}
          </div>
          ${isPractice&&practiceList.length?`<div style="font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5">${practiceList.join("<br>")}</div>`:""}
          ${isPractice&&!practiceList.length?`<div style="font-size:12px; color:var(--faint); margin-top:4px">No drills on the sheet for this day yet</div>`:""}
        </div>
        ${canEdit?`<button class="rowdel" data-id="${it.id}" title="Remove from day" style="font-size:20px; padding:0 8px; align-self:center">×</button>`:""}
      </div>`;
    }).join("");
    list.querySelectorAll(".rowdel").forEach(b=>b.onclick=async()=>{
      if(!confirm("Remove this from the day?")) return;
      const {error}=await sb.from("schedule_items").delete().eq("id",b.dataset.id);
      if(error){ flash(error.message); return; }
      flash("Removed"); scheduleScreen(v);
    });
  }

  if(canEdit){
    document.getElementById("iadd").onclick=async()=>{
      const kind=val("ikind");
      const {error}=await sb.from("schedule_items").insert({
        player_id:me.id, day:schedDay, start_time:val("itime"),
        duration_mins: kind==="practice"?null:(+val("imins")||null),
        kind, label:val("ilabel"), is_private:document.getElementById("ipriv").checked });
      if(error){ flash(error.message); return; }
      flash("Added"); scheduleScreen(v);
    };
  }
}

/* ============================================================
   10. SEASON — tournament schedule, mirrors the spreadsheet
   ============================================================ */
let seasonYear = new Date().getFullYear();

async function seasonScreen(v){
  const pid = me.role==="player" ? me.id : activePlayerId;
  if(!pid){ v.innerHTML=`<div class="empty">No player linked.</div>`; return; }
  const canEdit = me.role==="player";

  const {data:years}=await sb.from("season_weeks").select("year").eq("player_id",pid);
  const yrList=[...new Set((years||[]).map(y=>y.year))].sort();
  if(yrList.length && !yrList.includes(seasonYear)) seasonYear=yrList[yrList.length-1];

  const {data:weeks}=await sb.from("season_weeks").select("*")
    .eq("player_id",pid).eq("year",seasonYear).order("week");

  const ev=(weeks||[]).filter(w=>w.status==="Tournament").length;
  const off=(weeks||[]).filter(w=>w.status==="Off").length;
  const unk=(weeks||[]).filter(w=>w.status==="Unknown").length;
  const stPill={Tournament:"p-Performance",Off:"p-Technical",Unknown:"p-Driving"};
  const fmt=d=>{ if(!d)return "—"; const x=new Date(d+"T00:00:00"); return x.toLocaleDateString(undefined,{day:'numeric',month:'short'}); };

  v.innerHTML=`
    <div class="daybar">
      <div class="dsel"><span class="who">Year</span>
        <select id="yrsel" style="background:transparent;border:0;color:var(--ink);font-weight:700">
          ${yrList.map(y=>`<option ${y===seasonYear?'selected':''}>${y}</option>`).join("")}
        </select></div>
      ${canEdit?`<button class="btn btn-ghost btn-sm" id="addyear">+ Add year</button>`:""}
      <button class="btn btn-ghost btn-sm" id="seasonexport">Add year to calendar</button>
      <span class="who" style="margin-left:auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap">
        <span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--blood-2);margin-right:5px"></i>${ev} events</span>
        <span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--faint);margin-right:5px"></i>${off} off</span>
        <span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#7a6a2e;margin-right:5px"></i>${unk} unknown</span>
      </span>
    </div>
    <div class="gridwrap">
      <table class="grid" style="min-width:900px">
        <thead><tr>
          <th>Wk</th><th>Dates</th><th>Country</th><th>City</th>
          <th class="l">Tournament</th><th class="l">Course</th><th>Status</th>${canEdit?"<th></th>":""}
        </tr></thead>
        <tbody id="srows"></tbody>
      </table>
    </div>
    ${canEdit?`<div class="gridtools">
      <button class="btn btn-ghost btn-sm" id="addweek">+ Add week</button>
      <div class="savebar" style="margin-left:auto">
        <span class="savestate" id="sstate"></span>
        <button class="btn btn-primary btn-sm" id="ssave">Save season</button>
      </div></div>`:""}`;

  document.getElementById("yrsel").onchange=e=>{ seasonYear=+e.target.value; seasonScreen(v); };
  document.getElementById("seasonexport").onclick=()=>{
    const evs=(weeks||[]).filter(w=>w.status==="Tournament"&&w.start_date).map(w=>({
      allDay:true, start:w.start_date, end:w.end_date||w.start_date,
      title:w.tournament||"Tournament",
      desc:[w.course,w.city,w.country].filter(Boolean).join(", ")
    }));
    if(!evs.length){ flash("No tournaments to export"); return; }
    downloadICS("season-"+seasonYear+".ics", evs);
    flash("Calendar file downloaded");
  };

  let rows=(weeks||[]).map(w=>({...w,_dirty:false}));
  function drawSeason(){
    const tb=document.getElementById("srows"); tb.innerHTML="";
    rows.forEach((w,i)=>{
      const tr=document.createElement("tr");
      const ti=(f,val,w2)=>canEdit
        ? `<input class="cell-txt" data-i="${i}" data-f="${f}" value="${esc(val||"")}" style="min-width:${w2||110}px">`
        : `<span class="auto" style="text-align:left;display:block">${val?esc(val):"—"}</span>`;
      const stripe = w.status==="Tournament" ? "var(--blood-2)" : w.status==="Off" ? "var(--faint)" : "#7a6a2e";
      const rowBg  = w.status==="Tournament" ? "rgba(195,245,60,.05)" : "transparent";
      const isMajor = /MASTERS|USPGA|US OPEN|THE OPEN|Ryder Cup|Players Championship/i.test(w.tournament||"");
      tr.style.background=rowBg;
      tr.innerHTML=`
        <td style="text-align:center; color:var(--muted); font-weight:700; border-left:4px solid ${stripe}">${w.week}${isMajor?'<div style="font-size:9px; color:var(--blood-2); letter-spacing:.06em">MAJOR</div>':''}</td>
        <td style="text-align:center; font-size:12px; color:var(--muted); white-space:nowrap">${fmt(w.start_date)} – ${fmt(w.end_date)}</td>
        <td style="text-align:center">${ti("country",w.country,90)}</td>
        <td>${ti("city",w.city,110)}</td>
        <td>${ti("tournament",w.tournament,160)}</td>
        <td>${ti("course",w.course,140)}</td>
        <td style="text-align:center">${canEdit
          ? `<select class="drillsel" data-i="${i}" data-f="status" style="min-width:120px">
               ${["Tournament","Off","Unknown"].map(o=>`<option ${o===w.status?'selected':''}>${o}</option>`).join("")}
             </select>`
          : `<span class="pill ${stPill[w.status]||'p-Technical'}">${esc(w.status)}</span>`}</td>
        ${canEdit?`<td style="text-align:center"><button class="rowdel" data-i="${i}">×</button></td>`:""}`;
      tb.appendChild(tr);
    });
    if(!canEdit) return;
    tb.querySelectorAll("input.cell-txt").forEach(inp=>inp.oninput=()=>{
      rows[+inp.dataset.i][inp.dataset.f]=inp.value; rows[+inp.dataset.i]._dirty=true;
      document.getElementById("sstate").textContent="Unsaved changes";
    });
    tb.querySelectorAll("select[data-f=status]").forEach(sel=>sel.onchange=()=>{
      rows[+sel.dataset.i].status=sel.value; rows[+sel.dataset.i]._dirty=true;
      document.getElementById("sstate").textContent="Unsaved changes";
    });
    tb.querySelectorAll(".rowdel").forEach(b=>b.onclick=async()=>{
      const r=rows[+b.dataset.i];
      if(r.id) await sb.from("season_weeks").delete().eq("id",r.id);
      rows.splice(+b.dataset.i,1); drawSeason();
    });
  }
  drawSeason();

  if(canEdit){
    document.getElementById("addweek").onclick=()=>{
      const nw=rows.length?Math.max(...rows.map(r=>r.week))+1:1;
      rows.push({id:null,player_id:me.id,year:seasonYear,week:nw,start_date:null,end_date:null,
        country:"",city:"",tournament:"",course:"",status:"Unknown",_dirty:true});
      drawSeason();
    };
    document.getElementById("addyear").onclick=async()=>{
      const y=prompt("Add which year?", String(seasonYear+1));
      if(!y||isNaN(+y)) return;
      const {error}=await sb.from("season_weeks").insert({player_id:me.id,year:+y,week:1,status:"Unknown"});
      if(error){ flash(error.message); return; }
      seasonYear=+y; flash("Year added"); seasonScreen(v);
    };
    document.getElementById("ssave").onclick=async()=>{
      const st=document.getElementById("sstate"); st.textContent="Saving…";
      let ok=true;
      for(const r of rows){
        if(!r._dirty) continue;
        const payload={player_id:me.id,year:seasonYear,week:r.week,start_date:r.start_date,end_date:r.end_date,
          country:r.country||null,city:r.city||null,tournament:r.tournament||null,course:r.course||null,status:r.status||"Unknown"};
        const res=r.id ? await sb.from("season_weeks").update(payload).eq("id",r.id)
                       : await sb.from("season_weeks").insert(payload).select("id").single();
        if(res.error){ ok=false; flash(res.error.message); break; }
        if(res.data?.id) r.id=res.data.id;
        r._dirty=false;
      }
      st.textContent=ok?"Saved":"Save failed"; if(ok)flash("Season saved");
    };
  }
}

/* ============================================================
   11. TEAM — you grant viewer access
   ============================================================ */
async function teamScreen(v){
  v.innerHTML=`
    <div class="card">
      <h3 style="font-size:15px; text-transform:uppercase; letter-spacing:.02em; margin-bottom:10px">Give someone access</h3>
      <p style="font-size:12px; color:var(--muted); margin:0 0 12px">They sign up first (choosing <b>Viewer</b>), then you add the email they used. Viewers can see your sheet, week, schedule and season — and comment on drills — but can't change anything.</p>
      <div class="inline"><input id="vemail" placeholder="coach@email.com" style="flex:1"><button class="btn btn-primary btn-sm" id="vadd">Give access</button></div>
    </div>
    <div class="sec-h"><h2>Your team</h2></div>
    <div class="card" id="vlist"><div class="load">Loading</div></div>`;
  document.getElementById("vadd").onclick=async()=>{
    const email=val("vemail").toLowerCase();
    const {data:found}=await sb.rpc("find_profile_by_email",{e:email});
    if(!found){ flash("No account with that email"); return; }
    const {error}=await sb.from("player_viewers").insert({player_id:me.id,viewer_id:found});
    if(error){ flash(error.message.includes("duplicate")?"Already has access":error.message); return; }
    flash("Access granted"); document.getElementById("vemail").value=""; teamScreen(v);
  };
  const {data}=await sb.from("player_viewers")
    .select("id, viewer_id, profiles!player_viewers_viewer_id_fkey(full_name, role)").eq("player_id",me.id);
  const box=document.getElementById("vlist");
  if(!data?.length){ box.innerHTML=`<div class="empty">Nobody has access yet.</div>`; return; }
  box.innerHTML=data.map(x=>`
    <div class="row-item">
      <span class="pill p-Technical">${esc(x.profiles?.role||"viewer")}</span>
      <div class="name">${esc(x.profiles?.full_name||"—")}</div>
      <button class="rowdel" data-id="${x.id}" title="Remove access">×</button>
    </div>`).join("");
  box.querySelectorAll(".rowdel").forEach(b=>b.onclick=async()=>{
    await sb.from("player_viewers").delete().eq("id",b.dataset.id); teamScreen(v);
  });
}

/* ============================================================
   6. COACH — PLAYERS
   ============================================================ */
async function coachPlayers(v){
  v.innerHTML=`
    <div class="card">
      <h3 style="font-size:15px; text-transform:uppercase; letter-spacing:.02em; margin-bottom:10px">Add a player</h3>
      <p style="font-size:12px; color:var(--muted); margin:0 0 12px">They sign up first (as a Player), then you link the email they used.</p>
      <div class="inline"><input id="pemail" placeholder="player@email.com" style="flex:1"><button class="btn btn-primary btn-sm" id="addp">Link</button></div>
    </div>
    <div class="sec-h"><h2>Your players</h2></div>
    <div class="card" id="plist"><div class="load">Loading</div></div>`;
  document.getElementById("addp").onclick=async()=>{
    const email=val("pemail").toLowerCase();
    const {data:found}=await sb.rpc("find_profile_by_email",{e:email});
    if(!found){ flash("No player with that email"); return; }
    const {error}=await sb.from("coach_players").insert({coach_id:me.id,player_id:found});
    if(error){ flash(error.message.includes("duplicate")?"Already linked":error.message); return; }
    flash("Player linked"); document.getElementById("pemail").value=""; boot();
  };
  const box=document.getElementById("plist");
  if(!players.length){ box.innerHTML=`<div class="empty">No players linked yet.</div>`; return; }
  box.innerHTML=players.map(p=>`<div class="row-item"><div class="name">${esc(p.name)}</div></div>`).join("");
}

/* ============================================================
   7. DRILL LIBRARY — full lookup fields
   ============================================================ */
async function library(v){
  v.innerHTML=`
    <div class="card">
      <h3 style="font-size:15px; text-transform:uppercase; letter-spacing:.02em; margin-bottom:12px">Add a drill</h3>
      <div class="field"><label class="mini">Name</label><input id="ln" placeholder="Iron Session 125-175"></div>
      <div class="grid2" style="margin-top:8px">
        <div><label class="mini">Category</label><select id="lc">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></div>
        <div><label class="mini">Default club(s)</label><input id="lk" placeholder="52/W/9/8/7"></div>
      </div>
      <div class="grid3" style="margin-top:8px">
        <div><label class="mini">Def. time</label><input id="lt" type="number" placeholder="20"></div>
        <div><label class="mini">Def. balls</label><input id="lb" type="number" placeholder="10"></div>
        <div><label class="mini">Distance</label><input id="ld" placeholder="125-175"></div>
      </div>
      <div class="grid3" style="margin-top:8px">
        <div><label class="mini">Def. mental</label><input id="lm" type="number" step="0.5" placeholder="6"></div>
        <div><label class="mini">Def. phys</label><input id="lp" type="number" step="0.5" placeholder="4.5"></div>
        <div><label class="mini">Why</label><input id="lw" placeholder="Performance"></div>
      </div>
      <div class="field" style="margin-top:8px"><label class="mini">Goal / pass criteria</label><input id="lg" placeholder="70% or more inside 5%"></div>
      <button class="btn btn-primary btn-sm" id="ladd" style="margin-top:12px; width:100%">Add to library</button>
    </div>
    <div class="sec-h"><h2>Library</h2><span class="meta" id="lcount"></span></div>
    <div class="card" id="llist"><div class="load">Loading</div></div>`;
  document.getElementById("ladd").onclick=async()=>{
    if(!val("ln")){ flash("Name the drill"); return; }
    const {error}=await sb.from("drills").insert({
      owner_id:me.id, name:val("ln"), category:val("lc"), default_club:val("lk"),
      default_minutes:num(val("lt")), default_balls:num(val("lb")), distance:val("ld"),
      default_mental:num(val("lm")), default_physical:num(val("lp")), why:val("lw"), goal:val("lg")});
    if(error){ flash(error.message); return; }
    flash("Drill added"); const {data:drills}=await sb.from("drills").select("*"); drillMap={}; (drills||[]).forEach(d=>drillMap[d.id]=d);
    ["ln","lk","lt","lb","ld","lm","lp","lw","lg"].forEach(i=>document.getElementById(i).value=""); loadLib();
  };
  loadLib();
  async function loadLib(){
    const {data}=await sb.from("drills").select("*").order("category").order("name");
    const box=document.getElementById("llist"); document.getElementById("lcount").textContent=(data?.length||0)+" drills";
    if(!data?.length){ box.innerHTML=`<div class="empty">No drills yet — add your first above.</div>`; return; }
    box.innerHTML=data.map(d=>`
      <div class="row-item">
        <span class="pill ${pillClass(d.category)}">${esc(d.category)}</span>
        <div class="name">${esc(d.name)}<small>${[d.default_club,d.distance,d.goal].filter(Boolean).map(esc).join(" · ")||"—"}</small></div>
        <span class="meta">${d.default_minutes||0}m · ${d.default_balls||0}b</span>
      </div>`).join("");
  }
}

/* ============================================================
   8. PROGRESS — category balance, last 7 days
   ============================================================ */
async function progress(v){
  const pid = me.role==="coach" ? (activePlayerId||players[0]?.id) : me.id;
  if(!pid){ v.innerHTML=`<div class="empty">Link a player first.</div>`; return; }
  const weekAgo=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const {data}=await sb.from("sessions").select("*, drills(category)").eq("player_id",pid).gte("logged_on",weekAgo);
  const byCat={}; CATS.forEach(c=>byCat[c]=0);
  let balls=0,mins=0; const days=new Set();
  (data||[]).forEach(s=>{ const c=s.drills?.category||"Technical"; byCat[c]=(byCat[c]||0)+(s.balls||0); balls+=s.balls||0; mins+=+s.minutes||0; days.add(s.logged_on); });
  const max=Math.max(1,...Object.values(byCat));
  const picker = me.role==="coach" && players.length
    ? `<select id="ppick" style="background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:700">${players.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join("")}</select>`
    : "";
  v.innerHTML=`
    <div class="sec-h"><h2>Last 7 days</h2>${picker}</div>
    <div class="stat-row">
      ${stat(data?.length||0,"Sessions")}${stat(Math.round(mins),"Minutes")}${stat(balls,"Balls")}${stat(days.size,"Days on")}
    </div>
    <div class="card">
      <h3 style="font-size:14px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:14px">Balls by category</h3>
      ${CATS.map(c=>`<div class="barwrap"><div class="lab"><span>${c}</span><span>${byCat[c]}</span></div><div class="bar"><i style="width:${Math.round(byCat[c]/max*100)}%"></i></div></div>`).join("")}
    </div>
    ${!data?.length?'<div class="empty" style="margin-top:14px">No sessions logged in the last 7 days.</div>':''}`;
  if(me.role==="coach" && players.length){ document.getElementById("ppick").onchange=e=>{ activePlayerId=e.target.value; progress(v); }; }
}
function stat(n,l){ return `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

boot();
</script>
